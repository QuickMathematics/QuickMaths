id: TRACK_MATH_ALGEBRA_FOUNDATIONS
schema_version: 0.2
name: 'Mathematics Foundations: Algebra, Calculus, Statistics, and Probability'
domain: Math
description: A rigorous path through arithmetic, pre-algebra, functions, domains and ranges, transformations, composition
  and inverses, exponents, sequences, polynomials, radicals, rational expressions and equations, rational functions
  and inequalities, interval notation, polynomial inequalities, quadratics, coordinate graphing, triangle area and
  measurement, linear equations, systems, logarithms, trigonometry, descriptive and inferential statistics, and
  probability, piecewise functions, average rates of change, limits, continuity, and the intermediate value theorem.
  Additional beginner and geometry pathways cover whole numbers, factors, fraction and decimal arithmetic, estimation,
  ratios, proportion, everyday percentages, units, scientific notation, plane and solid measurement, congruence,
  similarity, tolerances, and higher roots.
