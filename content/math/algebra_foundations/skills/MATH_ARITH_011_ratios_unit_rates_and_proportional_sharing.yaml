test:
  question_count: 20
  randomize_order: true
  questions:
  - id: ARITH011_EQUIV_RATIO
    type: generated
    prompt_template: A recipe uses 3 cups flour for every 2 cups water. If water is {water} cups, how much
      flour is needed?
    difficulty: medium
    answer_mode: final_only
    variables:
      k:
        type: int
        min: 2
        max: 8
    derived:
      water: 2*k
      flour: 3*k
    constraints: []
    answer:
      type: numeric
      value: '{flour}'
    grading:
      method: exact_numeric
    work:
      mode: none
    review_policy:
      work_review: none
      mastery_requires_review_pass: false
      allow_self_review: true
    explanation_template: The same ratio multiplies both recipe amounts by k; flour is 3 parts when water is
      2 parts.
    mistake_tags:
    - equivalent_ratios
    - recipe
  - id: ARITH011_RATIO_SECOND
    type: fixed
    prompt: Two quantities are in ratio 4:7 and differ by 21. Enter the larger quantity.
    difficulty: medium
    answer_mode: final_only
    answer:
      type: numeric
      value: '49'
    grading:
      method: exact_numeric
    work:
      mode: none
    review_policy:
      work_review: none
      mastery_requires_review_pass: false
      allow_self_review: true
    explanation_template: The ratio difference is 3 parts, so one part is 7 and the larger quantity is 7×7=49.
    mistake_tags:
    - ratio_from_difference
  - id: ARITH011_SIMPLIFY
    type: fixed
    prompt: Simplify 18:30 by entering the first term of the simplest ratio.
    difficulty: medium
    answer_mode: final_only
    answer:
      type: numeric
      value: '3'
    grading:
      method: exact_numeric
    work:
      mode: none
    review_policy:
      work_review: none
      mastery_requires_review_pass: false
      allow_self_review: true
    explanation_template: Divide 18 and 30 by 6 to obtain 3:5.
    mistake_tags:
    - simplify_ratio
  - id: ARITH011_UNIT_RATE
    type: fixed
    prompt: Convert 72 km/h to metres per second.
    difficulty: medium
    answer_mode: final_only
    answer:
      type: numeric
      value: '20'
    grading:
      method: exact_numeric
    work:
      mode: none
    review_policy:
      work_review: none
      mastery_requires_review_pass: false
      allow_self_review: true
    explanation_template: 72×1000÷3600=20 m/s; both distance and time units are converted.
    mistake_tags:
    - unit_conversion
    - rate
  - id: ARITH011_RATE_FORWARD
    type: generated
    prompt_template: A printer makes {rate} pages per minute for {minutes} minutes. Total pages?
    difficulty: medium
    answer_mode: final_only
    variables:
      rate:
        type: int
        min: 3
        max: 9
      minutes:
        type: int
        min: 4
        max: 12
    derived:
      pages: rate*minutes
    constraints: []
    answer:
      type: numeric
      value: '{pages}'
    grading:
      method: exact_numeric
    work:
      mode: none
    review_policy:
      work_review: none
      mastery_requires_review_pass: false
      allow_self_review: true
    explanation_template: Multiply the unit rate by the number of minutes.
    mistake_tags:
    - unit_rate
    - proportion
  - id: ARITH011_RATE_BACK
    type: generated
    prompt_template: A printer makes {pages} pages in {minutes} minutes. Pages per minute?
    difficulty: medium
    answer_mode: final_only
    variables:
      minutes:
        type: int
        min: 3
        max: 8
      rate:
        type: int
        min: 3
        max: 9
    derived:
      pages: rate*minutes
      unit: rate
    constraints: []
    answer:
      type: numeric
      value: '{unit}'
    grading:
      method: exact_numeric
    work:
      mode: none
    review_policy:
      work_review: none
      mastery_requires_review_pass: false
      allow_self_review: true
    explanation_template: Divide total pages by minutes to recover the constant unit rate.
    mistake_tags:
    - unit_rate
  - id: ARITH011_PARTS_TOTAL
    type: fixed
    prompt: In ratio 3:5, enter the number of total parts.
    difficulty: medium
    answer_mode: final_only
    answer:
      type: numeric
      value: '8'
    grading:
      method: exact_numeric
    work:
      mode: none
    review_policy:
      work_review: none
      mastery_requires_review_pass: false
      allow_self_review: true
    explanation_template: 'Add the ratio terms: 3+5=8 equal parts.'
    mistake_tags:
    - ratio_sharing
  - id: ARITH011_SHARE_FIRST
    type: fixed
    prompt: A learner shares 100 in ratio 2:3:5 as 20, 30, and 50. Which explanation is correct?
    difficulty: medium
    answer_mode: final_only
    answer:
      type: choice
      value: A
    grading:
      method: multiple_choice
    options:
    - id: A
      label: There are 10 parts, so one part is 10
    - id: B
      label: The ratio terms should be multiplied by 100 directly
    - id: C
      label: The largest share must equal the total
    - id: D
      label: The three shares should be equal
    work:
      mode: none
    review_policy:
      work_review: none
      mastery_requires_review_pass: false
      allow_self_review: true
    explanation_template: Adding 2+3+5 gives 10 parts; 100÷10=10 per part, producing 20, 30, and 50.
    mistake_tags:
    - ratio_sharing
    - error_analysis
  - id: ARITH011_SHARE_SECOND
    type: fixed
    prompt: Share 90 in ratio 2:3. Enter the second share.
    difficulty: medium
    answer_mode: final_only
    answer:
      type: numeric
      value: '54'
    grading:
      method: exact_numeric
    work:
      mode: none
    review_policy:
      work_review: none
      mastery_requires_review_pass: false
      allow_self_review: true
    explanation_template: There are 5 parts, so one part is 18 and the second share is 3×18=54.
    mistake_tags:
    - ratio_sharing
  - id: ARITH011_SHARE_VARIABLE
    type: generated
    prompt_template: A total of {total} is shared in ratio 2:3. Enter the first share.
    difficulty: medium
    answer_mode: final_only
    variables:
      k:
        type: int
        min: 4
        max: 15
    derived:
      total: 5*k
      share: 2*k
    constraints: []
    answer:
      type: numeric
      value: '{share}'
    grading:
      method: exact_numeric
    work:
      mode: none
    review_policy:
      work_review: none
      mastery_requires_review_pass: false
      allow_self_review: true
    explanation_template: The total has 5 ratio parts; one part is k and the first share has 2 parts.
    mistake_tags:
    - ratio_sharing
    - proportional_sharing
  - id: ARITH011_MAP
    type: fixed
    prompt: A map scale is 1 cm:5 km. How many centimetres represent 7 km?
    difficulty: medium
    answer_mode: final_only
    answer:
      type: numeric
      value: '1.4'
    grading:
      method: exact_numeric
    work:
      mode: none
    review_policy:
      work_review: none
      mastery_requires_review_pass: false
      allow_self_review: true
    explanation_template: 'Divide 7 km by 5 km per centimetre: 1.4 cm.'
    mistake_tags:
    - scale_drawing
    - double_number_line
  - id: ARITH011_MAP_VARIABLE
    type: generated
    prompt_template: A map uses 1 cm:{km} km. Enter kilometres represented by {cm} cm.
    difficulty: medium
    answer_mode: final_only
    variables:
      km:
        type: int
        min: 2
        max: 8
      cm:
        type: int
        min: 2
        max: 6
    derived:
      distance: km*cm
    constraints: []
    answer:
      type: numeric
      value: '{distance}'
    grading:
      method: exact_numeric
    work:
      mode: none
    review_policy:
      work_review: none
      mastery_requires_review_pass: false
      allow_self_review: true
    explanation_template: Multiply the kilometres per centimetre by the number of centimetres.
    mistake_tags:
    - scale_drawing
  - id: ARITH011_PART_WHOLE
    type: fixed
    prompt: If boys:girls=1:4 and these are the only groups, which fraction represents boys of the whole?
    difficulty: medium
    answer_mode: final_only
    answer:
      type: choice
      value: A
    grading:
      method: multiple_choice
    options:
    - id: A
      label: 1/5
    - id: B
      label: 1/4
    - id: C
      label: 4/5
    - id: D
      label: 4/1
    work:
      mode: none
    review_policy:
      work_review: none
      mastery_requires_review_pass: false
      allow_self_review: true
    explanation_template: There are 1+4=5 total parts, so boys are one fifth of the whole.
    mistake_tags:
    - part_to_whole
  - id: ARITH011_RATE_UNITS
    type: fixed
    prompt: Which rate is faster?
    difficulty: medium
    answer_mode: final_only
    answer:
      type: choice
      value: A
    grading:
      method: multiple_choice
    options:
    - id: A
      label: 3 m in 2 s
    - id: B
      label: 120 cm in 1 s
    - id: C
      label: They are equal
    - id: D
      label: The units cannot be compared
    work:
      mode: none
    review_policy:
      work_review: none
      mastery_requires_review_pass: false
      allow_self_review: true
    explanation_template: 3 m in 2 s is 1.5 m/s, while 120 cm in 1 s is 1.2 m/s.
    mistake_tags:
    - rate_comparison
    - mixed_units
  - id: ARITH011_COST
    type: generated
    prompt_template: '{count} notebooks cost {unit} dollars each. Enter total cost.'
    difficulty: medium
    answer_mode: final_only
    variables:
      count:
        type: int
        min: 3
        max: 9
      unit:
        type: int
        min: 2
        max: 7
    derived:
      cost: count*unit
    constraints: []
    answer:
      type: numeric
      value: '{cost}'
    grading:
      method: exact_numeric
    work:
      mode: none
    review_policy:
      work_review: none
      mastery_requires_review_pass: false
      allow_self_review: true
    explanation_template: At a constant unit price, total cost is count×price.
    mistake_tags:
    - proportion
    - money
  - id: ARITH011_DENOMINATOR
    type: fixed
    prompt: In 60 km/h, what does the denominator h mean?
    difficulty: medium
    answer_mode: final_only
    answer:
      type: choice
      value: B
    grading:
      method: multiple_choice
    options:
    - id: A
      label: Per 60 hours
    - id: B
      label: Per one hour
    - id: C
      label: A distance unit
    - id: D
      label: A total count
    work:
      mode: none
    review_policy:
      work_review: none
      mastery_requires_review_pass: false
      allow_self_review: true
    explanation_template: 'The denominator identifies the reference unit: 60 kilometres for each one hour.'
    mistake_tags:
    - unit_rate
    - meaning
  - id: ARITH011_FIXED_FEE
    type: fixed
    prompt: A shop charges 5 dollars per item plus a fixed 3 dollar fee. Is total cost directly proportional
      to item count?
    difficulty: medium
    answer_mode: final_only
    answer:
      type: choice
      value: B
    grading:
      method: multiple_choice
    options:
    - id: A
      label: Yes, every item costs 5 dollars
    - id: B
      label: No, the fixed 3 dollars does not scale with item count
    - id: C
      label: Yes, because 3 dollars is a ratio
    - id: D
      label: Only when the item count is zero
    work:
      mode: none
    review_policy:
      work_review: none
      mastery_requires_review_pass: false
      allow_self_review: true
    explanation_template: The additive 3 dollar fee means doubling item count does not double the total.
    mistake_tags:
    - proportionality
  - id: ARITH011_RATIO_CHECK
    type: generated
    prompt_template: A double number line aligns 4 red beads with 10 blue beads. At {blue} blue beads, how
      many red beads correspond?
    difficulty: medium
    answer_mode: final_only
    variables:
      k:
        type: int
        min: 2
        max: 6
    derived:
      blue: 10*k
      red: 4*k
    constraints: []
    answer:
      type: numeric
      value: '{red}'
    grading:
      method: exact_numeric
    work:
      mode: none
    review_policy:
      work_review: none
      mastery_requires_review_pass: false
      allow_self_review: true
    explanation_template: 'The same scale factor k applies down both number lines: 4k red matches 10k blue.'
    mistake_tags:
    - double_number_line
    - equivalent_ratios
  - id: ARITH011_REVERSE_WARNING
    type: fixed
    prompt: Which statement about 3:5 and 5:3 is correct?
    difficulty: medium
    answer_mode: final_only
    answer:
      type: choice
      value: C
    grading:
      method: multiple_choice
    options:
    - id: A
      label: They always mean the same ordered comparison
    - id: B
      label: They are both simplified to 1:1
    - id: C
      label: Reversing terms changes the ordered comparison
    - id: D
      label: Ratios have no order
    work:
      mode: none
    review_policy:
      work_review: none
      mastery_requires_review_pass: false
      allow_self_review: true
    explanation_template: The first and second quantities swap roles when the terms reverse.
    mistake_tags:
    - ratio_order
  - id: ARITH011_CAPSTONE
    type: fixed
    prompt: A community fund of $64 is shared between two teams in ratio 3:5. Enter the first team’s dollars.
    difficulty: hard
    answer_mode: final_plus_required_work
    answer:
      type: numeric
      value: '24'
    grading:
      method: exact_numeric
    work:
      mode: rubric_check
      prompt: Explain the model, show labelled calculations, and state units or assumptions. A final number
        alone is not enough.
      rubric:
        criteria:
        - id: criterion_1
          description: Adds ratio parts to obtain 8 equal parts and divides $64 by 8.
          weight: 2
        - id: criterion_2
          description: Multiplies the first ratio term by the value of one part to obtain $24.
          weight: 2
        - id: criterion_3
          description: Checks that the second share is $40, the total is $64, and 24:40 simplifies to 3:5 with
            units stated.
          weight: 2
    review_policy:
      work_review: tutor_required
      mastery_requires_review_pass: true
      allow_self_review: false
    explanation_template: There are 8 parts, so one part is $8. The first team receives 3×$8=$24 and the second
      $40; 24+40=$64 and 24:40=3:5.
    mistake_tags:
    - capstone_reasoning
    - model_selection
