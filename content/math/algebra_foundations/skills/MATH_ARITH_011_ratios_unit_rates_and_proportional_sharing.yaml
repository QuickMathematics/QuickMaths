id: MATH_ARITH_011
schema_version: '0.2'
name: Ratios, unit rates and proportional sharing
domain: Math
subdomain: Arithmetic
topic: Arithmetic Foundations
description: 'A ratio compares quantities by division or by a colon notation such as 3:5. The order matters:
  3 red beads to 5 blue beads is not the same statement as 5 red to 3 blue. A ratio can compare parts of on'
prerequisites:
- MATH_ARITH_004
- MATH_ARITH_009
unlocks: []
tags:
- arithmetic
- ratios
- unit_rates
- proportionality
- sharing
mastery:
  passing_score: 0.8
  minimum_confidence: 3
  max_guessing_allowed: maybe
  review_after_days_if_mastered: 7
  review_after_days_if_learning: 2
theory: 'A ratio compares quantities by division or by a colon notation such as 3:5. The order matters: 3 red
  beads to 5 blue beads is not the same statement as 5 red to 3 blue. A ratio can compare parts of one collection
  or two different units, but label the quantities so the comparison is interpretable. The ratio 3:5 means
  that for every 3 units of the first quantity there are 5 units of the second; it does not by itself say the
  collection has only 8 units.


  Equivalent ratios multiply or divide both parts by the same nonzero factor. 3:5, 6:10, and 15:25 describe
  the same relationship. To simplify 18:30, divide both entries by their GCF, 6, giving 3:5. Dividing only
  one side destroys equivalence. A ratio table keeps the paired values in columns, while a double number line
  places corresponding values at the same scaled positions. Both representations make the “same multiplier”
  visible and help detect a reversed or uneven scaling.


  A unit rate is a rate for one unit of the reference quantity. If 240 km takes 4 hours, the unit rate is 240÷4
  = 60 km per hour. The denominator tells what “per one” means. Cost per item, litres per minute, and pages
  per day are all unit rates; swapping numerator and denominator changes the question. A rate can be used forward
  by multiplying by the number of reference units, or backward by dividing a total by the unit rate. Carry
  units through every step so that 60 km/h is not mistaken for 60 hours/km.


  Proportional situations have a constant ratio or constant unit rate. If 3 notebooks cost $6, then 1 notebook
  costs $2 and 8 notebooks cost $16, assuming the same price rule. The relationship can be represented by a
  table, a double number line, an equation y=kx, or a graph through the origin. A fixed delivery fee breaks
  direct proportionality: two items may cost more than twice the cost of one if the fee is charged once. Check
  the context before extending a ratio.


  To share a total in a ratio, add the ratio parts to find the number of equal shares. For 3:5 and a total
  of 64, there are 8 parts, so one part is 64÷8=8. The first amount is 3×8=24 and the second is 5×8=40. Check
  24+40=64 and 24:40 simplifies back to 3:5. This is different from taking 3/5 of the total: the first share
  is 3/(3+5) of the total because the total includes both groups.


  Percent, fraction, and ratio language can connect, but do not silently switch reference bases. A ratio of
  1:4 means 1 out of 5 total parts if the two parts exhaust a whole, which is 20%, not 25%. A ratio of boys
  to girls 1:4 does not mean boys are 25% of all pupils unless those are the only two groups; it means one
  boy for every four girls. State whether a fraction is part-to-whole or part-to-part.


  Scale drawings and maps use ratios with units that may differ. A map scale 1 cm:5 km means 3 cm represents
  15 km. Convert units before comparing rates, and use a proportion with matched columns. A good table repeats
  the same multiplier down both columns. If one known pair is 4 tickets for $18, then 10 tickets at the same
  unit price cost $45; if the context has bulk discounts, that inference needs qualification.


  Read ratio questions in order: name the two quantities, decide whether the comparison is part-to-part or
  a rate, simplify or scale both entries, and verify units and totals. The capstone asks you to share a fixed
  total fairly according to a ratio and justify the part-to-whole calculation.

  A ratio table is a claim about correspondence, not merely a convenient arrangement of numbers. If 4 tickets
  cost 18 dollars and the relationship is proportional, every row has cost/tickets=4.50 dollars per ticket.
  A row such as 10 tickets for 40 dollars would signal a changed price rule, a discount, or an error. State
  which assumption you are using before extrapolating.


  Rates can be converted without changing the underlying relationship. For 60 km/h, multiplying numerator and
  denominator by 1000 and 3600 gives 1,000 m/3,600 s, or 16 2/3 m/s. The number changes because the reference
  units change, but the physical motion is the same. In a share, the ratio parts are dimensionless counts;
  the total carries dollars, grams, or people, so the value of one part inherits the total unit. These distinctions
  keep ratio arithmetic connected to the situation.

  '
examples:
- prompt: Simplify 18:30.
  solution: '3:5'
  explanation: Divide both terms by their GCF, 6.
- prompt: Give two ratios equivalent to 3:5.
  solution: 6:10 and 15:25
  explanation: Multiply both terms by 2 and by 5.
- prompt: 240 km takes 4 hours. Find km per hour.
  solution: 60 km/h
  explanation: Divide distance by time; the denominator is one hour.
- prompt: Three notebooks cost $6. At the same rate, what do 8 cost?
  solution: $16
  explanation: The unit price is $2, then 8×$2=$16.
- prompt: Share 64 in the ratio 3:5.
  solution: 24 and 40
  explanation: There are 8 total parts; each is 8.
- prompt: What does 3:5 mean in words?
  solution: Three of the first for every five of the second.
  explanation: Ratios preserve order and compare corresponding quantities.
- prompt: A map scale is 1 cm:5 km. What distance is 3 cm?
  solution: 15 km
  explanation: Multiply both scale entries by 3.
- prompt: Why is a fixed delivery fee not directly proportional to item count?
  solution: The total does not double when the item count doubles.
  explanation: The additive fee changes the ratio total/items.
- prompt: If 1 out of 4 girls is the ratio boys:girls, what fraction of all two-group pupils are boys?
  solution: 1/5
  explanation: One boy plus four girls makes five total parts.
- prompt: A machine makes 18 parts in 6 minutes. Find its unit rate.
  solution: 3 parts/minute
  explanation: Divide output by minutes; 18÷6=3.
applications:
- title: Recipes and mixtures
  description: Ingredient ratios scale a batch while keeping the same flavour or concentration.
- title: Travel and maps
  description: Unit rates convert distance and time, and scale ratios turn map measurements into real distances.
- title: Budgets and wages
  description: Prices per item and pay per hour support comparisons and forecasts with explicit reference units.
- title: Fair sharing
  description: A ratio allocates a total into proportional shares while a part-to-whole check verifies that
    nothing is lost.
