schema_version: 0.2
name: Coordinate plane
domain: Math
subdomain: Coordinate Graphing
description: Read and interpret points on the coordinate plane using x-coordinates,
  y-coordinates, axes, and quadrants.
prerequisites:
- MATH_ARITH_001
tags:
- coordinate_graphing
- coordinate_plane
- ordered_pairs
- x_coordinate
- y_coordinate
- quadrants
unlocks:
- MATH_GRAPH_002
mastery:
  passing_score: 0.8
  minimum_confidence: 3
  review_after_days_if_mastered: 7
  review_after_days_if_learning: 2
theory: 'The coordinate plane is a flat grid used to locate points.


  A point is written as an ordered pair: (x, y). The first number is the x-coordinate,
  and the second number is the y-coordinate.


  Why it matters:

  Coordinate graphing lets you turn numbers and equations into pictures. It is the
  foundation for graphing lines, slope, systems of equations, and many real-world
  models.


  Key ideas:

  1. The x-axis runs left and right.

  2. The y-axis runs up and down.

  3. The origin is (0, 0).

  4. Positive x-values move right, and negative x-values move left.

  5. Positive y-values move up, and negative y-values move down.


  Quadrants:

  - Quadrant I: x positive, y positive.

  - Quadrant II: x negative, y positive.

  - Quadrant III: x negative, y negative.

  - Quadrant IV: x positive, y negative.


  Example:

  The point (4, -3) means move 4 units right and 3 units down. It is in Quadrant IV.


  Common mistake:

  Do not switch the order. In (2, 7), x = 2 and y = 7. The first number is always
  x.

  '
examples:
- prompt: For the point (5, -2), what is the x-coordinate?
  solution: '5'
  explanation: The x-coordinate is the first number in the ordered pair.
- prompt: For the point (-4, 9), what is the y-coordinate?
  solution: '9'
  explanation: The y-coordinate is the second number in the ordered pair.
- prompt: Which quadrant contains the point (-3, -8)?
  solution: Quadrant III
  explanation: Both coordinates are negative, so the point is in Quadrant III.
- prompt: A point has x = 0 and y = 6. Which axis is it on?
  solution: y-axis
  explanation: When x = 0, the point lies on the y-axis.
applications:
- title: Graphing lines
  description: Lines are drawn by plotting coordinate points and connecting them.
- title: Maps and games
  description: Coordinate systems are used to locate positions on maps, grids, and
    game boards.
- title: Systems of equations
  description: Solutions to systems are points where graphs intersect on the coordinate
    plane.
