  - id: BRIDGE_RATE_PROOF
    type: fixed
    prompt_template: For f(x) = x^2, give the simplified expression for [f(x + h) - f(x)]/h and justify
      it for h != 0. Explain why the original quotient is still undefined at h = 0.
    variables: {}
    derived: {}
    constraints: []
    answer:
      type: symbolic_expression
      value: 2*x + h
      variable: x
    grading:
      method: symbolic_expression
    explanation_template: |-
      Expand the whole square: (x+h)^2 - x^2 = 2xh + h^2.
      Factor h(2x+h), then divide by h under the stated nonzero restriction.
      The simplified expression is 2x+h on that domain.
      At h=0 the original denominator is zero, so simplification does not supply an original quotient value.
    solution_steps: []
    mistake_tags: *id003
    difficulty: hard
    options: []
    max_attempts: 100
    answer_mode: final_plus_required_work
    work:
      mode: proof_obligations
      prompt: Give a complete argument. Address every listed obligation; a correct short answer alone
        is not enough.
      proof_policy:
        obligations:
        - Expands f(x+h) as (x+h)^2 rather than f(x)+h.
        - Subtracts f(x) and factors the numerator as h(2x+h).
        - Cancels h only under h != 0.
        - Distinguishes the simplified expression from the original undefined quotient at h = 0.
        accepted_strategies:
        - algebraic expansion and factorization
    review_policy:
      work_review: tutor_required
      mastery_requires_review_pass: true
      allow_self_review: false

