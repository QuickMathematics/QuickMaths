  - id: BRIDGE_RATE_SPEED
    type: fixed
    prompt_template: Position is s(t) = t^2 - 4t metres for 0 <= t <= 4 seconds. The object moves from
      s(0) = 0 to s(2) = -4 and then to s(4) = 0. Find average speed, in metres per second.
    variables: {}
    derived: {}
    constraints: []
    answer:
      type: numeric
      value: '2'
    grading:
      method: exact_numeric
    explanation_template: |-
      Total distance is 4 + 4 = 8 metres.
      Elapsed time is 4 seconds, so average speed is 8/4 = 2 m/s.
      Average velocity would be zero because net displacement is zero.
