theory: 'Scientific notation writes a nonzero number as a×10^n, where 1≤|a|<10 and n is an integer. The coefficient
  a carries the meaningful leading digits; the exponent n records how far the decimal point is from the displayed
  coefficient. For example, 4,700,000 = 4.7×10^6 and 0.000047 = 4.7×10^-5. The exponent is a count of place
  shifts, not a measurement unit and not the number of zeros in every written form.


  To convert a large number to scientific notation, move the decimal point left until one nonzero digit remains
  before it. Count left moves as a positive exponent. For a small positive number, move right and use a negative
  exponent. Restore the ordinary number by reversing the shifts. A zero has no normalized scientific notation
  because it has no first nonzero digit; write 0 separately. Negative values keep the negative sign in the
  coefficient, such as −3.2×10^4.


  Multiplication uses the product of coefficients and addition of exponents: (a×10^m)(b×10^n)=(ab)×10^(m+n).
  If |ab| is outside [1,10), normalize by shifting its decimal and adjusting the exponent. Example: (3×10^4)(2×10^3)=6×10^7.
  For 8×10^5 times 4×10^2, the raw coefficient 32 becomes 3.2 and the exponent 7 becomes 8, giving 3.2×10^8.
  Keep the coefficient and power parts separate until the final normalization.


  Division divides coefficients and subtracts exponents: (a×10^m)/(b×10^n)=(a/b)×10^(m−n), with b nonzero.
  If a/b is less than 1, normalize by moving the decimal right and reducing the exponent. For (6×10^7)/(2×10^3),
  the coefficient quotient is 3 and exponent difference is 4, so the result is 3×10^4. Check by multiplying
  the quotient by the divisor.


  Addition and subtraction require matching powers of ten first. You may rewrite 2.4×10^6 as 24×10^5, or rewrite
  7×10^5 as 0.7×10^6. Then combine coefficients with the same power: 2.4×10^6 + 0.7×10^6 = 3.1×10^6. Adding
  coefficients while ignoring different exponents is a common error: 2×10^6 + 3×10^4 is not 5×10^10. For widely
  separated exponents, an estimate may show that the smaller term changes only later digits, but keep it when
  an exact sum is requested.


  Orders of magnitude compare powers of ten. A value near 7×10^6 has order 10^6; a value 7×10^−6 has order
  10^−6. If “nearest order” is requested, compare the coefficient to √10≈3.16: 7×10^6 is closer on a logarithmic
  scale to 10^7 than 10^6, while 2×10^6 is closer to 10^6. In elementary comparisons, the exponent gives the
  main scale, then the coefficient breaks ties. State whether you mean exponent-based scale or nearest power,
  because those are different conventions.


  Scientific notation is especially helpful for unit conversions, astronomy, cells, computing storage, and
  rates with extreme scales. Keep units beside the coefficient and do not let a prefix such as micro- silently
  alter the exponent. Significant figures live in the coefficient: 4.70×10^3 has three significant figures,
  while 4.7×10^3 has two. Round only after arithmetic and normalize again after rounding. The capstone asks
  you to multiply two quantities with opposite exponents, normalize the coefficient, and explain why the exponents
  add.

  The exponent rules are consequences of place-value multiplication. Ten to the fourth times ten to the third
  is ten to the seventh because four place shifts followed by three more shifts make seven shifts. Division
  reverses those shifts, so a negative exponent naturally represents a reciprocal: 10^-3=1/1000. This interpretation
  helps when an answer is written in ordinary notation and prevents sign mistakes in exponent subtraction.


  Normalization is not optional decoration. A coefficient of 32 violates the convention 1≤|a|<10, so either
  shift its decimal point or leave it explicitly unnormalized and label it as an intermediate. After addition,
  subtraction, multiplication, or division, check the coefficient range and adjust the exponent exactly once.
  For addition with distant powers, align exponents before combining; for example, 2.0×10^8+3.0×10^5=2.003×10^8,
  not 5.0×10^13. The exponent indicates scale while the coefficient preserves the leading detail.


  Orders of magnitude are a comparison tool, not an automatic rounding answer. Two values with exponents differing
  by six are separated by a million before coefficient effects. When coefficients are close to a threshold
  such as 3.16 for nearest-power conventions, state the convention and compare the values rather than relying
  on the exponent alone. Units remain attached: 4×10^3 m and 4×10^3 kg have the same numerical scale but describe
  different quantities. Scientific notation makes that distinction visible when the unit is written beside
  the number.

  '
examples:
- prompt: Write 4,700,000 in scientific notation.
  solution: 4.7×10^6
  explanation: Move the decimal six places left.
- prompt: Write 0.000047 in scientific notation.
  solution: 4.7×10^-5
  explanation: Move the decimal five places right, so the exponent is negative.
- prompt: Multiply (3×10^4)(2×10^3).
  solution: 6×10^7
  explanation: Multiply coefficients and add exponents.
- prompt: Multiply (8×10^5)(4×10^2).
  solution: 3.2×10^8
  explanation: 8×4=32; normalize 32×10^7 to 3.2×10^8.
- prompt: Divide (6×10^7)/(2×10^3).
  solution: 3×10^4
  explanation: Divide coefficients and subtract exponents.
- prompt: Add 2.4×10^6 + 0.7×10^6.
  solution: 3.1×10^6
  explanation: The powers already match, so add coefficients.
- prompt: Rewrite 7×10^5 using 10^6.
  solution: 0.7×10^6
  explanation: Move the decimal one place left and increase the exponent.
- prompt: 'Which is larger: 5×10^−3 or 5×10^−4?'
  solution: 5×10^−3
  explanation: The exponent −3 represents ten times the size of −4 with equal coefficients.
- prompt: How many significant figures in 4.70×10^3?
  solution: '3'
  explanation: The coefficient 4.70 has three significant digits.
- prompt: What is the order-of-magnitude scale of 7×10^6 by exponent?
  solution: 10^6
  explanation: The written power is 10^6; nearest-power conventions should be stated separately.
applications:
- title: Astronomy and microscopy
  description: Scientific notation keeps distances, masses, and cell sizes readable while preserving scale.
- title: Computing and engineering
  description: Very large and small capacities, frequencies, and tolerances can be multiplied or divided by
    tracking exponents.
- title: Unit prefixes
  description: Nano-, micro-, kilo-, and mega-scale conversions are exponent changes attached to a physical
    unit.
- title: Data interpretation
  description: Orders of magnitude help compare populations or measurements before detailed arithmetic is attempted.
