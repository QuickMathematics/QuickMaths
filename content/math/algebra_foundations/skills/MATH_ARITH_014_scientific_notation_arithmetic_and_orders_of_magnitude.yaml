      label: 10^6
    - id: B
      label: 10^7
    - id: C
      label: 10^5
    - id: D
      label: 10^-6
    work:
      mode: none
    review_policy:
      work_review: none
      mastery_requires_review_pass: false
      allow_self_review: true
    explanation_template: The logarithmic midpoint between 10^6 and 10^7 is sqrt(10)×10^6. Since 7 exceeds
