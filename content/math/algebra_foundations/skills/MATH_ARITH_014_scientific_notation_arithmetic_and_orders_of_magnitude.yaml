          description: Multiplies coefficients and adds exponents to obtain 12.8×10^2 before normalization.
          weight: 2
        - id: criterion_2
          description: Normalizes 12.8×10^2 to 1.28×10^3 and converts it to 1280.
          weight: 2
        - id: criterion_3
          description: Explains why exponents add in multiplication and checks the scale or ordinary-number
            result.
          weight: 2
    review_policy:
      work_review: tutor_required
      mastery_requires_review_pass: true
      allow_self_review: false
    explanation_template: (3.2×4)×10^(5−3)=12.8×10^2=1.28×10^3=1280. The coefficient is normalized by moving
      the decimal one place left and increasing the exponent.
    mistake_tags:
    - capstone_reasoning
    - model_selection
