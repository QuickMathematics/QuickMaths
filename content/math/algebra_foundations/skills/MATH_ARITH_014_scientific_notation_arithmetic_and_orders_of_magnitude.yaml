test:
  question_count: 20
  randomize_order: true
  questions:
  - id: ARITH014_LARGE_NORMALIZE
    type: fixed
    prompt: Write 4,700,000 as a coefficient only (the coefficient in scientific notation).
    difficulty: medium
    answer_mode: final_only
    answer:
      type: numeric
      value: '4.7'
    grading:
      method: exact_numeric
    work:
      mode: none
    review_policy:
      work_review: none
      mastery_requires_review_pass: false
      allow_self_review: true
    explanation_template: 'Move six places left: 4.7×10^6.'
    mistake_tags:
    - notation
    - normalization
  - id: ARITH014_SMALL_EXPONENT
    type: fixed
    prompt: In 0.000047=4.7×10^n, enter n.
    difficulty: medium
    answer_mode: final_only
    answer:
      type: numeric
      value: '-5'
    grading:
      method: exact_numeric
    work:
      mode: none
    review_policy:
      work_review: none
      mastery_requires_review_pass: false
      allow_self_review: true
    explanation_template: The decimal moves five places right, so n is −5.
    mistake_tags:
    - notation
    - negative_exponent
  - id: ARITH014_MULTIPLY_COEFF
    type: generated
    prompt_template: Compute ({a}×10^4)({b}×10^3) and enter the coefficient before normalization.
    difficulty: medium
    answer_mode: final_only
    variables:
      a:
        type: int
        min: 2
        max: 4
      b:
        type: int
        min: 2
        max: 4
    derived:
      coefficient: a*b
    constraints: []
    answer:
      type: numeric
      value: '{coefficient}'
    grading:
      method: exact_numeric
    work:
      mode: none
    review_policy:
      work_review: none
      mastery_requires_review_pass: false
      allow_self_review: true
    explanation_template: Multiply coefficients separately; exponents add to 7 before any normalization.
    mistake_tags:
    - multiplication
    - exponents
  - id: ARITH014_MULTIPLY
    type: fixed
    prompt: A learner claims (3×10^4)(2×10^3)=6×10^12. What went wrong?
    difficulty: medium
    answer_mode: final_only
    answer:
      type: choice
      value: B
    grading:
      method: multiple_choice
    options:
    - id: A
      label: The coefficient must be added
    - id: B
      label: Exponents should be added, giving 6×10^7
    - id: C
      label: Exponents should be divided
    - id: D
      label: The product is correct
    work:
      mode: none
    review_policy:
      work_review: none
      mastery_requires_review_pass: false
      allow_self_review: true
    explanation_template: 10^4×10^3=10^(4+3), so the product is 6×10^7.
    mistake_tags:
    - conceptual_reasoning
  - id: ARITH014_NORMALIZE_32
    type: fixed
    prompt: For 32×10^7, enter the normalized coefficient.
    difficulty: medium
    answer_mode: final_only
    answer:
      type: numeric
      value: '3.2'
    grading:
      method: exact_numeric
    work:
      mode: none
    review_policy:
      work_review: none
      mastery_requires_review_pass: false
      allow_self_review: true
    explanation_template: Move the decimal one place left to make 3.2 and raise the exponent to 8.
    mistake_tags:
    - normalization
  - id: ARITH014_NORMALIZE_EXP
    type: fixed
    prompt: Which is the normalized form of (2×10^3)/(8×10^7)?
    difficulty: medium
    answer_mode: final_only
    answer:
      type: choice
      value: D
    grading:
      method: multiple_choice
    options:
