      label: 2.5×10^5
    - id: D
      label: 2.5×10^-5
    work:
      mode: none
    review_policy:
      work_review: none
      mastery_requires_review_pass: false
      allow_self_review: true
    explanation_template: The quotient is 0.25×10^-4. Multiplying its coefficient by 10 requires reducing its
      exponent by 1.
    mistake_tags:
    - conceptual_reasoning
  - id: ARITH014_DIVIDE
