      work:
        mode: procedural_steps
        prompt: "Start with the expression after substitution, then simplify one step at a time."
        line_type: expression
        minimum_steps: 2
        require_final_answer_match: true
      review_policy:
        work_review: auto
        mastery_requires_review_pass: false
      explanation_template: |
        Replace x with {x}.
        x - (-{b}) becomes {x} - (-{b}).
        Subtracting a negative means adding.
        {x} + {b} = {answer_value}.
      mistake_tags:
        - substitution_error
        - sign_error
        - opposite_error
        - arithmetic_error
      difficulty: medium

    - id: SUB_LINEAR_POSITIVE_COEFFICIENT_001
