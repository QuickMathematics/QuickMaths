id: MATH_PREALG_001
schema_version: 0.2
name: Variables and substitution
domain: Math
subdomain: Pre-Algebra
description: Evaluate expressions by replacing variables with given values and simplifying correctly.
prerequisites:
  - MATH_ARITH_002
tags:
  - pre_algebra
  - variables
  - substitution
  - expressions
  - order_of_operations
  - formulas
  - negative_values
unlocks:
  - MATH_PREALG_002
  - MATH_PREALG_005
mastery:
  passing_score: 0.8
  minimum_confidence: 3
  review_after_days_if_mastered: 7
  review_after_days_if_learning: 2
theory: |
  A variable is a letter that stands for a number.

  Substitution means replacing the variable with its given value.

  This matters because algebra expressions become numbers once you know the values of the variables. Later, this is how you will use formulas, graph equations, and check solutions.

  Method:
  1. Replace each variable with the value given in the problem.
  2. Use parentheses around negative substituted values when that makes the expression clearer.
  3. Simplify using order of operations.
  4. Keep multiplication clear. For example, 3x means 3 times x.
  5. Be careful when a variable appears more than once. Substitute the same value every time.

  Example:
  Evaluate 3x + 5 when x = 4.

  Substitute 4 for x:
  3(4) + 5 = 12 + 5 = 17.

  Negative values:
  If x = -3, then 4x means 4(-3), which equals -12.

  Exponent warning:
  If x = -3, then x^2 = (-3)^2 = 9.

  But -x^2 means -(x^2), so when x = -3:
  -x^2 = -((-3)^2) = -9.

  Common mistake:
  Do not forget parentheses around negative substituted values. Without parentheses, exponent and sign mistakes are easy.

  Another common mistake:
  Do not replace only one copy of a repeated variable. If x = 5, then x + x means 5 + 5, not just 5 + x.
examples:
  - prompt: "Evaluate: 4x + 7 when x = 3"
    solution: "19"
    explanation: "Replace x with 3: 4(3) + 7 = 12 + 7 = 19."
  - prompt: "Evaluate: 4x + 7 when x = -3"
    solution: "-5"
    explanation: "Replace x with -3: 4(-3) + 7 = -12 + 7 = -5."
  - prompt: "Evaluate: x - (-8) when x = -5"
    solution: "3"
    explanation: "Replace x with -5: -5 - (-8) = -5 + 8 = 3."
  - prompt: "Evaluate: x^2 - 5 when x = -4"
    solution: "11"
    explanation: "Replace x with -4: (-4)^2 - 5 = 16 - 5 = 11."
  - prompt: "Evaluate: -x^2 + 5 when x = -4"
    solution: "-11"
    explanation: "-x^2 means -(x^2), so -(-4)^2 + 5 = -16 + 5 = -11."
  - prompt: "Evaluate: 2a + 3b when a = 5 and b = -2"
    solution: "4"
    explanation: "Substitute both values: 2(5) + 3(-2) = 10 - 6 = 4."
  - prompt: "Evaluate: xy + 4 when x = -3 and y = 5"
    solution: "-11"
    explanation: "xy means x times y, so (-3)(5) + 4 = -15 + 4 = -11."
  - prompt: "Evaluate: 6(x - 2) when x = 9"
    solution: "42"
    explanation: "Substitute first, simplify inside parentheses, then multiply: 6(9 - 2) = 6(7) = 42."
applications:
  - title: "Using formulas"
    description: "Substitution lets you plug values into formulas for area, distance, cost, and speed."
  - title: "Checking answers"
    description: "You can substitute a proposed value into an expression or equation to see whether it works."
  - title: "Programming"
    description: "Variables in code store values, and expressions are evaluated after those values are known."
  - title: "Graphing"
    description: "Tables of values are made by substituting input values and calculating output values."
test:
  question_count: 20
  randomize_order: true
  questions:
    - id: SUB_SINGLE_ADD_SIGNED_001
      type: generated
      prompt_template: "Evaluate: x + {b} when x = {x}"
      answer_mode: final_plus_required_work
      variables:
        x:
          type: int
          min: -15
          max: 15
          exclude: [0]
        b:
          type: int
          min: -20
          max: 20
          exclude: [0]
      derived:
        answer_value: "x + b"
      answer:
        type: numeric
        value: "{answer_value}"
      grading:
        method: exact_numeric
      work:
        mode: procedural_steps
        prompt: "Start with the expression after substitution, then simplify one step at a time."
        line_type: expression
        minimum_steps: 2
        require_final_answer_match: true
      review_policy:
        work_review: auto
        mastery_requires_review_pass: false
      explanation_template: |
        Replace x with {x}.
        x + {b} becomes {x} + {b}.
        {x} + {b} = {answer_value}.
      mistake_tags:
        - substitution_error
        - sign_error
        - arithmetic_error
      difficulty: easy

    - id: SUB_SUBTRACT_NEGATIVE_001
