        mastery_requires_review_pass: false
      explanation_template: |
        Replace x with {x}.
        {a}x + {b} becomes {a}({x}) + {b}.
        {a} * {x} = {product}.
        {product} + {b} = {answer_value}.
      mistake_tags:
