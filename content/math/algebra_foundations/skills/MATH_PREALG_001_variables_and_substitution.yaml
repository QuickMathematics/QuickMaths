      answer_mode: final_plus_required_work
      variables:
        a:
          type: int
          min: 2
          max: 9
        b:
          type: int
          min: -18
          max: 18
          exclude: [0]
        x:
          type: int
          min: -10
          max: 10
          exclude: [0]
      derived:
        product: "a * x"
        answer_value: "product + b"
      answer:
        type: numeric
        value: "{answer_value}"
      grading:
        method: exact_numeric
      work:
        mode: procedural_steps
        prompt: "Start with the expression after substitution, then simplify one step at a time."
