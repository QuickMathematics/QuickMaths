        minimum_steps: 3
        require_final_answer_match: true
      review_policy:
        work_review: auto
        mastery_requires_review_pass: false
      explanation_template: |
        Substitute x = {x}.
        {a}(x + {b}) becomes {a}({x} + {b}).
        Inside parentheses: {x} + {b} = {group_value}.
        {a} * {group_value} = {answer_value}.
      mistake_tags:
        - substitution_error
        - grouping_error
        - sign_error
        - arithmetic_error
      difficulty: medium

