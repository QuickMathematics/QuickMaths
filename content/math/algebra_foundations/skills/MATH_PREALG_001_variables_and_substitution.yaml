      prompt_template: "Evaluate: x - (-{b}) when x = {x}"
      answer_mode: final_plus_required_work
      variables:
        x:
          type: int
          min: -15
          max: 15
          exclude: [0]
        b:
          type: int
          min: 1
          max: 15
      derived:
        answer_value: "x + b"
