      variables:
        a:
          type: int
          min: 2
          max: 8
        b:
          type: int
          min: 2
          max: 8
        m:
          type: int
          min: -8
          max: 8
          exclude: [0]
        n:
          type: int
          min: -8
          max: 8
          exclude: [0]
      derived:
        first_product: "a * m"
        second_product: "b * n"
        answer_value: "first_product + second_product"
      answer:
        type: numeric
        value: "{answer_value}"
      grading:
        method: exact_numeric
      work:
        mode: procedural_steps
        prompt: "Start with the expression after substitution, then simplify one step at a time."
        line_type: expression
        minimum_steps: 3
        require_final_answer_match: true
      review_policy:
        work_review: auto
        mastery_requires_review_pass: false
      explanation_template: |
        Substitute m = {m} and n = {n}.
        {a}m + {b}n becomes {a}({m}) + {b}({n}).
        {a} * {m} = {first_product}, and {b} * {n} = {second_product}.
        {first_product} + {second_product} = {answer_value}.
      mistake_tags:
        - substitution_error
        - coefficient_error
        - sign_error
        - arithmetic_error
      difficulty: medium

