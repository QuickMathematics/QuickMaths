      answer_mode: final_plus_required_work
      variables:
        x:
          type: int
          min: -9
          max: 9
          exclude: [0]
        y:
          type: int
          min: -9
          max: 9
          exclude: [0]
        c:
          type: int
          min: -15
          max: 15
          exclude: [0]
      derived:
        product: "x * y"
        answer_value: "product + c"
      answer:
        type: numeric
        value: "{answer_value}"
      grading:
        method: exact_numeric
      work:
        mode: procedural_steps
        prompt: "Start with the expression after substitution. Remember that xy means x times y."
        line_type: expression
        minimum_steps: 3
        require_final_answer_match: true
      review_policy:
        work_review: auto
        mastery_requires_review_pass: false
      explanation_template: |
        In xy, the variables are multiplied.
        xy + {c} becomes ({x})({y}) + {c}.
        {x} * {y} = {product}.
        {product} + {c} = {answer_value}.
      mistake_tags:
        - substitution_error
        - multiplication_error
        - implicit_multiplication_error
        - sign_error
        - arithmetic_error
      difficulty: medium

