          min: -12
          max: 12
          exclude: [0]
        x:
          type: int
          min: -12
          max: 12
          exclude: [0]
      derived:
        group_value: "x + b"
        answer_value: "a * group_value"
      constraints:
        - "group_value != 0"
      answer:
        type: numeric
        value: "{answer_value}"
      grading:
        method: exact_numeric
      work:
        mode: procedural_steps
        prompt: "Start with the expression after substitution, simplify the parentheses, then multiply."
