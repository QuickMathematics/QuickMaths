        line_type: expression
        minimum_steps: 4
        require_final_answer_match: true
      review_policy:
        work_review: auto
        mastery_requires_review_pass: false
      explanation_template: |
        Substitute x = {x} and y = {y}.
        {a}x^2 - {b}y becomes {a}({x})^2 - {b}({y}).
        ({x})^2 = {square_value}, so {a} * {square_value} = {first_value}.
        {b} * {y} = {second_value}.
        {first_value} - {second_value} = {answer_value}.
      mistake_tags:
        - substitution_error
        - order_error
        - exponent_error
        - sign_error
        - arithmetic_error
