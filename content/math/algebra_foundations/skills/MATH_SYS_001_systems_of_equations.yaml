id: MATH_SYS_001
schema_version: 0.2
name: Systems of equations
domain: Math
subdomain: Systems of Equations
description: Solve and classify systems of two linear equations.
prerequisites:
  - MATH_GRAPH_005
  - MATH_ALG_004
tags:
  - systems_of_equations
  - linear_equations
  - graphing
  - substitution
  - intersections
  - no_solution
  - infinite_solutions
unlocks: []
mastery:
  passing_score: 0.8
  minimum_confidence: 3
  review_after_days_if_mastered: 7
  review_after_days_if_learning: 2
theory: |
  A system of equations is a set of equations that must be true at the same time.

  For two linear equations, the solution is the point where the two lines intersect. That point gives an x-value and a y-value that make both equations true.

  Why it matters:
  Systems model situations where two conditions must both be satisfied, such as comparing two prices, two distances, or two linear patterns.

  Main cases:
  1. One solution: the lines cross at one point.
  2. No solution: the lines are parallel and never cross.
  3. Infinitely many solutions: the two equations describe the same line.

  Choosing a method:
  1. If both equations are solved for the same variable, set the two expressions equal.
  2. If one equation already isolates a variable, substitution is usually the cleanest method.
  3. If adding or subtracting the equations will cancel a variable, use elimination.
  4. If you only need to classify lines in slope-intercept form, compare slopes and y-intercepts first.

  Equal-expression method:
  Solve y = 2x + 3 and y = -x + 12.
  Set the right-hand sides equal: 2x + 3 = -x + 12.
  Add x: 3x + 3 = 12.
  Subtract 3: 3x = 9.
  Divide by 3: x = 3.
  Substitute: y = 2(3) + 3 = 9.
  The solution is (3, 9).

  Substitution:
  Replace an isolated variable with the equivalent expression from the other equation.

  Example:
  Solve x = y + 1 and 2x + y = 11.
  Substitute y + 1 for x: 2(y + 1) + y = 11.
  Simplify: 3y + 2 = 11, so y = 3.
  Then x = y + 1 = 4.
  The solution is (4, 3).

  Elimination:
  Add or subtract equations so one variable cancels.

  Example:
  Solve x + y = 10 and x - y = 2.
  Add the equations: 2x = 12, so x = 6.
  Substitute into x + y = 10: y = 4.
  The solution is (6, 4).

  Checking a solution:
  Substitute the ordered pair into both original equations. A point is a solution only when it makes both equations true.

  Common mistakes:
  - Do not stop after finding one coordinate. A system solution is an ordered pair.
  - Do not substitute into only one equation when checking.
  - Keep equations aligned when eliminating so like variable terms combine correctly.
examples:
  - prompt: "For y = x + 4 and y = -x + 10, what is the x-coordinate of the solution?"
    solution: "3"
    explanation: "Set x + 4 = -x + 10. Then 2x = 6, so x = 3."
  - prompt: "For y = 2x + 1 and y = -x + 10, what is the y-coordinate of the solution?"
    solution: "7"
    explanation: "The equations meet at x = 3. Substitute into y = 2x + 1 to get y = 7."
  - prompt: "Classify the system: y = 4x + 1 and y = 4x - 6"
    solution: "No solution"
    explanation: "The slopes are the same but the y-intercepts are different, so the lines are parallel."
  - prompt: "Classify the system: y = -2x + 5 and 2x + y = 5"
    solution: "Infinitely many solutions"
    explanation: "Both equations describe the same line."
  - prompt: "Solve by substitution: x = y + 1 and 2x + y = 11"
    solution: "(4, 3)"
    explanation: "Substitute y + 1 for x, solve 2(y + 1) + y = 11, then use x = y + 1."
  - prompt: "Solve by elimination: x + y = 10 and x - y = 2"
    solution: "(6, 4)"
    explanation: "Add the equations to get 2x = 12, then substitute x = 6 to find y = 4."
  - prompt: "Does (3, 7) solve y = 2x + 1 and x + y = 10?"
    solution: "Yes"
    explanation: "The point makes both equations true: 7 = 2(3) + 1 and 3 + 7 = 10."
  - prompt: "Which method is most direct for x = 2y - 5 and 3x + y = 8?"
    solution: "Substitution"
    explanation: "One variable is already isolated, so substitute 2y - 5 for x."
applications:
  - title: "Comparing costs"
    description: "Systems can show when two pricing plans cost the same."
  - title: "Motion problems"
    description: "Systems can model when two moving objects meet."
  - title: "Graphing"
    description: "The solution to a linear system is the intersection point of the two graphs."
test:
  question_count: 8
  randomize_order: true
  questions:
    - id: SYSTEM_X_COORD_SLOPE_INTERCEPT_001
      type: generated
      prompt_template: "For the system y = {m1}x + {b1} and y = {m2}x + {b2}, what is the x-coordinate of the solution?"
      answer_mode: final_plus_required_work
      max_attempts: 300
      variables:
        x:
          type: int
          min: -8
          max: 8
          exclude: [0]
        m1:
          type: int
          min: -8
          max: 8
          exclude: [0, 1, -1]
        b1:
          type: int
          min: -15
          max: 15
          exclude: [0]
        m2:
          type: int
          min: -8
          max: 8
          exclude: [0, 1, -1]
      derived:
        y: "m1 * x + b1"
        b2: "y - m2 * x"
      constraints:
        - "m1 != m2"
        - "b2 != 0"
        - "b2 != b1"
      answer:
        type: numeric
        value: "{x}"
      grading:
        method: exact_numeric
      work:
        mode: procedural_steps
        prompt: "Set the two right-hand sides equal and show each equivalent equation step, ending with x = your final answer."
        line_type: equation
        target_variable: x
        minimum_steps: 3
        require_final_answer_match: true
      review_policy:
        work_review: auto
        mastery_requires_review_pass: false
      explanation_template: |
        At the intersection, both equations have the same y-value.
        Set the right sides equal: {m1}x + {b1} = {m2}x + {b2}.
        Solving gives x = {x}.
      mistake_tags:
        - systems_error
        - slope_intercept_form
        - inverse_operations
        - arithmetic_error
      difficulty: easy

    - id: SYSTEM_Y_COORD_SLOPE_INTERCEPT_001
      type: generated
      prompt_template: "For the system y = {m1}x + {b1} and y = {m2}x + {b2}, what is the y-coordinate of the solution?"
      answer_mode: final_plus_required_work
      max_attempts: 300
      variables:
        x:
          type: int
          min: -8
          max: 8
          exclude: [0]
        m1:
          type: int
          min: -8
          max: 8
          exclude: [0, 1, -1]
        b1:
          type: int
          min: -15
          max: 15
          exclude: [0]
        m2:
          type: int
          min: -8
          max: 8
          exclude: [0, 1, -1]
      derived:
        y: "m1 * x + b1"
        b2: "y - m2 * x"
      constraints:
        - "m1 != m2"
        - "b2 != 0"
        - "b2 != b1"
        - "y != 0"
      answer:
        type: numeric
        value: "{y}"
      grading:
        method: exact_numeric
      work:
        mode: capture_only
        prompt: "Show how you find x, then substitute that value into either equation to find y."
      review_policy:
        work_review: none
        mastery_requires_review_pass: false
      explanation_template: |
        First find the x-value where the two equations are equal.
        The equations meet at x = {x}.
        Substitute into the first equation: y = {m1}({x}) + {b1} = {y}.
      mistake_tags:
        - systems_error
        - substitution_error
        - slope_intercept_form
        - arithmetic_error
      difficulty: medium

    - id: SYSTEM_SUBSTITUTION_X_GIVEN_001
      type: generated
      prompt_template: "Solve the system. What is y? x = {x} and y = {m}x + {b}"
      answer_mode: final_plus_required_work
      variables:
        x:
          type: int
          min: -12
          max: 12
          exclude: [0]
        m:
          type: int
          min: -8
          max: 8
          exclude: [0, 1, -1]
        b:
          type: int
          min: -20
          max: 20
          exclude: [0]
      derived:
        y: "m * x + b"
      constraints:
        - "y != 0"
      answer:
        type: numeric
        value: "{y}"
      grading:
        method: exact_numeric
      work:
        mode: procedural_steps
        prompt: "Substitute the given x-value and show equivalent equation steps, ending with y = your final answer."
        line_type: equation
        target_variable: y
        minimum_steps: 2
        require_final_answer_match: true
      review_policy:
        work_review: auto
        mastery_requires_review_pass: false
      explanation_template: |
        The first equation gives x = {x}.
        Substitute into the second equation.
        y = {m}({x}) + {b} = {y}.
      mistake_tags:
        - systems_error
        - substitution_error
        - sign_error
        - arithmetic_error
      difficulty: easy

    - id: SYSTEM_ELIMINATION_SUM_DIFF_X_001
      type: generated
      prompt_template: "For the system x + y = {sum_value} and x - y = {diff_value}, what is x?"
      answer_mode: final_plus_required_work
      variables:
        x:
          type: int
          min: -12
          max: 12
          exclude: [0]
        y:
          type: int
          min: -12
          max: 12
          exclude: [0]
      derived:
        sum_value: "x + y"
        diff_value: "x - y"
      constraints:
        - "sum_value != 0"
        - "diff_value != 0"
      answer:
        type: numeric
        value: "{x}"
      grading:
        method: exact_numeric
      work:
        mode: procedural_steps
        prompt: "Add the equations so y cancels, then show equivalent equation steps ending with x = your final answer."
        line_type: equation
        target_variable: x
        minimum_steps: 3
        require_final_answer_match: true
      review_policy:
        work_review: auto
        mastery_requires_review_pass: false
      explanation_template: |
        Add the equations:
        (x + y) + (x - y) = {sum_value} + {diff_value}.
        The y-terms cancel, giving 2x = {sum_value + diff_value}.
        So x = {x}.
      mistake_tags:
        - systems_error
        - elimination_error
        - arithmetic_error
      difficulty: medium

    - id: SYSTEM_ELIMINATION_SUM_DIFF_Y_001
      type: generated
      prompt_template: "For the system x + y = {sum_value} and x - y = {diff_value}, what is y?"
      answer_mode: final_plus_required_work
      variables:
        x:
          type: int
          min: -12
          max: 12
          exclude: [0]
        y:
          type: int
          min: -12
          max: 12
          exclude: [0]
      derived:
        sum_value: "x + y"
        diff_value: "x - y"
      constraints:
        - "sum_value != 0"
        - "diff_value != 0"
      answer:
        type: numeric
        value: "{y}"
      grading:
        method: exact_numeric
      work:
        mode: procedural_steps
        prompt: "Subtract the second equation from the first so x cancels, then show equivalent equation steps ending with y = your final answer."
        line_type: equation
        target_variable: y
        minimum_steps: 3
        require_final_answer_match: true
      review_policy:
        work_review: auto
        mastery_requires_review_pass: false
      explanation_template: |
        Subtract the second equation from the first:
        (x + y) - (x - y) = {sum_value} - {diff_value}.
        The x-terms cancel, giving 2y = {sum_value - diff_value}.
        So y = {y}.
      mistake_tags:
        - systems_error
        - elimination_error
        - arithmetic_error
        - sign_error
      difficulty: medium

    - id: SYSTEM_CLASSIFY_NO_SOLUTION_001
      type: generated
      prompt_template: "Classify the system: y = {m}x + {b1} and y = {m}x + {b2}"
      answer_mode: final_plus_required_work
      variables:
        m:
          type: int
          min: -8
          max: 8
          exclude: [0, 1, -1]
        b1:
          type: int
          min: -20
          max: 20
          exclude: [0]
        b2:
          type: int
          min: -20
          max: 20
          exclude: [0]
      constraints:
        - "b1 != b2"
      options:
        - id: A
          label: "One solution"
        - id: B
          label: "No solution"
        - id: C
          label: "Infinitely many solutions"
      answer:
        type: multiple_choice
        value: "B"
      grading:
        method: multiple_choice
      work:
        mode: capture_only
        prompt: "Explain how the slopes and y-intercepts determine the number of solutions."
      review_policy:
        work_review: none
        mastery_requires_review_pass: false
      explanation_template: |
        The two lines have the same slope, {m}, but different y-intercepts, {b1} and {b2}.
        They are parallel and never intersect.
        The system has no solution.
      mistake_tags:
        - systems_classification
        - no_solution
        - parallel_lines
        - slope_error
      difficulty: medium

    - id: SYSTEM_CLASSIFY_INFINITE_SOLUTIONS_001
      type: generated
      prompt_template: "Classify the system: y = {m}x + {b} and {a}y = {am}x + {ab}"
      answer_mode: final_plus_required_work
      variables:
        m:
          type: int
          min: -6
          max: 6
          exclude: [0, 1, -1]
        b:
          type: int
          min: -12
          max: 12
          exclude: [0]
        a:
          type: int
          min: 2
          max: 6
      derived:
        am: "a * m"
        ab: "a * b"
      options:
        - id: A
          label: "One solution"
        - id: B
          label: "No solution"
        - id: C
          label: "Infinitely many solutions"
      answer:
        type: multiple_choice
        value: "C"
      grading:
        method: multiple_choice
      work:
        mode: capture_only
        prompt: "Rewrite or compare the equations and explain why they describe the same line."
      review_policy:
        work_review: none
        mastery_requires_review_pass: false
      explanation_template: |
        Divide the second equation by {a}.
        {a}y = {am}x + {ab} becomes y = {m}x + {b}.
        Both equations describe the same line, so there are infinitely many solutions.
      mistake_tags:
        - systems_classification
        - infinite_solutions
        - equivalent_equations
        - division_error
      difficulty: hard

    - id: SYSTEM_CLASSIFY_ONE_SOLUTION_001
      type: generated
      prompt_template: "Classify the system: y = {m1}x + {b1} and y = {m2}x + {b2}"
      answer_mode: final_plus_required_work
      variables:
        m1:
          type: int
          min: -8
          max: 8
          exclude: [0, 1, -1]
        m2:
          type: int
          min: -8
          max: 8
          exclude: [0, 1, -1]
        b1:
          type: int
          min: -20
          max: 20
          exclude: [0]
        b2:
          type: int
          min: -20
          max: 20
          exclude: [0]
      constraints:
        - "m1 != m2"
      options:
        - id: A
          label: "One solution"
        - id: B
          label: "No solution"
        - id: C
          label: "Infinitely many solutions"
      answer:
        type: multiple_choice
        value: "A"
      grading:
        method: multiple_choice
      work:
        mode: capture_only
        prompt: "Explain how the slopes show that the two lines intersect exactly once."
      review_policy:
        work_review: none
        mastery_requires_review_pass: false
      explanation_template: |
        The slopes are different: {m1} and {m2}.
        Lines with different slopes intersect at exactly one point.
        The system has one solution.
      mistake_tags:
        - systems_classification
        - one_solution
        - slope_error
      difficulty: hard
