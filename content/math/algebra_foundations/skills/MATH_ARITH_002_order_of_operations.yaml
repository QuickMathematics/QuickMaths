id: MATH_ARITH_002
schema_version: 0.2
name: Order of operations
domain: Math
subdomain: Arithmetic Foundations
description: Evaluate arithmetic expressions using grouping, exponents, multiplication and division, and addition and subtraction in the correct order.
prerequisites:
  - MATH_ARITH_001
tags:
  - arithmetic
  - order_of_operations
  - integers
  - expressions
  - exponents
  - grouping
unlocks:
  - MATH_PREALG_001
mastery:
  passing_score: 0.8
  minimum_confidence: 3
  review_after_days_if_mastered: 7
  review_after_days_if_learning: 2
theory: |
  Order of operations tells you which parts of an expression to simplify first.

  This matters because the same numbers can give different answers depending on the order. For example, 2 + 3 * 4 is 14, not 20, because multiplication happens before addition.

  Method:
  1. Simplify inside grouping symbols first, such as parentheses.
  2. Evaluate exponents.
  3. Multiply and divide from left to right.
  4. Add and subtract from left to right.

  Multiplication does not always happen before division. They have the same priority, so you work from left to right.

  Example:
  20 / 5 * 2 = 4 * 2 = 8.

  Addition does not always happen before subtraction. They have the same priority, so you work from left to right.

  Example:
  10 - 7 + 4 = 3 + 4 = 7.

  Parentheses can completely change the value.

  Example:
  6 + 2 * (8 - 5) = 6 + 2 * 3 = 6 + 6 = 12.

  Be careful with negative numbers and exponents:
  - (-3)^2 = 9 because the negative number is grouped.
  - -3^2 = -9 because the exponent applies to 3 first, then the negative sign is applied.

  Common mistake:
  Do not always work left to right. In 5 + 4 * 3, multiply first: 5 + 12 = 17.

  But when operations have the same priority, do work left to right. For example, 20 / 5 * 2 = 4 * 2 = 8.
examples:
  - prompt: "Compute: 7 + 3 * 4"
    solution: "19"
    explanation: "Multiply first: 3 * 4 = 12, then add 7."
  - prompt: "Compute: (7 + 3) * 4"
    solution: "40"
    explanation: "Parentheses first: 7 + 3 = 10, then multiply by 4."
  - prompt: "Compute: 18 / 3 * 2"
    solution: "12"
    explanation: "Multiplication and division have the same priority, so work left to right: 18 / 3 = 6, then 6 * 2 = 12."
  - prompt: "Compute: 10 - 7 + 4"
    solution: "7"
    explanation: "Addition and subtraction have the same priority, so work left to right: 10 - 7 = 3, then 3 + 4 = 7."
  - prompt: "Compute: 5 + 2^3 * 4"
    solution: "37"
    explanation: "Evaluate the exponent first, then multiply, then add."
  - prompt: "Compute: (-3)^2"
    solution: "9"
    explanation: "The negative number is grouped, so (-3)^2 means (-3)(-3) = 9."
  - prompt: "Compute: -3^2"
    solution: "-9"
    explanation: "The exponent happens before the leading negative sign, so -3^2 means -(3^2) = -9."
  - prompt: "Compute: 8 + 6 * 0"
    solution: "8"
    explanation: "Multiply first: 6 * 0 = 0, then 8 + 0 = 8."
applications:
  - title: "Algebra substitution"
    description: "After replacing variables with numbers, order of operations tells you how to evaluate the expression."
  - title: "Programming"
    description: "Code evaluates expressions using precedence rules, so order matters in formulas and conditions."
  - title: "Science formulas"
    description: "Physics and chemistry formulas often combine grouping, multiplication, division, and powers."
  - title: "Spreadsheets and calculators"
    description: "Spreadsheet formulas and calculators follow order rules, so parentheses are often needed to get the intended result."
