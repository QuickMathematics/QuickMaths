      type: generated
      prompt_template: "Compute: {a} + {b} * {c}"
      answer_mode: final_plus_required_work
      variables:
        a:
          type: int
          min: 2
          max: 20
        b:
          type: int
          min: 2
          max: 12
        c:
          type: int
          min: 2
          max: 12
      derived:
        product: "b * c"
        answer_value: "a + product"
      answer:
        type: numeric
        value: "{answer_value}"
      grading:
        method: exact_numeric
      work:
        mode: procedural_steps
        prompt: "Show the whole expression after each simplification step, one expression per line."
        line_type: expression
        minimum_steps: 2
        require_final_answer_match: true
      review_policy:
        work_review: auto
        mastery_requires_review_pass: false
      explanation_template: |
        Multiply before adding.
        {b} * {c} = {product}.
        {a} + {product} = {answer_value}.
      mistake_tags:
        - order_error
        - multiplication_error
        - arithmetic_error
      difficulty: easy

