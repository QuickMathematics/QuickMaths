id: MATH_ALG_009
schema_version: '0.2'
name: Direct and inverse proportion
domain: Math
subdomain: Algebra
topic: Proportional reasoning
description: A proportional model describes a particular relationship between quantities. You must identify
  the quantities, their units, and the conditions under which the model makes sense. A table or graph can suggest
  a model; an unexplained pattern in a few measurements is not a proof that the model will work everywhere.
prerequisites:
- MATH_ARITH_011
- MATH_FUNC_001
- MATH_ALG_001
tags:
- algebra
- proportion
- unit_rates
- model_assumptions
unlocks: []
mastery:
  passing_score: 0.8
  minimum_confidence: 3
  review_after_days_if_mastered: 7
  review_after_days_if_learning: 2
theory: 'A proportional model describes a particular relationship between quantities. You must identify the
  quantities, their units, and the conditions under which the model makes sense. A table or graph can suggest
  a model; an unexplained pattern in a few measurements is not a proof that the model will work everywhere.


  Direct proportion means y = kx with one fixed constant k on the stated domain. For x not zero, y/x = k. If
  each metre of identical ribbon costs 3 currency units and there is no extra fee, 2 metres costs 6 and 5 metres
  costs 15. Doubling the length doubles the cost. The unit rate is 3 currency units per metre. Zero metres
  costs zero, so the complete mathematical line goes through the origin. In a context, only nonnegative lengths
  may make sense even though the formula can accept negative inputs.


  Find k by dividing an output by its matching nonzero input, not by dividing two outputs from different rows.
  If y = 18 when x = 6, then k = 18/6 = 3. Use y = 3x to find another output, or divide y by 3 to recover an
  input. A ratio table scales both quantities by the same factor. The factor may be a fraction: halving a quantity
  halves its directly proportional partner. Matching units matters: convert minutes to hours before comparing
  rates quoted per hour.


  A straight line is not automatically direct proportion. A delivery charge y = 3x + 5 is linear, but the fixed
  fee makes y/x depend on x. For x = 1 the ratio is 8; for x = 2 it is 11/2. The graph does not pass through
  the origin, and doubling x does not double y. A constant difference between consecutive outputs shows a constant
  slope when inputs have equal steps; it does not by itself show a constant output-to-input ratio. In contrast,
  for y = 3x, both the slope and the direct-proportion test agree.


  Inverse proportion means y = k/x with a fixed nonzero k on a domain excluding x = 0. The product xy = k remains
  fixed. If a fixed 24-litre supply is shared equally among x identical containers, each receives y = 24/x
  litres. Twice as many containers means half as much in each, and three times as many means one third as much.
  The constant has units of the product: in this example container-count times litres per container gives the
  fixed number of litres. With x as a positive count, only positive integer inputs are physically possible
  even if a smooth curve helps show the pattern.


  Find an inverse constant by multiplying a matched input and output. If y = 8 when x = 3, then k = 24; y =
  24/x gives y = 4 at x = 6. To find x from y, solve xy = k, so x = k/y when y is nonzero. Do not use y/x here:
  that ratio changes. For positive k and positive inputs, the graph curves down as x grows. It approaches the
  axes without meeting them. The point x = 0 is excluded, not a hidden value on the vertical axis, and the
  curve must not be drawn across that gap.


  Not every decreasing relationship is inverse proportion. The rule y = 10 - x decreases but its product xy
  is not fixed: at x = 2 the product is 16, while at x = 3 it is 21. Likewise, not every increasing relationship
  is direct: y = x squared has ratios x, not one constant. Check the invariant the definition requires. For
  direct proportion test y/x wherever x is nonzero and include the origin when the domain includes zero. For
  inverse proportion test xy and exclude zero from the input domain. A single matching pair cannot distinguish
  the models; both can be made to pass through one nonzero point.


  Real situations need assumptions. More workers may shorten a job in inverse proportion only when the amount
  of work is fixed, workers have equal constant productivity, and they can work independently without delays.
  Doubling workers need not halve travel time or a task with a single shared machine. A constant-speed journey
  has distance directly proportional to time, whereas time is inversely proportional to speed for a fixed distance.
  Naming which quantity is fixed prevents these statements from being confused.


  Representations should tell the same story. Use a table to test the ratio or product, an equation to calculate
  exact values, and a graph to see shape and domain. Axis scales may differ, so the angle a line seems to make
  on screen is not its numerical slope. The generated graphs in this lesson are drawn from the stated formula
  and parameters, not from a hidden answer. Explain why you selected a model, state its restrictions, and verify
  a result in the original relation. The reviewed capstone compares direct proportion, a line with an intercept
  and inverse proportion; selecting a familiar formula without justification is insufficient.'
examples:
- prompt: Ribbon costs 3 units per metre with no fixed charge. Cost of 5 m?
  solution: 15 units
  explanation: y=3x; 3 times 5=15. The unit rate is currency per metre.
- prompt: y is directly proportional to x; y=18 when x=6. Find k.
  solution: '3'
  explanation: 'Divide matching values: k=y/x=18/6. The model is y=3x.'
- prompt: Use y=3x to find x when y=27.
  solution: '9'
  explanation: Solve 27=3x. Dividing both sides by3 gives x=9.
- prompt: Do pairs (2,6),(4,12),(7,21) fit direct proportion?
  solution: Yes, k=3
  explanation: Each y/x is3; both quantities scale together.
- prompt: Is y=3x+5 direct proportion?
  solution: 'No'
  explanation: At x=0 output5 is nonzero; ratios at1 and2 differ. It is linear but not directly proportional.
- prompt: A fixed24L is shared across3 containers. Then across6. Amount per container?
  solution: 8L then4L
  explanation: xy=24 stays fixed; doubling the count halves the amount per container.
- prompt: y is inversely proportional to x; y=8 at x=3. Find y at x=6.
  solution: '4'
  explanation: k=3 times8=24, so y=24/6=4.
- prompt: For y=24/x, find x if y=2.
  solution: '12'
  explanation: xy=24 gives2x=24. Input zero is never allowed.
- prompt: Is y=10-x inverse proportion?
  solution: 'No'
  explanation: At x=2 the product is16; at x=3 it is21. Decreasing alone is not enough.
- prompt: Four equal independent workers finish a divisible job in6 hours. Ideal time for8 workers?
  solution: 3 hours
  explanation: Under constant equal productivity, worker-hours stay24. Shared bottlenecks would invalidate
    this model.
applications:
- title: At constant60km/h, how far in2.5hours?
  description: 150km Distance=rate times time; no fixed starting-distance offset is included.
- title: A60km journey is driven at30km/h or60km/h. Compare times.
  description: 2h and1h Distance stays fixed, so speed times time=60 and time is inverse to speed.
- title: A taxi charges5 units plus2 per kilometre. Is fare proportional to kilometres?
  description: Not directly proportional The fixed charge causes a nonzero intercept; the fare for twice the
    distance is less than twice the original fare.
- title: A printer produces150 pages in5min at a fixed rate. Time for420pages?
  description: 14min Rate=30pages/min. With no setup delay, time=420/30=14min.
