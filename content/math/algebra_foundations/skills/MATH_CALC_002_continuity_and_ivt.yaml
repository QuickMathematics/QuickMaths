examples:
- prompt: At x=1, a function has value 5 but a two-sided limit of 2. Is it continuous?
  solution: No.
  explanation: The value and limit both exist but are unequal. The third continuity check fails.
- prompt: Fill the missing value of (x^2-4)/(x-2) to obtain continuity at 2.
  solution: Assign f(2)=4.
  explanation: Away from 2 the formula equals x+2. Its limit at the hole is 4, which is the only possible
    continuous repair.
  media:
  - *id001
- prompt: Join 3x+1 for x<2 with x+k for x>=2 continuously.
  solution: k=5
  explanation: The left limit is 7. The other branch gives both the right limit and the actual value 2+k,
    so require 2+k=7.
- prompt: Can changing f(0) repair left and right limits of 1 and 3?
  solution: No.
  explanation: The two side limits must agree before any point assignment can make continuity possible.
    A jump is not removable.
- prompt: Where is 1/[(x-1)(x+2)] continuous?
  solution: 'On its domain: (-inf,-2) U (-2,1) U (1,inf).'
  explanation: Rational functions are continuous at inputs where the original denominator is nonzero.
    Do not include either excluded input.
- prompt: Explain continuity of sqrt(x-3) at its left domain endpoint.
  solution: It is continuous at 3 from the right, relative to [3,inf).
  explanation: The endpoint value is zero, and the values from allowed inputs above 3 approach zero. No
    left-side real inputs exist.
- prompt: Does a corner in |x| prevent continuity at zero?
  solution: No.
  explanation: The common finite side limit and the actual value are all zero. Smoothness is a different
    question.
  media:
  - *id002
- prompt: Prove that x^3+x-1 has a zero between 0 and 1.
  solution: At least one root lies in (0,1).
  explanation: Polynomial continuity and endpoint values -1 and 1 satisfy the intermediate value theorem.
    This argument alone does not identify an exact root or prove uniqueness.
  media:
  - src: media/native-calculus-bridge/continuity-ivt.svg
    alt: The continuous curve y = x^3 + x - 1 is shown on [0, 1], with endpoint values -1 and 1 and a
      horizontal line at height zero.
    caption: The intermediate value theorem guarantees a zero between the endpoint inputs.
    width: 800
    height: 500
    fit: contain
- prompt: Why does 1/x on [-1,1] not provide an IVT guarantee of a zero?
  solution: It is not continuous or even defined on the whole interval.
  explanation: Endpoint signs cannot replace the missing continuity hypothesis at zero.
- prompt: Bisect the root bracket for x^2-6 on [2,3] once.
  solution: Retain [2,2.5].
  explanation: The midpoint value is 2.5^2-6 = 0.25, while the left endpoint value is -2. The retained
    endpoints have opposite signs, and continuity supplies a root between them.
applications:
- title: Reliable models
  description: A continuity check determines whether small input changes near a threshold can produce
    a sudden output jump.
- title: Root finding
  description: Bisection maintains a mathematically justified bracket when continuity and endpoint sign
    conditions hold.
- title: Calibration joins
  description: Matching piecewise formulas and the assigned endpoint value avoids artificial breaks between
    calibration ranges.
- title: Existence versus uniqueness
  description: A target-value guarantee does not by itself establish a unique solution, a midpoint solution,
    or an exact formula.
