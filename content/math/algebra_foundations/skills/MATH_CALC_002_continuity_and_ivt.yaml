    mistake_tags: *id003
    difficulty: medium
    options:
    - id: A
      label: 'Yes: set f(0) = 2, the average.'
    - id: B
      label: 'Yes: set f(0) = 1, the left value.'
    - id: C
      label: 'Yes: remove both side conditions from the definition.'
    - id: D
