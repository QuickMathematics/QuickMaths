      mastery_requires_review_pass: false
      allow_self_review: true
  - id: BRIDGE_CONT_LINEAR_JOIN
    type: generated
    prompt_template: Let f(x) = {m}x + ({b}) for x < {h}, and f(x) = x + k for x >= {h}. Find k for continuity
      at {h}.
    variables:
      h:
        type: int
        min: 1
        max: 5
      m:
        type: int
        min: 1
        max: 4
      b:
        type: int
        min: -4
        max: 4
    derived:
      k: (m-1)*h+b
    constraints: []
    answer:
      type: numeric
      value: '{k}'
    grading:
      method: exact_numeric
    explanation_template: |-
      The left limit is {m}*{h} + ({b}); the right limit and point value are {h} + k.
      Match them and subtract {h}, giving k = {k}.
    solution_steps: []
    mistake_tags: *id003
    difficulty: medium
    options: []
    max_attempts: 100
    answer_mode: final_plus_required_work
    work:
