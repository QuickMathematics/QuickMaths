    prompt_template: For x != {a}, let f(x) = (x^2 - {sq})/(x - ({a})). Assign f({a}) = k. Find the unique
      k making the extension continuous.
    variables:
      a:
        type: int
        min: -5
        max: 5
        exclude:
        - 0
    derived:
      sq: a*a
      ans: 2*a
    constraints: []
    answer:
      type: numeric
      value: '{ans}'
    grading:
      method: exact_numeric
    explanation_template: |-
      For x != {a}, the quotient equals x + ({a}).
      Its limit is {ans}.
      Assign exactly that value at the removed input.
    solution_steps: []
    mistake_tags: *id003
    difficulty: medium
    options: []
    max_attempts: 100
    answer_mode: final_only
    work:
      mode: none
    review_policy:
