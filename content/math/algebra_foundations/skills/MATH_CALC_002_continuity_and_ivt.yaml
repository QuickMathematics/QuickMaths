      value: B
    grading:
      method: multiple_choice
    explanation_template: |-
      A polynomial is continuous on the whole interval [0,1].
      f(0)=-1 and f(1)=1, so zero lies strictly between the endpoint values.
      The intermediate value theorem gives at least one c in (0,1) with f(c)=0.
      This invocation supplies existence, not an exact value or a uniqueness proof.
