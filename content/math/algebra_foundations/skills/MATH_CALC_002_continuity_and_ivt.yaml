  - id: BRIDGE_CONT_IVT_PROOF
    type: fixed
    prompt_template: Use the intermediate value theorem for f(x) = x^3 + x - 1 on [0, 1]. Select the justified
      conclusion and give a complete proof.
    variables: {}
