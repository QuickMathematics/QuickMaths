      mastery_requires_review_pass: false
      allow_self_review: true
  - id: BRIDGE_CONT_PRODUCT_JOIN
    type: generated
    prompt_template: Let f(x) = x^2 for x <= {h}, and f(x) = kx for x > {h}. Find k for continuity at
      the positive input {h}.
    variables:
