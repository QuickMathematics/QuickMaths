  question_count: 21
  randomize_order: true
  questions:
  - id: BRIDGE_CONT_VALUE
    type: generated
    prompt_template: Let f(x) = x^2 + ({b}) for x != {a}, and f({a}) = k. Find k that makes f continuous
      at {a}.
    variables:
      a:
        type: int
        min: -5
        max: 5
      b:
        type: int
        min: -5
        max: 5
    derived:
      ans: a*a+b
    constraints: []
    answer:
      type: numeric
      value: '{ans}'
    grading:
      method: exact_numeric
    explanation_template: |-
      The nearby polynomial values approach ({a})^2 + ({b}) = {ans}.
      Continuity requires the assigned point value k to equal this limit.
    solution_steps: []
    mistake_tags: &id003
    - continuity_hypotheses
    - domain_preservation
    - existence_versus_uniqueness
    difficulty: easy
    options: []
    max_attempts: 100
    answer_mode: final_only
    work:
      mode: none
    review_policy:
      work_review: none
      mastery_requires_review_pass: false
      allow_self_review: true
  - id: BRIDGE_CONT_FILL
