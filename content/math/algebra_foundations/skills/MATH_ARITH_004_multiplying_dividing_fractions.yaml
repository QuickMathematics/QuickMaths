id: MATH_ARITH_004
schema_version: 0.2
name: Multiplying and dividing fractions
domain: Math
subdomain: Arithmetic Foundations
description: Multiply and divide fractions, including whole-number, reciprocal, zero, and signed fraction cases.
prerequisites:
  - MATH_ARITH_003
tags:
  - arithmetic
  - fractions
  - multiplying_fractions
  - dividing_fractions
  - reciprocals
  - signed_numbers
  - zero
unlocks: []
mastery:
  passing_score: 0.8
  minimum_confidence: 3
  review_after_days_if_mastered: 7
  review_after_days_if_learning: 2
theory: |
  To multiply fractions, multiply straight across:

  numerator times numerator, denominator times denominator.

  To divide fractions, multiply by the reciprocal of the second fraction. The reciprocal flips the numerator and denominator.

  Why it matters:
  Fraction multiplication and division show up in rates, scale drawings, probability, slope, unit conversions, and algebra.

  Multiplication rule:
  a/b * c/d = (a*c)/(b*d)

  Division rule:
  a/b / c/d = a/b * d/c

  Method:
  1. For multiplication, multiply numerators and multiply denominators.
  2. For division, rewrite as multiplication by the reciprocal of the second fraction.
  3. Simplify the final fraction when possible.
  4. Track signs: one negative factor gives a negative result, and two negative factors give a positive result.
  5. Remember that division by zero is undefined.

  Reciprocals:
  The reciprocal of a/b is b/a, as long as a is not 0.

  Example:
  The reciprocal of 3/5 is 5/3.

  Multiplication example:
  2/3 * 5/7 = 10/21.

  Division example:
  3/4 / 2/5 = 3/4 * 5/2 = 15/8.

  Cross-canceling:
  Before multiplying, you can sometimes simplify across the multiplication.

  Example:
  3/10 * 5/7 = 3/2 * 1/7 = 3/14.

  Common mistake:
  Do not divide straight across. For 1/2 / 3/4, the correct move is:

  1/2 * 4/3 = 4/6 = 2/3.

  Another common mistake:
  When dividing fractions, do not flip the first fraction. Only take the reciprocal of the second fraction.

  Another common mistake:
  You cannot divide by zero. For example, 3/5 / 0 is undefined.
examples:
  - prompt: "Compute: 2/5 * 3/7"
    solution: "6/35"
    explanation: "Multiply numerators and denominators: (2*3)/(5*7) = 6/35."
  - prompt: "Compute: 4/9 * 3"
    solution: "4/3"
    explanation: "Write 3 as 3/1, then multiply: 4/9 * 3/1 = 12/9 = 4/3."
  - prompt: "Compute: 3/10 * 5/7"
    solution: "3/14"
    explanation: "Cross-cancel 10 and 5 first, then multiply."
  - prompt: "Compute: 5/6 / 2/3"
    solution: "5/4"
    explanation: "Multiply by the reciprocal: 5/6 * 3/2 = 15/12 = 5/4."
  - prompt: "Compute: -2/3 * 5/8"
    solution: "-5/12"
    explanation: "One factor is negative, so the product is negative. Multiply straight across and simplify."
  - prompt: "Compute: (-2/3) / (-4/5)"
    solution: "5/6"
    explanation: "Two negatives make a positive. Then multiply by the reciprocal."
  - prompt: "Compute: 0 / 4/7"
    solution: "0"
    explanation: "Zero divided by any nonzero number is 0."
  - prompt: "Is 3/5 / 0 defined?"
    solution: "No"
    explanation: "Division by zero is undefined."
applications:
  - title: "Recipes and scaling"
    description: "Multiplying fractions helps scale ingredients up or down."
  - title: "Rates"
    description: "Dividing fractions is useful when comparing fractional quantities."
  - title: "Slope"
    description: "Fractions often appear in slope calculations and linear rates of change."
  - title: "Unit conversion"
    description: "Many unit conversions are multiplication by fractional conversion factors."
