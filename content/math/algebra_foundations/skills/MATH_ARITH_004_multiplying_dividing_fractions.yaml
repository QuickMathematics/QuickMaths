          max: 9
        b:
          type: int
          min: 2
          max: 12
        c:
          type: int
          min: 1
          max: 9
        d:
          type: int
          min: 2
          max: 12
      constraints:
        - "a < b"
        - "c < d"
      derived:
        num: "a * c"
        den: "b * d"
      answer:
        type: numeric
        value: "{num}/{den}"
      grading:
        method: exact_numeric
      work:
        mode: none
      review_policy:
        work_review: none
        mastery_requires_review_pass: false
      explanation_template: |
        Multiply numerators: {a} * {c} = {num}.
        Multiply denominators: {b} * {d} = {den}.
        The product is {num}/{den}. Simplify if possible.
      mistake_tags:
