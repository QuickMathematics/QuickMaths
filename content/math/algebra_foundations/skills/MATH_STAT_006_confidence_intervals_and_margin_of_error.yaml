    work:
      mode: capture_only
      prompt: Show the formula, substitution, and result.
    review_policy:
      work_review: none
      mastery_requires_review_pass: false
      allow_self_review: true
    explanation_template: SE=1/(2root), margin=1/root.
    mistake_tags:
    - calculation_error
    difficulty: medium
  - id: CI_PROPORTION_CONDITIONS
