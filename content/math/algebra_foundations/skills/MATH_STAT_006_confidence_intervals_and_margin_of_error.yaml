    - id: B
      label: Parameter changes between intervals
    - id: C
      label: 95% observations lie in each interval
    - id: D
      label: Every estimate has 95% chance correct
    answer:
      type: multiple_choice
      value: A
    grading:
      method: multiple_choice
    work:
      mode: none
    review_policy:
      work_review: none
      mastery_requires_review_pass: false
      allow_self_review: true
    explanation_template: Confidence is long-run method performance.
    mistake_tags:
    - concept_error
    difficulty: medium
  - id: CI_PARAMETER_PROBABILITY_WORDING
    type: fixed
    prompt_template: Best wording after computing a frequentist 95% interval?
    answer_mode: final_only
    options:
    - id: A
      label: We are 95% confident the interval captures the parameter
    - id: B
      label: The fixed parameter changes into interval with 95% probability
    - id: C
