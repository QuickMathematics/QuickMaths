      label: 10% and large-count checks pass
    - id: B
      label: 10% fails
    - id: C
      label: Failure count below10
    - id: D
      label: No conditions needed
    answer:
      type: multiple_choice
      value: A
    grading:
      method: multiple_choice
    work:
      mode: none
    review_policy:
      work_review: none
      mastery_requires_review_pass: false
      allow_self_review: true
    explanation_template: n/N=.04; counts18 and182.
    mistake_tags:
    - concept_error
    difficulty: medium
  - id: CI_MEAN_SAMPLE_SIZE
    type: generated
    prompt_template: z*=2, sigma={sigma}. Smallest n for margin E={E}.
    answer_mode: final_plus_required_work
    max_attempts: 300
    variables:
      root:
