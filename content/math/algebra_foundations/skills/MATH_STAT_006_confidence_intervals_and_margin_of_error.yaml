id: MATH_STAT_006
schema_version: 0.2
name: Confidence intervals and margin of error
domain: Math
subdomain: Statistics
topic: Confidence Intervals
description: Construct and interpret confidence intervals, margins, conditions and sample-size plans.
prerequisites:
- MATH_STAT_005
tags:
- statistics
unlocks:
- MATH_STAT_007
mastery:
  passing_score: 0.8
  minimum_confidence: 3
  max_guessing_allowed: maybe
  review_after_days_if_mastered: 7
  review_after_days_if_learning: 2
theory: A confidence interval is estimate ± margin of error, with margin=critical value×standard error. A 95% confidence
  procedure captures the fixed parameter in about 95% of repeated samples under its conditions. Higher confidence
  widens intervals; larger n narrows them at a square-root rate. Mean intervals with known σ use x-bar±z*σ/sqrt(n).
  Introductory proportion intervals use p-hat±z*sqrt[p-hat(1-p-hat)/n]. Check randomization, independence/10%, shape
  or count conditions, and nonsampling bias separately. Sample-size planning solves the margin formula and rounds
  upward.
examples:
  - prompt: 'A sample mean is 50 with known standard error 1.5. Construct a 95% confidence interval.'
    solution: 'A sample mean 50 with known SE 1.5 gives a 95% interval 50 plus or minus 1.96(1.5)=(47.06,52.94).'
    explanation: 'The interval is a plausible range for the population mean produced by the procedure.'
  - prompt: 'How does quadrupling sample size affect a margin of error? Explain why.'
    solution: 'To cut a margin of error from 4 to 2, quadruple the sample size because margin varies as 1/sqrt(n).'
    explanation: 'Precision improves through larger samples, while confidence level also changes width.'
applications:
  - title: 'Survey confidence intervals'
    description: 'Confidence intervals communicate plausible ranges for means in surveys, experiments, and quality-control studies.'
  - title: 'Planning margin of error'
    description: 'Margin-of-error calculations help choose a sample size for a target level of precision.'
test:
  question_count: 13
  randomize_order: true
  questions:
  - id: CI_CENTER_FROM_ENDPOINTS
    type: generated
    prompt_template: A confidence interval is {low} to {high}. Find point estimate.
    answer_mode: final_only
    max_attempts: 300
    variables:
      center:
        type: int
        min: 20
        max: 100
      margin:
        type: int
        min: 2
        max: 12
    derived:
      low: center-margin
      high: center+margin
    answer:
      type: numeric
      value: '{center}'
    grading:
      method: exact_numeric
    work:
      mode: none
    review_policy:
      work_review: none
      mastery_requires_review_pass: false
      allow_self_review: true
    explanation_template: Midpoint is estimate.
    mistake_tags:
    - calculation_error
    difficulty: medium
  - id: CI_MARGIN_FROM_ENDPOINTS
    type: generated
    prompt_template: A confidence interval is {low} to {high}. Find margin.
    answer_mode: final_only
    max_attempts: 300
    variables:
      center:
        type: int
        min: 20
        max: 100
      margin:
        type: int
        min: 2
        max: 12
    derived:
      low: center-margin
      high: center+margin
    answer:
      type: numeric
      value: '{margin}'
    grading:
      method: exact_numeric
    work:
      mode: none
    review_policy:
      work_review: none
      mastery_requires_review_pass: false
      allow_self_review: true
    explanation_template: Half-width is margin.
    mistake_tags:
    - calculation_error
    difficulty: medium
  - id: CI_MEAN_MARGIN
    type: generated
    prompt_template: x-bar={xbar}, sigma={sigma}, n={n}, z*={zstar}. Find margin.
    answer_mode: final_plus_required_work
    max_attempts: 300
    variables:
      xbar:
        type: int
        min: 20
        max: 120
      root:
        type: choice
        values:
        - 2
        - 4
        - 5
        - 10
      k:
        type: int
        min: 1
        max: 6
      zstar:
        type: choice
        values:
        - 1.645
        - 1.96
        - 2.576
    derived:
      n: root**2
      sigma: root*k
      se: k
      margin: round(zstar*se*1000)/1000
    answer:
      type: numeric
      value: '{margin}'
    grading:
      method: numeric_with_tolerance
      tolerance: 0.0005
    work:
      mode: capture_only
      prompt: Show the formula, substitution, and result.
    review_policy:
      work_review: none
      mastery_requires_review_pass: false
      allow_self_review: true
    explanation_template: Margin=z*SE.
    mistake_tags:
    - calculation_error
    difficulty: medium
  - id: CI_MEAN_UPPER_ENDPOINT
    type: generated
    prompt_template: x-bar={xbar}, sigma={sigma}, n={n}, z*={zstar}. Find upper limit.
    answer_mode: final_plus_required_work
    max_attempts: 300
    variables:
      xbar:
        type: int
        min: 20
        max: 120
      root:
        type: choice
        values:
        - 2
        - 4
        - 5
        - 10
      k:
        type: int
        min: 1
        max: 5
      zstar:
        type: choice
        values:
        - 1.645
        - 1.96
        - 2.576
    derived:
      n: root**2
      sigma: root*k
      se: k
      margin: round(zstar*se*1000)/1000
      upper: round((xbar+margin)*1000)/1000
    answer:
      type: numeric
      value: '{upper}'
    grading:
      method: numeric_with_tolerance
      tolerance: 0.0005
    work:
      mode: capture_only
      prompt: Show the formula, substitution, and result.
    review_policy:
      work_review: none
      mastery_requires_review_pass: false
      allow_self_review: true
    explanation_template: Upper=estimate+margin.
    mistake_tags:
    - calculation_error
    difficulty: hard
  - id: CI_SAMPLE_SIZE_EFFECT
    type: fixed
    prompt_template: With confidence and variability unchanged, quadrupling n does what to margin?
    answer_mode: final_only
    options:
    - id: A
      label: Halves it
    - id: B
      label: Quarters it
    - id: C
      label: Doubles
    - id: D
      label: No change
    answer:
      type: multiple_choice
      value: A
    grading:
      method: multiple_choice
    work:
      mode: none
    review_policy:
      work_review: none
      mastery_requires_review_pass: false
      allow_self_review: true
    explanation_template: Margin scales as 1/sqrt(n).
    mistake_tags:
    - concept_error
    difficulty: medium
