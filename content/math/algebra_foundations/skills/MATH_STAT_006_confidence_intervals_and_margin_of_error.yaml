        values:
        - 4
        - 6
        - 8
        - 10
        - 12
        - 14
        - 16
      E:
        type: choice
        values:
        - 1
        - 2
        - 4
    derived:
      sigma: root*E/2
      n: root**2
    answer:
      type: numeric
      value: '{n}'
    grading:
      method: exact_numeric
    work:
      mode: capture_only
      prompt: Show the formula, substitution, and result.
    review_policy:
      work_review: none
      mastery_requires_review_pass: false
      allow_self_review: true
    explanation_template: Solve E=2sigma/sqrt(n).
