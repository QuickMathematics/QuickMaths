id: MATH_PREALG_004
schema_version: 0.2
name: Simplifying linear expressions
domain: Math
subdomain: Pre-Algebra
description: Simplify linear expressions by distributing when needed and combining like terms.
prerequisites:
  - MATH_PREALG_003
tags:
  - pre_algebra
  - expressions
  - linear_expressions
  - distributive_property
  - like_terms
  - simplifying_expressions
  - signs
  - parentheses
unlocks:
  - MATH_ALG_002
mastery:
  passing_score: 0.8
  minimum_confidence: 3
  review_after_days_if_mastered: 7
  review_after_days_if_learning: 2
theory: |
  A linear expression has variable terms like x and constants, but no powers such as x^2.

  Simplifying a linear expression means rewriting it in a cleaner equivalent form, usually ax + b.

  This matters because equations, inequalities, and line formulas are much easier to work with after each expression is simplified.

  Method:
  1. Distribute to remove parentheses.
  2. Keep subtraction signs attached to the terms they affect.
  3. Combine like variable terms.
  4. Combine constants.
  5. Write the result in a clear form like ax + b.
  6. If x-terms cancel, the answer may be a constant.
  7. If everything cancels, the answer is 0.
  8. If the coefficient is 1, write x instead of 1x.
  9. If the coefficient is -1, write -x instead of -1x.

  Example:
  3(x + 4) + 2x - 5
  = 3x + 12 + 2x - 5
  = 5x + 7

  Subtracting parentheses:
  8x - (3x + 5)
  = 8x - 3x - 5
  = 5x - 5

  Cancellation:
  4(x + 3) - 4x
  = 4x + 12 - 4x
  = 12

  Common mistake:
  Watch subtraction before parentheses. In 8x - (3x + 5), the minus applies to both terms.

  Another common mistake:
  Do not stop after distributing. If there are like terms afterward, combine them.
examples:
  - prompt: "Simplify: 4x + 7 + 3x - 2"
    solution: "7x + 5"
    explanation: "Combine x-terms: 4x + 3x = 7x. Combine constants: 7 - 2 = 5."
  - prompt: "Simplify: 5(x + 2) - 3"
    solution: "5x + 7"
    explanation: "Distribute first: 5x + 10 - 3. Then combine constants."
  - prompt: "Simplify: 2(3x - 4) + 5x"
    solution: "11x - 8"
    explanation: "Distribute: 6x - 8 + 5x. Then combine x-terms."
  - prompt: "Simplify: 9x - (4x + 6)"
    solution: "5x - 6"
    explanation: "Subtract both terms inside the parentheses: 9x - 4x - 6."
  - prompt: "Simplify: 4(x + 3) - 4x"
    solution: "12"
    explanation: "Distribute first: 4x + 12 - 4x. The x-terms cancel."
  - prompt: "Simplify: 6(x + 2) - 5x"
    solution: "x + 12"
    explanation: "Distribute first: 6x + 12 - 5x. Then 6x - 5x = x."
  - prompt: "Simplify: 3 - (2x + 8)"
    solution: "-2x - 5"
    explanation: "The subtraction applies to the whole group: 3 - 2x - 8 = -2x - 5."
applications:
  - title: "Two-step equations"
    description: "Many equations need each side simplified before solving."
  - title: "Inequalities"
    description: "Simplifying expressions makes it easier to isolate the variable in inequalities."
  - title: "Linear functions"
    description: "Simplified linear expressions connect directly to slope-intercept form and graphing lines."
  - title: "Checking equivalence"
    description: "Simplifying helps determine whether two expressions are actually the same."
test:
  question_count: 20
  randomize_order: true
  questions:
    - id: SIMPLIFY_LINEAR_COMBINE_ONLY_001
      type: generated
      prompt_template: "Simplify: {a}x + {b} + {c}x + {d}"
      answer_mode: final_plus_required_work
      variables:
        a:
          type: int
          min: -12
          max: 12
          exclude: [0, 1, -1]
        b:
          type: int
          min: -20
          max: 20
          exclude: [0]
        c:
          type: int
          min: -12
          max: 12
          exclude: [0, 1, -1]
        d:
          type: int
          min: -20
          max: 20
          exclude: [0]
      derived:
        x_total: "a + c"
        constant_total: "b + d"
      constraints:
        - "x_total != 0"
        - "x_total != 1"
        - "x_total != -1"
        - "constant_total != 0"
      answer:
        type: expression
        value: "{x_total}x + {constant_total}"
      grading:
        method: symbolic_expression
      work:
        mode: procedural_steps
        prompt: "Show each equivalent expression step, ending with the simplified final answer."
        line_type: expression
        minimum_steps: 2
        require_final_answer_match: true
      review_policy:
        work_review: auto
        mastery_requires_review_pass: false
      explanation_template: |
        Combine the x-terms: {a}x + {c}x = {x_total}x.
        Combine the constants: {b} + {d} = {constant_total}.
        The simplified expression is {x_total}x + {constant_total}.
      mistake_tags:
        - like_terms_error
        - coefficient_error
        - constant_error
        - sign_error
      difficulty: easy

