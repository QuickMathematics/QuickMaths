        d:
          type: int
          min: -15
          max: 15
          exclude: [0, 1, -1]
      derived:
        distributed_x: "a * b"
        distributed_constant: "a * c"
        x_total: "distributed_x + d"
      constraints:
        - "x_total != 0"
        - "x_total != 1"
        - "x_total != -1"
      answer:
        type: expression
        value: "{x_total}x + {distributed_constant}"
      grading:
