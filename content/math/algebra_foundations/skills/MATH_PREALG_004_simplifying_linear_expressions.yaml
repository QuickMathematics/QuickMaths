          min: -20
          max: 20
          exclude: [0]
        b:
          type: int
          min: -12
          max: 12
          exclude: [0, 1, -1]
        c:
          type: int
          min: -20
          max: 20
          exclude: [0]
        d:
          type: int
          min: -12
          max: 12
          exclude: [0, 1, -1]
      derived:
        constant_total: "a - c"
        x_total: "b + d"
      constraints:
        - "x_total != 0"
        - "x_total != 1"
        - "x_total != -1"
        - "constant_total != 0"
      answer:
        type: expression
        value: "{x_total}x + {constant_total}"
      grading:
        method: symbolic_expression
      work:
        mode: procedural_steps
        prompt: "Show each equivalent expression step, ending with the simplified final answer."
        line_type: expression
        minimum_steps: 2
        require_final_answer_match: true
      review_policy:
        work_review: auto
        mastery_requires_review_pass: false
      explanation_template: |
        Like terms may be out of order.
        Constants: {a} - {c} = {constant_total}.
        x-terms: {b}x + {d}x = {x_total}x.
        The simplified expression is {x_total}x + {constant_total}.
      mistake_tags:
        - like_terms_error
        - sign_error
        - constant_error
        - coefficient_error
      difficulty: medium

