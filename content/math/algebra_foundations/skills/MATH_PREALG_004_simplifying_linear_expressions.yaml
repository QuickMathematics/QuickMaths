          max: 12
        b:
          type: int
          min: 2
          max: 20
      derived:
        x_total: "a - 1"
        constant_total: "0 - b"
      constraints:
        - "x_total != 1"
      answer:
        type: expression
        value: "{x_total}x + {constant_total}"
      grading:
        method: symbolic_expression
      work:
        mode: procedural_steps
        prompt: "Treat subtracting parentheses as distributing -1."
        line_type: expression
        minimum_steps: 3
        require_final_answer_match: true
      review_policy:
        work_review: auto
        mastery_requires_review_pass: false
      explanation_template: |
        Subtracting (x + {b}) is the same as adding -1(x + {b}).
        {a}x - (x + {b}) = {a}x - x - {b}.
        Combine x-terms: {a}x - x = {x_total}x.
        The simplified expression is {x_total}x + {constant_total}.
      mistake_tags:
        - subtraction_error
        - negative_one_error
        - sign_error
        - like_terms_error
      difficulty: medium

