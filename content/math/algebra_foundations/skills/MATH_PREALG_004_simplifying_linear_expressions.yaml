          min: 2
          max: 12
        b:
          type: int
          min: 2
          max: 12
        c:
          type: int
          min: -20
          max: 20
          exclude: [0]
      derived:
        distributed_constant: "a * b"
        constant_total: "distributed_constant + c"
      constraints:
