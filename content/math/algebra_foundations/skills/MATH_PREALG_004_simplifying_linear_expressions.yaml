    - id: SIMPLIFY_LINEAR_SUBTRACT_PARENTHESES_SUM_001
      type: generated
      prompt_template: "Simplify: {a}x + {b} - ({c}x + {d})"
      answer_mode: final_plus_required_work
      variables:
        a:
          type: int
          min: 2
          max: 14
        b:
          type: int
          min: -20
          max: 20
          exclude: [0]
        c:
          type: int
          min: 2
          max: 14
        d:
          type: int
          min: -20
          max: 20
          exclude: [0]
      derived:
        x_total: "a - c"
        constant_total: "b - d"
      constraints:
        - "x_total != 0"
        - "x_total != 1"
        - "x_total != -1"
        - "constant_total != 0"
      answer:
        type: expression
        value: "{x_total}x + {constant_total}"
      grading:
        method: symbolic_expression
      work:
        mode: procedural_steps
        prompt: "Remove the parentheses carefully, then combine like terms."
        line_type: expression
        minimum_steps: 3
        require_final_answer_match: true
      review_policy:
        work_review: auto
        mastery_requires_review_pass: false
      explanation_template: |
        The minus before parentheses changes both signs.
        {a}x + {b} - ({c}x + {d}) = {a}x + {b} - {c}x - {d}.
        Combine x-terms: {a}x - {c}x = {x_total}x.
        Combine constants: {b} - {d} = {constant_total}.
        The simplified expression is {x_total}x + {constant_total}.
      mistake_tags:
        - subtraction_error
        - sign_error
        - like_terms_error
        - distribution_error
      difficulty: hard

    - id: SIMPLIFY_LINEAR_SUBTRACT_PARENTHESES_DIFFERENCE_001
      type: generated
      prompt_template: "Simplify: {a}x + {b} - ({c}x - {d})"
      answer_mode: final_plus_required_work
      variables:
        a:
          type: int
          min: 2
          max: 14
        b:
          type: int
          min: -20
          max: 20
          exclude: [0]
        c:
          type: int
          min: 2
          max: 14
        d:
          type: int
          min: 2
          max: 20
      derived:
        x_total: "a - c"
        constant_total: "b + d"
      constraints:
        - "x_total != 0"
        - "x_total != 1"
        - "x_total != -1"
        - "constant_total != 0"
      answer:
