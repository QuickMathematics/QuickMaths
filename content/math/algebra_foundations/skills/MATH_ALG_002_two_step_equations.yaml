id: MATH_ALG_002
schema_version: 0.2
name: Two-step equations
domain: Math
subdomain: Algebra Foundations
description: Solve two-step linear equations by undoing addition or subtraction and then undoing multiplication or division.
prerequisites:
  - MATH_PREALG_004
  - MATH_ALG_001
tags:
  - algebra
  - equations
  - two_step_equations
  - inverse_operations
  - linear_equations
  - equation_balance
  - negative_numbers
  - fractions
unlocks:
