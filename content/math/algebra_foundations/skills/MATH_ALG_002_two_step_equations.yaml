      variables:
        x:
          type: int
          min: -12
          max: 12
          exclude: [0]
        a:
          type: int
          min: 2
          max: 12
        b:
          type: int
          min: 2
          max: 20
      derived:
        ax_value: "a * x"
        c: "ax_value + b"
      answer:
        type: equation_solution
        variable: x
        value: "{x}"
      grading:
        method: equation_solution
      work:
        mode: procedural_steps
        prompt: "Show each equivalent equation step, ending with x = your final answer."
        line_type: equation
        target_variable: x
        minimum_steps: 3
        require_final_answer_match: true
      review_policy:
        work_review: auto
        mastery_requires_review_pass: false
      explanation_template: |
        Start with {a}x + {b} = {c}.
        Subtract {b} from both sides: {a}x = {ax_value}.
        Divide both sides by {a}: x = {x}.
      mistake_tags:
