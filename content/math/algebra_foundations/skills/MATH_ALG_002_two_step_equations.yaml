      explanation_template: |
        You can distribute first: {a}(x + {b}) = {a}x + {distributed_constant}.
        The equation becomes {a}x + {distributed_constant} = {c}.
        Undo the constant, then divide by {a}.
        x = {x}.
      mistake_tags:
        - distribution_error
        - inverse_operations
        - sign_error
        - arithmetic_error
      difficulty: hard
