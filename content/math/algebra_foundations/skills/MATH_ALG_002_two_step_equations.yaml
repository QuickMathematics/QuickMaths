    - id: TWO_STEP_WITH_SIMPLIFY_LEFT_001
      type: generated
      prompt_template: "Solve for x: {a}x + {b}x + {c} = {d}"
      answer_mode: final_plus_required_work
      variables:
        x:
          type: int
          min: -10
          max: 10
          exclude: [0]
        a:
          type: int
          min: 2
          max: 8
        b:
          type: int
          min: 2
          max: 8
        c:
          type: int
          min: -15
          max: 15
          exclude: [0]
      derived:
        coefficient_total: "a + b"
        d: "coefficient_total * x + c"
      answer:
        type: equation_solution
        variable: x
        value: "{x}"
      grading:
        method: equation_solution
      work:
        mode: procedural_steps
        prompt: "Show each equation step, ending with x = your final answer."
        line_type: equation
        target_variable: x
        minimum_steps: 2
        require_final_answer_match: true
      review_policy:
        work_review: auto
        mastery_requires_review_pass: false
      explanation_template: |
        First combine like terms: {a}x + {b}x = {coefficient_total}x.
        The equation becomes {coefficient_total}x + {c} = {d}.
        Undo the constant, then divide by {coefficient_total}.
        x = {x}.
      mistake_tags:
        - like_terms_error
        - inverse_operations
        - coefficient_error
        - sign_error
      difficulty: hard

    - id: TWO_STEP_WITH_DISTRIBUTION_LEFT_001
