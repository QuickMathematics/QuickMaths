<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360"><rect width="800" height="360" rx="20" fill="#fffdf7"/><g font-family="sans-serif" fill="#163f36"><text x="32" y="42" font-size="25" font-weight="bold">Same whole, shared unit</text><text x="30" y="99" font-size="22">1/2 = 3/6</text><rect x="180" y="65" width="85" height="48" fill="#287365" stroke="#163f36"/><rect x="265" y="65" width="85" height="48" fill="#287365" stroke="#163f36"/><rect x="350" y="65" width="85" height="48" fill="#287365" stroke="#163f36"/><rect x="435" y="65" width="85" height="48" fill="#e5eee8" stroke="#163f36"/><rect x="520" y="65" width="85" height="48" fill="#e5eee8" stroke="#163f36"/><rect x="605" y="65" width="85" height="48" fill="#e5eee8" stroke="#163f36"/><text x="30" y="174" font-size="22">1/3 = 2/6</text><rect x="180" y="140" width="85" height="48" fill="#287365" stroke="#163f36"/><rect x="265" y="140" width="85" height="48" fill="#287365" stroke="#163f36"/><rect x="350" y="140" width="85" height="48" fill="#e5eee8" stroke="#163f36"/><rect x="435" y="140" width="85" height="48" fill="#e5eee8" stroke="#163f36"/><rect x="520" y="140" width="85" height="48" fill="#e5eee8" stroke="#163f36"/><rect x="605" y="140" width="85" height="48" fill="#e5eee8" stroke="#163f36"/><text x="30" y="249" font-size="22">sum = 5/6</text><rect x="180" y="215" width="85" height="48" fill="#287365" stroke="#163f36"/><rect x="265" y="215" width="85" height="48" fill="#287365" stroke="#163f36"/><rect x="350" y="215" width="85" height="48" fill="#287365" stroke="#163f36"/><rect x="435" y="215" width="85" height="48" fill="#287365" stroke="#163f36"/><rect x="520" y="215" width="85" height="48" fill="#287365" stroke="#163f36"/><rect x="605" y="215" width="85" height="48" fill="#e5eee8" stroke="#163f36"/><text x="30" y="325" font-size="19">Subdivision changes the labels, not the amounts.</text></g></svg>