<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360"><rect width="800" height="360" rx="20" fill="#fffdf7"/><g font-family="sans-serif" fill="#163f36"><text x="32" y="42" font-size="25" font-weight="bold">40,306: every digit has a place</text><rect x="32" y="80" width="140" height="160" fill="#e5eee8"/><text x="102" y="115" text-anchor="middle" font-size="17">Ten-thousands</text><text x="102" y="179" text-anchor="middle" font-size="36">4</text><rect x="180" y="80" width="140" height="160" fill="#e5eee8"/><text x="250" y="115" text-anchor="middle" font-size="17">Thousands</text><text x="250" y="179" text-anchor="middle" font-size="36">0</text><rect x="328" y="80" width="140" height="160" fill="#e5eee8"/><text x="398" y="115" text-anchor="middle" font-size="17">Hundreds</text><text x="398" y="179" text-anchor="middle" font-size="36">3</text><rect x="476" y="80" width="140" height="160" fill="#e5eee8"/><text x="546" y="115" text-anchor="middle" font-size="17">Tens</text><text x="546" y="179" text-anchor="middle" font-size="36">0</text><rect x="624" y="80" width="140" height="160" fill="#e5eee8"/><text x="694" y="115" text-anchor="middle" font-size="17">Ones</text><text x="694" y="179" text-anchor="middle" font-size="36">6</text><text x="32" y="300" font-size="23">40,000 + 300 + 6 = 40,306</text></g></svg>