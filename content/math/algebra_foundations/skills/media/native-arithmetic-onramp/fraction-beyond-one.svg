<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360"><rect width="800" height="360" rx="20" fill="#fffdf7"/><g font-family="sans-serif" fill="#163f36"><text x="32" y="42" font-size="25" font-weight="bold">Fractions are numbers beyond one whole</text><path d="M70 170H730" stroke="#163f36" stroke-width="3"/><path d="M70 158v24" stroke="#163f36"/><path d="M125 158v24" stroke="#163f36"/><path d="M180 158v24" stroke="#163f36"/><path d="M235 158v24" stroke="#163f36"/><path d="M290 158v24" stroke="#163f36"/><path d="M345 158v24" stroke="#163f36"/><path d="M400 158v24" stroke="#163f36"/><path d="M455 158v24" stroke="#163f36"/><path d="M510 158v24" stroke="#163f36"/><path d="M565 158v24" stroke="#163f36"/><path d="M620 158v24" stroke="#163f36"/><path d="M675 158v24" stroke="#163f36"/><path d="M730 158v24" stroke="#163f36"/><text x="70" y="213" text-anchor="middle" font-size="17">0</text><text x="235" y="213" text-anchor="middle" font-size="17">1/2</text><text x="400" y="213" text-anchor="middle" font-size="17">1</text><text x="565" y="213" text-anchor="middle" font-size="17">3/2</text><text x="730" y="213" text-anchor="middle" font-size="17">2</text><circle cx="565" cy="170" r="9" fill="#bb5538"/><text x="390" y="105" font-size="24">9/6 = 3/2 = 1 + 1/2</text><text x="40" y="296" font-size="20">Each small interval is one sixth of the same unit.</text></g></svg>