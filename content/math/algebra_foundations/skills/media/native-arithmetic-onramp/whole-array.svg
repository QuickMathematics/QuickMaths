<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360"><rect width="800" height="360" rx="20" fill="#fffdf7"/><g font-family="sans-serif" fill="#163f36"><text x="32" y="42" font-size="25" font-weight="bold">4 rows of 6: equal groups</text><circle cx="65" cy="95" r="15" fill="#287365"/><circle cx="120" cy="95" r="15" fill="#287365"/><circle cx="175" cy="95" r="15" fill="#287365"/><circle cx="230" cy="95" r="15" fill="#287365"/><circle cx="285" cy="95" r="15" fill="#287365"/><circle cx="340" cy="95" r="15" fill="#287365"/><circle cx="65" cy="143" r="15" fill="#287365"/><circle cx="120" cy="143" r="15" fill="#287365"/><circle cx="175" cy="143" r="15" fill="#287365"/><circle cx="230" cy="143" r="15" fill="#287365"/><circle cx="285" cy="143" r="15" fill="#287365"/><circle cx="340" cy="143" r="15" fill="#287365"/><circle cx="65" cy="191" r="15" fill="#287365"/><circle cx="120" cy="191" r="15" fill="#287365"/><circle cx="175" cy="191" r="15" fill="#287365"/><circle cx="230" cy="191" r="15" fill="#287365"/><circle cx="285" cy="191" r="15" fill="#287365"/><circle cx="340" cy="191" r="15" fill="#287365"/><circle cx="65" cy="239" r="15" fill="#287365"/><circle cx="120" cy="239" r="15" fill="#287365"/><circle cx="175" cy="239" r="15" fill="#287365"/><circle cx="230" cy="239" r="15" fill="#287365"/><circle cx="285" cy="239" r="15" fill="#287365"/><circle cx="340" cy="239" r="15" fill="#287365"/><text x="430" y="130" font-size="23">6 + 6 + 6 + 6</text><text x="430" y="177" font-size="23">4 × 6 = 24 tiles</text><text x="32" y="325" font-size="19">Rotate the array: 6 rows of 4 still contain 24 tiles.</text></g></svg>