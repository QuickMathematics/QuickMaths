<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360">
<rect width="800" height="360" rx="20" fill="#fffdf7"/>
<g font-family="sans-serif" fill="#163f36"><text x="28" y="40" font-size="24" font-weight="bold">One conversion factor, three dimensions</text><rect x="40" y="88" width="210" height="80" fill="#d9eee5"/><rect x="295" y="88" width="210" height="80" fill="#f5dfb5"/><rect x="550" y="88" width="210" height="80" fill="#e8d5ef"/><text x="145" y="137" text-anchor="middle" font-size="25">1 m = 100 cm</text><text x="400" y="137" text-anchor="middle" font-size="25">1 m² = 10,000 cm²</text><text x="655" y="137" text-anchor="middle" font-size="25">1 m³ = 1,000,000 cm³</text><text x="230" y="250" font-size="22">length once · area twice · volume three times</text></g></svg>