<g font-family="sans-serif" fill="#163f36"><text x="28" y="40" font-size="24" font-weight="bold">The reference base controls the percentage</text><rect x="48" y="90" width="290" height="86" fill="#d9eee5"/><rect x="462" y="90" width="290" height="86" fill="#f5dfb5"/><text x="193" y="143" text-anchor="middle" font-size="26">20% of 80 = 16</text><text x="607" y="143" text-anchor="middle" font-size="26">20% of 200 = 40</text><text x="100" y="245" font-size="22">same rate, different base, different amount</text></g></svg>