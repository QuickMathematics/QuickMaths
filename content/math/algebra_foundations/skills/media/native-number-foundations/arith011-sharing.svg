<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360">
<rect width="800" height="360" rx="20" fill="#fffdf7"/>
<g font-family="sans-serif" fill="#163f36"><text x="28" y="40" font-size="24" font-weight="bold">Share 64 in ratio 3:5</text><rect x="58" y="96" width="300" height="82" fill="#d9eee5"/><rect x="438" y="96" width="300" height="82" fill="#f5dfb5"/><text x="208" y="147" text-anchor="middle" font-size="27">3 parts × $8 = $24</text><text x="588" y="147" text-anchor="middle" font-size="27">5 parts × $8 = $40</text><text x="175" y="250" font-size="22">3 + 5 = 8 parts; 64 ÷ 8 = $8 each</text></g></svg>