<g font-family="sans-serif" fill="#163f36"><text x="28" y="40" font-size="24" font-weight="bold">Factor pairs of 36</text><g transform="translate(32 78)"><rect width="155" height="80" fill="#d9eee5"/><rect x="165" width="155" height="80" fill="#d9eee5"/><rect x="330" width="155" height="80" fill="#d9eee5"/><rect x="495" width="155" height="80" fill="#d9eee5"/><text x="78" y="50" text-anchor="middle" font-size="25">1×36</text><text x="243" y="50" text-anchor="middle" font-size="25">2×18</text><text x="408" y="50" text-anchor="middle" font-size="25">3×12</text><text x="573" y="50" text-anchor="middle" font-size="25">4×9</text><text x="0" y="155" font-size="21">6×6 is the middle pair; later pairs would repeat in reverse.</text></g></g></svg>