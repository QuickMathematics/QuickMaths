<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360"><rect width="720" height="360" rx="16" fill="#fffdf7"/><g font-family="sans-serif" fill="#163f36"><text x="28" y="34" font-size="23" text-anchor="start">Reflection reverses orientation</text><polygon points="100,275 220,90 305,235" fill="#d9eee5" stroke="#163f36" stroke-width="3"/><polygon points="620,275 500,90 415,235" fill="#d9eee5" stroke="#163f36" stroke-width="3"/><line x1="360" y1="65" x2="360" y2="305" stroke="#b44d32" stroke-width="3" stroke-dasharray="7 5"/><line x1="100" y1="275" x2="620" y2="275" stroke="#a5bdb1" stroke-width="3" stroke-dasharray="7 5"/><line x1="220" y1="90" x2="500" y2="90" stroke="#a5bdb1" stroke-width="3" stroke-dasharray="7 5"/><line x1="305" y1="235" x2="415" y2="235" stroke="#a5bdb1" stroke-width="3" stroke-dasharray="7 5"/><text x="368" y="75" font-size="18" text-anchor="start">mirror line</text><text x="87" y="337" font-size="18" text-anchor="start">Each point and its image are equally far from the mirror line.</text></g></svg>