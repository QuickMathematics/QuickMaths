<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360"><rect width="720" height="360" rx="16" fill="#fffdf7"/><g font-family="sans-serif" fill="#163f36"><text x="28" y="34" font-size="23" text-anchor="start">Subtract a triangular corner from a rectangle</text><polygon points="90,120 210,60 610,60 610,265 90,265" fill="#d9eee5" stroke="#163f36" stroke-width="3"/><polygon points="90,60 210,60 90,120" fill="#fffdf7" stroke="#163f36" stroke-width="3"/><line x1="90" y1="55" x2="210" y2="55" stroke="#b44d32" stroke-width="3"/><line x1="85" y1="60" x2="85" y2="120" stroke="#b44d32" stroke-width="3"/><text x="132" y="51" font-size="18" text-anchor="start">b</text><text x="60" y="96" font-size="18" text-anchor="start">h</text><line x1="90" y1="285" x2="610" y2="285" stroke="#163f36" stroke-width="3"/><text x="350" y="307" font-size="20" text-anchor="middle">W</text><line x1="635" y1="60" x2="635" y2="265" stroke="#163f36" stroke-width="3"/><text x="650" y="169" font-size="20" text-anchor="start">H</text><text x="120" y="339" font-size="21" text-anchor="start">Remaining area = WH − bh/2</text></g></svg>