<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360"><rect width="720" height="360" rx="16" fill="#fffdf7"/><g font-family="sans-serif" fill="#163f36"><text x="28" y="34" font-size="23" text-anchor="start">Why the square areas satisfy a² + b² = c²</text><polygon points="75,63 313,63 313,301 75,301" fill="#d9eee5" stroke="#163f36" stroke-width="3"/><polygon points="177,63 313,165 211,301 75,199" fill="#f7ddaa" stroke="#163f36" stroke-width="3"/><text x="190" y="185" font-size="25" text-anchor="middle">c²</text><text x="117" y="56" font-size="20" text-anchor="start">a</text><text x="247" y="56" font-size="20" text-anchor="start">b</text><text x="320" y="120" font-size="20" text-anchor="start">a</text><text x="320" y="240" font-size="20" text-anchor="start">b</text><text x="373" y="112" font-size="23" text-anchor="start">Outer area: (a + b)²</text><text x="373" y="155" font-size="21" text-anchor="start">Four triangles: 4 × ab/2</text><text x="373" y="202" font-size="22" text-anchor="start">Remaining square: c²</text><text x="373" y="252" font-size="19" text-anchor="start">a² + 2ab + b² = 2ab + c²</text><text x="28" y="337" font-size="14" text-anchor="start">Each inner angle is 90° because the two acute triangle angles sum to 90°.</text></g></svg>