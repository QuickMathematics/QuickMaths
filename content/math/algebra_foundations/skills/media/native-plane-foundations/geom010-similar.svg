<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360"><rect width="720" height="360" rx="16" fill="#fffdf7"/><g font-family="sans-serif" fill="#163f36"><text x="28" y="34" font-size="23" text-anchor="start">Similar triangles: preserve shape and correspondence</text><polygon points="90,275 165,145 240,275" fill="#d9eee5" stroke="#163f36" stroke-width="3"/><polygon points="365,275 477.5,80 590,275" fill="#d9eee5" stroke="#163f36" stroke-width="3"/><text x="80" y="300" font-size="20" text-anchor="start">A</text><text x="155" y="133" font-size="20" text-anchor="start">B</text><text x="230" y="300" font-size="20" text-anchor="start">C</text><text x="355" y="300" font-size="20" text-anchor="start">D</text><text x="467.5" y="68" font-size="20" text-anchor="start">E</text><text x="580" y="300" font-size="20" text-anchor="start">F</text><text x="325" y="175" font-size="21" text-anchor="start">×1.5</text><text x="65" y="336" font-size="19" text-anchor="start">A ↔ D, B ↔ E, C ↔ F; corresponding side ratios all equal.</text></g></svg>