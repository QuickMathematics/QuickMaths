<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360"><rect width="720" height="360" rx="16" fill="#fffdf7"/><g font-family="sans-serif" fill="#163f36"><text x="28" y="34" font-size="23" text-anchor="start">Classify by properties, not by orientation</text><polygon points="65,240 115,105 255,105 305,240" fill="#d9eee5" stroke="#163f36" stroke-width="3"/><polygon points="420,110 620,135 655,235 395,255" fill="#d9eee5" stroke="#163f36" stroke-width="3"/><text x="185" y="83" font-size="19" text-anchor="middle">Isosceles trapezoid</text><text x="520" y="84" font-size="19" text-anchor="middle">General quadrilateral</text><text x="172" y="111" font-size="24" text-anchor="start">›</text><text x="172" y="246" font-size="24" text-anchor="start">›</text><line x1="81" y1="168" x2="99" y2="177" stroke="#b44d32" stroke-width="3"/><line x1="272" y1="177" x2="290" y2="168" stroke="#b44d32" stroke-width="3"/><text x="40" y="299" font-size="17" text-anchor="start">One parallel pair; equal legs are marked.</text><text x="400" y="299" font-size="17" text-anchor="start">No special properties given.</text><text x="40" y="333" font-size="19" text-anchor="start">Trapezoid here means at least one pair of parallel sides.</text></g></svg>