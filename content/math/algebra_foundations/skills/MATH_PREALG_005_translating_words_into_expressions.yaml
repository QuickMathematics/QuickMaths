id: MATH_PREALG_005
schema_version: 0.2
name: Translating words into expressions
domain: Math
subdomain: Pre-Algebra
description: Translate common word phrases into algebraic expressions using variables, operations, and grouping.
prerequisites:
  - MATH_PREALG_001
tags:
  - pre_algebra
  - variables
  - expressions
  - translating_words
  - word_phrases
  - algebraic_expressions
  - order_sensitive_phrases
  - grouping
unlocks:
  - MATH_GRAPH_003
mastery:
  passing_score: 0.8
  minimum_confidence: 3
  review_after_days_if_mastered: 7
  review_after_days_if_learning: 2
theory: |
  Translating words into expressions means turning a phrase into algebra.

  A variable represents the unknown number. Operations come from key words such as sum, difference, product, quotient, more than, less than, increased by, and decreased by.

  Why it matters:
  Word problems become much easier when you can turn the words into an expression. This skill is also important for writing formulas, rates, and linear models.

  Common translations:
  - "the sum of x and 5" means x + 5.
  - "5 more than x" means x + 5.
  - "x increased by 5" means x + 5.
  - "5 less than x" means x - 5.
  - "x decreased by 5" means x - 5.
  - "5 subtracted from x" means x - 5.
  - "x subtracted from 5" means 5 - x.
  - "3 times x" means 3x.
  - "x divided by 4" means x/4.
  - "4 divided by x" means 4/x.
  - "twice the sum of x and 7" means 2(x + 7).

  Method:
  1. Choose the variable named in the prompt, usually x.
  2. Identify the operation words.
  3. Watch order-sensitive phrases like "less than" and "subtracted from."
  4. Use parentheses when a whole sum or difference is being multiplied or divided.
  5. Check whether the phrase means "multiply the number first, then add" or "multiply the whole group."

  Important difference:
  "3 times a number increased by 5" means 3x + 5.

  But:
  "3 times the sum of a number and 5" means 3(x + 5).

  Common mistake:
  "5 less than x" is x - 5, not 5 - x. The phrase "less than" reverses the order.

  Another common mistake:
  Do not forget grouping. "Twice the sum of x and 4" is 2(x + 4), not 2x + 4.
examples:
  - prompt: "Translate: 8 more than a number. Use x for the number."
    solution: "x + 8"
    explanation: "More than means add. The number is x, so the expression is x + 8."
  - prompt: "Translate: 6 less than a number. Use x for the number."
    solution: "x - 6"
    explanation: "Less than reverses the order: 6 less than x means x - 6."
  - prompt: "Translate: a number subtracted from 10. Use x for the number."
    solution: "10 - x"
    explanation: "x is being subtracted from 10, so the expression is 10 - x."
  - prompt: "Translate: 4 times a number increased by 9. Use x for the number."
    solution: "4x + 9"
    explanation: "4 times the number is 4x. Increased by 9 means add 9."
  - prompt: "Translate: 4 times the sum of a number and 9. Use x for the number."
    solution: "4(x + 9)"
    explanation: "The whole sum x + 9 is multiplied by 4."
  - prompt: "Translate: twice the difference of a number and 5. Use x for the number."
    solution: "2(x - 5)"
    explanation: "The difference x - 5 is grouped first, then multiplied by 2."
  - prompt: "Translate: the quotient of a number and 7. Use x for the number."
    solution: "x/7"
    explanation: "The number x is divided by 7."
  - prompt: "Translate: the quotient of 7 and a number. Use x for the number."
    solution: "7/x"
    explanation: "7 is divided by x, so the order matters."
applications:
  - title: "Word problems"
    description: "Translating words into expressions is the first step in turning a story into math."
  - title: "Linear models"
    description: "Phrases like starting amount plus a rate times x become linear expressions."
  - title: "Programming"
    description: "Turning requirements into expressions is similar to writing formulas in code."
  - title: "Formulas"
    description: "Many formulas come from translating relationships into algebraic expressions."
