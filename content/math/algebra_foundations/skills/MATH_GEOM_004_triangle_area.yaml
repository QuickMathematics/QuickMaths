examples:
  - prompt: "Find the area of the triangle with base 8 cm and the marked perpendicular height of 5 cm. Its other sides are slanted."
    solution: "20 cm²"
    explanation: "The dashed height meets the base at a right angle. Use that 5 cm distance, not a sloping side. A = 8 × 5 ÷ 2 = 20 cm². The matching base-height rectangle would cover 40 cm²."
    media:
      - src: media/triangle-area/inside-height.svg
        alt: "An acute triangle has a horizontal base of 8 cm and an interior dashed perpendicular height of 5 cm, marked with a right-angle square at the base."
        caption: "The height is a perpendicular distance. It need not be one of the triangle's sides."
        width: 720
        height: 480
  - prompt: "The base is 6 cm and its perpendicular height is 4 cm, but the height lands beyond the left end of the base. Is the formula still valid?"
    solution: "Yes. The area is 12 cm²."
    explanation: "Extend the line through the base until it meets the perpendicular from the opposite vertex. The dashed extension is not extra base length. Use the actual 6 cm base and the 4 cm height, so A = 6 × 4 ÷ 2 = 12 cm²."
    media:
      - src: media/triangle-area/outside-height.svg
        alt: "An obtuse triangle has base 6 cm. The opposite vertex lies left of the base, with a dashed vertical height of 4 cm meeting the extended base line at a right angle outside the triangle."
        caption: "Extend the base line to locate the height; keep the base length at 6 cm."
        width: 720
        height: 480
  - prompt: "A triangle is drawn with a vertical base of 6 cm. Its matching horizontal height is 4 cm. Find its area."
    solution: "12 cm²"
    explanation: "Base and height describe a perpendicular pair, not directions on the page. Multiply 6 × 4 and divide by 2. Rotation changes the drawing's orientation, not its area."
    media:
      - src: media/triangle-area/rotated-triangle.svg
        alt: "A right triangle has a vertical base of 6 cm and a horizontal perpendicular height of 4 cm along its top side. Their right angle is marked at the top left."
        caption: "A base can be vertical. Match the height to the chosen base."
        width: 720
        height: 480
  - prompt: "Find the area when the base is 3/2 m and the perpendicular height is 5 m."
    solution: "15/4 m², or 3.75 m²"
    explanation: "A = (3/2) × 5 ÷ 2 = 15/4. Dividing by 2 is the same as multiplying by 1/2. Keep the exact fraction or an equivalent decimal; there is no reason to round to a whole number."
  - prompt: "A triangular sign has base 1.2 m and perpendicular height 50 cm. Find the area in m²."
    solution: "0.3 m²"
    explanation: "Convert 50 cm to 0.5 m before multiplying. Then A = 1.2 × 0.5 ÷ 2 = 0.3 m². As a check in centimetres, 120 × 50 ÷ 2 = 3,000 cm², which is 0.3 m²."
  - prompt: "A triangle has area 35 cm² and base 10 cm. Find the perpendicular height."
    solution: "7 cm"
    explanation: "Double the area to undo the halving, then divide by the known base. h = 2 × 35 ÷ 10 = 7 cm. Check the answer in the original formula: 10 × 7 ÷ 2 = 35 cm². The missing height is a length, so its unit is cm."
  - prompt: "A triangle's base and height are both tripled. What happens to its area? What if only its height is tripled?"
    solution: "Both lengths tripled give 9 times the area. Only the height tripled gives 3 times the area."
    explanation: "The area formula multiplies base by height. Scaling both contributes 3 × 3 = 9; scaling just one contributes one factor of 3. The division by 2 is unchanged in both comparisons."
  - prompt: "A 12 cm by 9 cm rectangle has a triangular corner cut out. The cutout's perpendicular sides are 4 cm and 3 cm. Find the area left."
    solution: "102 cm²"
    explanation: "The rectangle has area 12 × 9 = 108 cm². The removed triangle has area 4 × 3 ÷ 2 = 6 cm². Subtract the cutout once: 108 − 6 = 102 cm². Adding the triangle or forgetting to halve it would give the wrong remaining area."
applications:
  - title: Gardens and floor plans
    description: Estimate the turf, paving, or flooring for a triangular space. Measure its perpendicular height; the length of a sloping boundary may be different.
  - title: Signs, sails, and fabric
    description: Calculate a triangular surface area, then multiply by a price per square metre to estimate material cost. Allow separately for any hems or waste specified by the task.
  - title: Design at a different scale
    description: A design doubled in both length and width uses four times the material area. Distinguish the scale factor for lengths from the factor for area.
