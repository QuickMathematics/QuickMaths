id: MATH_GEOM_004
schema_version: 0.2
name: 'Triangle area: base and perpendicular height'
domain: Math
subdomain: Geometry
topic: Plane Geometry
description: Choose a matching base and perpendicular height, calculate triangle area, and reason about units, missing lengths, and scale.
prerequisites:
  - MATH_ARITH_004
  - MATH_ARITH_005
tags:
  - geometry
  - triangles
  - area
  - perpendicular_height
  - unit_conversion
  - scale
unlocks: []
mastery:
  passing_score: 0.8
