id: MATH_ALG_008
schema_version: 0.2
name: Absolute value as distance
domain: Math
subdomain: Algebra Foundations
description: Interpret absolute value as distance from zero and solve simple absolute value equations.
prerequisites:
  - MATH_ARITH_001
  - MATH_ALG_001
tags:
  - algebra
  - absolute_value
  - distance
  - number_line
  - equations
  - one_step_equations
unlocks: []
mastery:
  passing_score: 0.8
  minimum_confidence: 3
  review_after_days_if_mastered: 7
  review_after_days_if_learning: 2
theory: |
  Absolute value measures distance from zero on the number line.

  Because distance is never negative, absolute value is always zero or positive.

  Notation:
  |5| = 5
  |-5| = 5
  |0| = 0

  Why it matters:
  Absolute value helps describe distance, error, change, and "how far apart" two numbers are. It also leads to equations that often have two solutions.

  Method:
  1. To evaluate an absolute value, ask how far the number is from 0.
  2. If the number inside is positive, the absolute value stays positive.
  3. If the number inside is negative, the absolute value becomes positive.
  4. To solve |x| = a when a is positive, use x = a or x = -a.
  5. To solve |x| = 0, the only solution is x = 0.

  Example:
  |-8| = 8 because -8 is 8 units from zero.

  Example:
  |x| = 6 has two solutions: x = 6 and x = -6.

  Common mistake:
  Do not say |x| = 6 only has x = 6. Both 6 and -6 are 6 units from zero.
examples:
  - prompt: "Compute: |-9|"
    solution: "9"
    explanation: "-9 is 9 units from zero, so |-9| = 9."
  - prompt: "Compute: |12|"
    solution: "12"
    explanation: "12 is already positive, so |12| = 12."
  - prompt: "Solve: |x| = 7"
    solution: "x = 7 or x = -7"
    explanation: "Both 7 and -7 are 7 units from zero."
  - prompt: "Solve: |x| + 3 = 11"
    solution: "x = 8 or x = -8"
    explanation: "Subtract 3 first to get |x| = 8, then use both distances from zero."
applications:
  - title: "Distance"
    description: "Absolute value describes distance on a number line, regardless of direction."
  - title: "Measurement error"
    description: "Absolute value can describe how far a measurement is from the target value."
  - title: "Algebra equations"
    description: "Absolute value equations often have two solutions because two numbers can be the same distance from zero."
test:
  question_count: 8
  randomize_order: true
  questions:
    - id: ABS_EVALUATE_NEGATIVE_001
      type: generated
      prompt_template: "Compute: |{n}|"
      answer_mode: final_only
      variables:
        n:
          type: int
          min: -30
          max: -1
      derived:
        distance: "abs(n)"
      answer:
        type: numeric
        value: "{distance}"
      grading:
        method: exact_numeric
      work:
        mode: none
      review_policy:
        work_review: none
        mastery_requires_review_pass: false
      explanation_template: |
        Absolute value is distance from zero.
        {n} is {distance} units from zero.
        So |{n}| = {distance}.
      mistake_tags:
        - absolute_value_error
        - sign_error
        - distance_error
      difficulty: easy

    - id: ABS_EVALUATE_POSITIVE_001
      type: generated
      prompt_template: "Compute: |{n}|"
      answer_mode: final_only
      variables:
        n:
          type: int
          min: 1
          max: 30
      answer:
        type: numeric
        value: "{n}"
      grading:
        method: exact_numeric
      work:
        mode: none
      review_policy:
        work_review: none
        mastery_requires_review_pass: false
      explanation_template: |
        Absolute value is distance from zero.
        {n} is already positive and is {n} units from zero.
        So |{n}| = {n}.
      mistake_tags:
        - absolute_value_error
        - distance_error
      difficulty: easy

    - id: ABS_DISTANCE_FROM_ZERO_001
      type: generated
      prompt_template: "How far is {n} from 0 on the number line?"
      answer_mode: final_only
      variables:
        n:
          type: int
          min: -30
          max: 30
          exclude: [0]
      derived:
        distance: "abs(n)"
      answer:
        type: numeric
        value: "{distance}"
      grading:
        method: exact_numeric
      work:
        mode: none
      review_policy:
        work_review: none
        mastery_requires_review_pass: false
      explanation_template: |
        Distance from zero is absolute value.
        |{n}| = {distance}.
        So {n} is {distance} units from 0.
      mistake_tags:
        - absolute_value_error
        - distance_error
        - sign_error
      difficulty: easy

    - id: ABS_SAME_DISTANCE_001
      type: generated
      prompt_template: "Which pair of numbers is the same distance from 0?"
      answer_mode: final_only
      variables:
        a:
          type: int
          min: 2
          max: 20
      derived:
        neg_a: "0 - a"
        next_a: "a + 1"
        neg_next_a: "0 - (a + 1)"
      options:
        - id: A
          label: "{a} and {neg_a}"
        - id: B
          label: "{a} and {next_a}"
        - id: C
          label: "{neg_a} and {neg_next_a}"
        - id: D
          label: "0 and {a}"
      answer:
        type: multiple_choice
        value: "A"
      grading:
        method: multiple_choice
      work:
        mode: none
      review_policy:
        work_review: none
        mastery_requires_review_pass: false
      explanation_template: |
        Opposite numbers are the same distance from zero.
        {a} and {neg_a} are both {a} units from 0.
      mistake_tags:
        - absolute_value_error
        - distance_error
        - number_line_error
      difficulty: medium

    - id: ABS_SOLVE_BASIC_001
      type: generated
      prompt_template: "Solve: |x| = {a}"
      answer_mode: final_only
      variables:
        a:
          type: int
          min: 2
          max: 20
      derived:
        neg_a: "0 - a"
      options:
        - id: A
          label: "x = {a}"
        - id: B
          label: "x = {neg_a}"
        - id: C
          label: "x = {a} or x = {neg_a}"
        - id: D
          label: "x = 0"
      answer:
        type: multiple_choice
        value: "C"
      grading:
        method: multiple_choice
      work:
        mode: none
      review_policy:
        work_review: none
        mastery_requires_review_pass: false
      explanation_template: |
        |x| = {a} means x is {a} units from zero.
        Two numbers are {a} units from zero: {a} and {neg_a}.
        So x = {a} or x = {neg_a}.
      mistake_tags:
        - absolute_value_equation
        - missing_negative_solution
        - distance_error
      difficulty: medium

    - id: ABS_SOLVE_ZERO_001
      type: fixed
      prompt: "Solve for x: |x| = 0"
      answer_mode: final_plus_required_work
      answer:
        type: equation_solution
        variable: x
        value: "0"
      grading:
        method: equation_solution
      work:
        mode: procedural_steps
        prompt: "Show each equation step, ending with x = your final answer."
        line_type: equation
        target_variable: x
        minimum_steps: 2
        require_final_answer_match: true
      review_policy:
        work_review: auto
        mastery_requires_review_pass: false
      explanation_template: |
        Only 0 is zero units from zero.
        So |x| = 0 has one solution: x = 0.
      mistake_tags:
        - absolute_value_equation
        - zero_error
        - distance_error
      difficulty: medium

    - id: ABS_SOLVE_PLUS_CONSTANT_001
      type: generated
      prompt_template: "Solve: |x| + {b} = {c}"
      answer_mode: final_only
      variables:
        r:
          type: int
          min: 2
          max: 20
        b:
          type: int
          min: 2
          max: 20
      derived:
        c: "r + b"
        neg_r: "0 - r"
      options:
        - id: A
          label: "x = {r}"
        - id: B
          label: "x = {neg_r}"
        - id: C
          label: "x = {r} or x = {neg_r}"
        - id: D
          label: "x = {c}"
      answer:
        type: multiple_choice
        value: "C"
      grading:
        method: multiple_choice
      work:
        mode: none
      review_policy:
        work_review: none
        mastery_requires_review_pass: false
      explanation_template: |
        Start with |x| + {b} = {c}.
        Subtract {b} from both sides: |x| = {r}.
        Therefore x = {r} or x = {neg_r}.
      mistake_tags:
        - absolute_value_equation
        - inverse_operations
        - missing_negative_solution
        - arithmetic_error
      difficulty: hard

    - id: ABS_SOLVE_MULTIPLY_001
      type: generated
      prompt_template: "Solve: {a}|x| = {c}"
      answer_mode: final_only
      variables:
        r:
          type: int
          min: 2
          max: 15
        a:
          type: int
          min: 2
          max: 10
      derived:
        c: "a * r"
        neg_r: "0 - r"
      options:
        - id: A
          label: "x = {r}"
        - id: B
          label: "x = {neg_r}"
        - id: C
          label: "x = {r} or x = {neg_r}"
        - id: D
          label: "x = {c}"
      answer:
        type: multiple_choice
        value: "C"
      grading:
        method: multiple_choice
      work:
        mode: none
      review_policy:
        work_review: none
        mastery_requires_review_pass: false
      explanation_template: |
        Start with {a}|x| = {c}.
        Divide both sides by {a}: |x| = {r}.
        Therefore x = {r} or x = {neg_r}.
      mistake_tags:
        - absolute_value_equation
        - inverse_operations
        - missing_negative_solution
        - division_error
      difficulty: hard
