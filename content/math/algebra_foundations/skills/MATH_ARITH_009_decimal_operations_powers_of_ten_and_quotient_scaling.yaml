theory: 'Decimals extend place value to parts smaller than one whole. The tenths place is 1/10, the hundredths
  place is 1/100, and the thousandths place is 1/1000. In 4.307, the 4 means four ones, the 3 means three tenths,
  the 0 means no hundredths, and the 7 means seven thousandths. Trailing zeros do not change a value: 2.5 =
  2.50 = 2.500. They can make alignment visible, so write equal numbers of decimal places before adding or
  subtracting.


  Addition and subtraction combine quantities measured in the same unit. Align decimal points vertically, then
  add or subtract each place. For 6.40 + 2.375, write 6.400 + 2.375 = 8.775. The zeros are placeholders, not
  new quantity. Estimate first: 6.4+2.4 is about 8.8, so 8.775 is plausible. In a difference such as 10.000
  - 3.68, write 3.680 and regroup across places. Check subtraction by adding the difference back to the smaller
  amount.


  Multiplication by a whole number is repeated addition; multiplication by a decimal can be understood by place
  value and an area model. Compute 2.4×3 by first thinking 24 tenths×3 = 72 tenths = 7.2. For 0.6×0.4, six
  tenths times four tenths gives 24 hundredths, or 0.24. Count total decimal places in the factors as a useful
  placement check, then estimate the size. Multiplying by a number between 0 and 1 makes a positive amount
  smaller; multiplying by a number greater than 1 makes it larger.


  Decimal division asks how many groups of a chosen size fit, or how much each share receives. If 8.4 litres
  are shared into 4 equal containers, 8.4÷4=2.1 litres each. If 8.4 metres are cut into 0.7-metre pieces, 8.4÷0.7
  asks for the number of pieces, which is 12. The divisor is the unit being counted, so it cannot be zero.
  Division by a number between 0 and 1 can produce a larger quotient because many small groups fit in the dividend.


  Powers of ten explain place shifts. Multiplying by 10 moves every digit one place left: 3.47×10=34.7. Multiplying
  by 100 moves two places; dividing by 10 moves one place right. These are place-value changes, not a magical
  rule about “moving the decimal” without tracking zeros. For 0.058×1000, the 5 moves from hundredths to tens,
  giving 58. Dividing 5800 by 100 gives 58. If there are not enough written digits, add zeros as placeholders:
  4.2÷100=0.042.


  Scaling both dividend and divisor by the same nonzero power of ten leaves a quotient unchanged. This is how
  we make a decimal divisor a whole number: 3.6÷0.12 becomes 360÷12=30 after multiplying both numbers by 100.
  Scaling only the dividend changes the answer by a factor of 100; scaling only the divisor changes it in the
  opposite direction. Write the equality explicitly: (a×100)/(b×100)=a/b. The operation is a value-preserving
  rewrite, not a license to alter one part of a fraction.


  Units keep decimal operations meaningful. A price of 2.40 dollars plus 0.75 dollars is 3.15 dollars; a length
  of 2.40 m cannot be added to 0.75 kg. In a multi-step situation, carry a unit with each intermediate value
  and round only when the context requires it. Keep exact decimal values while calculating so that early rounding
  does not accumulate error. If a display reports money to cents, explain whether the stored calculation was
  exact and the final display was rounded.


  Use three checks: estimate the size, verify place alignment, and reverse with an inverse operation when possible.
  A quotient times its divisor should reconstruct the dividend, up to any stated rounding. The capstone asks
  you to explain why both entries are scaled when a decimal divisor is cleared and to interpret the quotient
  with units.

  A quotient can be read in two distinct ways. If 8.4 litres are poured into 0.7-litre bottles, 8.4÷0.7 counts
  bottles; if 8.4 litres are shared among 0.7 groups, the context is different. The divisor is never just a
  number to manipulate: it names the unit or group size. When a quotient is larger than the dividend, ask whether
  the divisor is a positive fraction smaller than one; twelve 0.7-metre segments can fit in 8.4 metres even
  though 12 is larger than 8.4. This size check prevents a rule learned for whole-number divisors from becoming
  a false universal.


  Decimal notation also supports exact fractions. Terminating decimals such as 0.125 represent 125/1000 and
  can be simplified to 1/8. Repeating decimals require a stated rounding policy if a display is finite. In
  a financial or scientific calculation, preserve a terminating exact value through the intermediate steps
  and round only at the reporting boundary. If an answer is a measured approximation, carry its uncertainty
  rather than suggesting that every displayed digit was known exactly.

  '
examples:
- prompt: Add 6.40 and 2.375.
  solution: '8.775'
  explanation: Write 6.400 so decimal places align, then add by place.
- prompt: Subtract 3.68 from 10.
  solution: '6.32'
  explanation: Write 10.00−3.68; regrouping gives 6.32.
- prompt: Multiply 2.4 by 3.
  solution: '7.2'
  explanation: 24 tenths×3=72 tenths=7.2.
- prompt: Multiply 0.6 by 0.4.
  solution: '0.24'
  explanation: Six tenths times four tenths is 24 hundredths.
- prompt: Divide 8.4 by 4.
  solution: '2.1'
  explanation: Four equal groups of 2.1 reconstruct 8.4.
- prompt: Divide 8.4 by 0.7.
  solution: '12'
  explanation: 'Scale both by 10: 84÷7=12 pieces.'
- prompt: Compute 3.47×100.
  solution: '347'
  explanation: Each digit shifts two places left; 3.47 becomes 347.
- prompt: Compute 4.2÷100.
  solution: '0.042'
  explanation: Two place shifts right require a zero placeholder.
- prompt: Compute 3.6÷0.12 by scaling.
  solution: '30'
  explanation: 'Multiply dividend and divisor by 100: 360÷12=30.'
- prompt: Why does 0.50 equal 0.5?
  solution: Both are five tenths.
  explanation: The trailing zero adds no hundredths; it can help show alignment.
applications:
- title: Money and receipts
  description: Decimal addition, subtraction, and final cent display keep prices, tax, and change tied to dollars
    and cents.
- title: Recipe scaling
  description: Multiplication and division scale ingredient amounts while preserving the unit of cups, grams,
    or litres.
- title: Rates and data
  description: A decimal divisor can represent a unit rate such as metres per segment or litres per container.
- title: Sensors and measurements
  description: Powers of ten convert milli-, base-, and kilo-units, while quotient checks expose misplaced
    decimal points.
