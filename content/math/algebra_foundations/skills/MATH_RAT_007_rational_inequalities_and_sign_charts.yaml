id: MATH_RAT_007
schema_version: 0.2
name: Rational inequalities and sign charts
domain: Math
subdomain: Rational Functions
description: Solve rational inequalities by combining expressions, factoring numerators and denominators, marking zeros
  and excluded values, completing sign charts, and reporting interval unions.
prerequisites:
- MATH_INEQ_002
- MATH_RAT_006
tags:
- rational_inequalities
- sign_charts
- interval_notation
- domain_restrictions
- holes
- vertical_asymptotes
- factoring
- critical_points
unlocks: []
mastery:
  passing_score: 0.8
  minimum_confidence: 3
  review_after_days_if_mastered: 7
  review_after_days_if_learning: 2
theory: |-
  A rational inequality compares a rational expression with zero or with another expression.

  Examples:

  (x - 2)/(x - 5) > 0

  1/(x + 3) <= 1/(x - 4)

  The reliable method is to move everything to one side, write one rational expression, and use a sign chart.

  Critical points come from two places:
  1. Numerator zeros make the rational expression equal zero.
  2. Denominator zeros make the original expression undefined.

  Both types divide the number line into sign intervals, but they behave differently at endpoints.

  Endpoint rule:
  - A numerator zero may be included when the inequality uses <= or >=.
  - A denominator zero is never included.
  - A canceled denominator factor creates a hole and is still never included.

  General method:
  1. Move every term to one side so the other side is 0.
  2. Combine the left side into one rational expression.
  3. Factor the numerator and denominator completely.
  4. Record all original denominator restrictions.
  5. Find numerator zeros.
  6. Place zeros, poles, and holes in increasing order.
  7. Test one value in every resulting interval.
  8. Select intervals with the requested sign.
  9. Include allowed numerator zeros for <= or >=.
  10. Exclude every denominator zero and hole.
  11. Write the final set as a union of intervals.

  Example:
  Solve (x - 2)/(x - 5) >= 0.

  Critical points:
  - x = 2 is a numerator zero.
  - x = 5 is undefined.

  Signs:
  - x < 2: positive.
  - 2 < x < 5: negative.
  - x > 5: positive.

  The symbol >= includes x = 2 but can never include x = 5.

  Solution:

  (-inf, 2] U (5, inf)

  Canceled factors and holes:
  Consider:

  [(x - 1)(x + 4)] / [(x - 1)(x - 3)] > 0

  The factor x - 1 cancels from the formula, but x = 1 remains excluded from the original domain. The hole can split an otherwise selected interval even though the sign does not change there.

  Repeated factors:
  An even power does not change sign across its zero or excluded value. A denominator factor with even multiplicity still creates an excluded point, but the signs on its two sides match.

  Comparisons not already against zero:
  Before drawing a sign chart, subtract one side from the other.

  Example:

  (x - 1)/(x - 4) >= 1

  becomes:

  (x - 1)/(x - 4) - 1 >= 0

  3/(x - 4) >= 0

  The only critical point is x = 4, which is excluded. The expression is positive for x > 4, so the solution is (4, inf).

  Common mistake:
  Do not cross multiply through an inequality unless you know the denominator's sign. A sign chart avoids that trap.

  Another common mistake:
  Do not include a denominator zero when the inequality uses <= or >=. Undefined is never part of the solution.

  Another common mistake:
  Do not erase a canceled hole from the number line. The formula may simplify, but the original domain restriction remains.
examples:
- prompt: Solve (x - 2)/(x - 5) > 0.
  solution: (-inf, 2) U (5, inf)
  explanation: The ratio is positive where numerator and denominator have the same sign.
- prompt: Solve (x + 1)/(x - 4) <= 0.
  solution: '[-1, 4)'
  explanation: Include the numerator zero -1, but exclude the denominator zero 4.
- prompt: Solve 1/[(x - 2)(x - 7)] > 0.
  solution: (-inf, 2) U (7, inf)
  explanation: The denominator product is positive outside its two zeros.
- prompt: Solve (x - 1)^2/(x - 6) <= 0.
  solution: (-inf, 6)
  explanation: The square is nonnegative and the denominator is negative for x < 6; x = 1 is allowed and makes the expression
    zero.
- prompt: Solve (x - 1)/(x - 4)^2 >= 0.
  solution: '[1, 4) U (4, inf)'
  explanation: The squared denominator stays positive but x = 4 remains excluded.
- prompt: Solve 1/(x - 3)^2 < 0.
  solution: empty set
  explanation: The expression is positive everywhere it is defined.
- prompt: Solve 1/(x + 2) - 1/(x - 5) > 0.
  solution: (-2, 5)
  explanation: The combined numerator is negative, so the quotient is positive between the denominator zeros.
- prompt: Why can an excluded hole split an interval?
  solution: The original function is undefined there.
  explanation: Cancellation changes the formula but not the original domain.
applications:
- title: Rational function graphs
  description: Sign intervals show where a rational graph lies above or below the x-axis.
- title: Rate constraints
  description: Rational inequalities model when time, speed, efficiency, or cost remains within a limit.
- title: Domain-aware algebra
  description: The method keeps holes and vertical asymptotes separate from ordinary zeros.
- title: Calculus preparation
  description: Sign charts for rational expressions are later used in derivative and limit analysis.
