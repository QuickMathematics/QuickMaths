    variables:
      a:
        type: int
        min: -10
        max: 4
      gap:
        type: int
        min: 2
        max: 9
    derived:
      b: a + gap
    answer:
      type: interval_set
      variable: x
      value: (-inf, {a}) U ({b}, inf)
    grading:
      method: interval_set
    work:
      mode: sign_chart_steps
      prompt: Factor or combine as needed, list every critical point, complete the sign chart, decide endpoint inclusion,
        and enter the final solution in interval notation.
      target_variable: x
      sign_chart:
        expression_kind: rational
        expression: (x - {a})/(x - {b})
        relation: '>'
        expected_factorization: (x - {a})/(x - {b})
        require_factorization: false
        critical_points:
        - value: '{a}'
          kind: zero
          multiplicity: 1
          factor: x - {a}
        - value: '{b}'
          kind: undefined
          multiplicity: 1
          factor: x - {b}
        require_test_values: true
        require_interval_signs: true
        require_endpoint_decisions: true
        require_final_answer_match: true
        reduced_expression: (x - {a})/(x - {b})
    review_policy:
      work_review: auto
      mastery_requires_review_pass: false
    explanation_template: |-
      The numerator is zero at x = {a}.
      The denominator is zero at x = {b}, so {b} is excluded.
      The ratio is positive on the two outside intervals.
      The strict solution is (-inf, {a}) U ({b}, inf).
