  review_after_days_if_learning: 2
theory: |
  A literal equation is an equation with several variables. Solving a literal equation means rearranging it to isolate one chosen variable.

  This matters because formulas in science, geometry, graphing, and programming often need to be rewritten depending on what value you want to find.

  Method:
  1. Identify the variable you are solving for.
  2. Treat every other variable like a known number.
  3. Undo addition or subtraction first.
  4. Undo multiplication or division second.
  5. Stop when the chosen variable is alone.
  6. When you divide by a variable or expression, assume that denominator is not zero.

  Example:
  Solve y = m*x + b for b.

  y = m*x + b
  y - m*x = b
  b = y - m*x

  Example:
  Solve a*x + b = c for x.

  a*x + b = c
  a*x = c - b
  x = (c - b)/a

  Common mistake:
  Do not plug in numbers unless the problem gives numbers. In literal equations, the answer is usually another expression.

  Another common mistake:
  Keep the whole numerator grouped. Solving a*x + b = c for x gives x = (c - b)/a, not x = c - b/a.

  Another common mistake:
  If a variable is being multiplied by several factors, divide by the entire product. From v = l*w*h, solving for h gives h = v/(l*w).
examples:
  - prompt: "Solve for b: y = m*x + b"
    solution: "y - m*x"
    explanation: "Subtract m*x from both sides to isolate b."
  - prompt: "Solve for x: a*x + b = c"
    solution: "(c - b)/a"
    explanation: "Subtract b from both sides, then divide by a."
  - prompt: "Solve for t: d = r*t"
    solution: "d/r"
    explanation: "Divide both sides by r."
  - prompt: "Solve for x: p = 2*x + 2*y"
    solution: "(p - 2*y)/2"
    explanation: "Subtract 2*y, then divide by 2. Equivalent forms like p/2 - y are also correct."
  - prompt: "Solve for h: v = l*w*h"
    solution: "v/(l*w)"
    explanation: "h is multiplied by l*w, so divide both sides by l*w."
  - prompt: "Solve for f: c = 5*(f - 32)/9"
    solution: "9*c/5 + 32"
    explanation: "Multiply by 9, divide by 5, then add 32."
applications:
  - title: "Physics formulas"
    description: "Literal equations let learners rearrange formulas such as d = r*t or F = m*a for the unknown they need."
  - title: "Geometry"
    description: "Area, perimeter, and volume formulas often need to be solved for a missing dimension."
  - title: "Linear functions"
    description: "Rearranging formulas prepares learners to work with slope-intercept form and related line equations."
  - title: "Programming formulas"
    description: "Rearranging formulas helps learners understand how one variable depends on the others."
