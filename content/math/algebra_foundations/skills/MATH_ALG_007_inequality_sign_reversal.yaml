  randomize_order: true
  questions:
    - id: SIGN_REV_NEG_COEFF_LESS_THAN_001
      type: generated
      prompt_template: "Solve for x. Write your answer like x > 5. {a}x < {c}"
      answer_mode: final_plus_required_work
      variables:
        x:
          type: int
          min: -15
          max: 15
          exclude: [0]
        a:
          type: int
          min: -12
          max: -2
      derived:
        c: "a * x"
      answer:
        type: text
        value: "x > {x}"
      grading:
        method: inequality_solution
      work:
        mode: procedural_steps
        prompt: "Show each equivalent inequality step, reversing the sign exactly when multiplying or dividing by a negative."
        line_type: inequality
        target_variable: x
        minimum_steps: 2
        require_final_answer_match: true
      review_policy:
        work_review: auto
        mastery_requires_review_pass: false
      explanation_template: |
        Start with {a}x < {c}.
        Divide both sides by {a}.
        Since {a} is negative, reverse the sign.
        The solution is x > {x}.
      mistake_tags:
        - inequality_error
        - sign_reversal
        - negative_coefficient
        - division_error
      difficulty: easy

