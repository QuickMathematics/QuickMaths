id: MATH_ALG_007
schema_version: 0.2
name: Inequality sign reversal
domain: Math
subdomain: Algebra Foundations
description: Solve inequalities that require reversing the inequality sign after multiplying or dividing by a negative number.
prerequisites:
  - MATH_ALG_006
tags:
  - algebra
  - inequalities
  - inequality_sign_reversal
  - inverse_operations
  - negative_numbers
  - linear_inequalities
unlocks: []
mastery:
  passing_score: 0.8
  minimum_confidence: 3
  review_after_days_if_mastered: 7
  review_after_days_if_learning: 2
theory: |
  When you multiply or divide both sides of an inequality by a negative number, you must reverse the inequality sign.

  This matters because negative coefficients show up often in algebra. If you forget to flip the sign, your final solution describes the wrong side of the number line.

  Rule:
  - Dividing by a positive number keeps the inequality sign the same.
  - Dividing by a negative number reverses the inequality sign.
  - Multiplying by a negative number also reverses the inequality sign.

  Example:
  Solve -3x < 12.
  Divide both sides by -3.
  Because you divided by a negative number, reverse the sign: x > -4.

  Common mistake:
  Do not flip the sign just because you see a negative number. Flip only when you multiply or divide both sides by a negative number.
examples:
  - prompt: "Solve: -2x < 10"
    solution: "x > -5"
    explanation: "Divide by -2 and reverse the sign."
  - prompt: "Solve: -4x >= 20"
    solution: "x <= -5"
    explanation: "Divide by -4 and reverse >= to <=."
  - prompt: "Solve: -3x + 7 < 16"
    solution: "x > -3"
    explanation: "Subtract 7 first to get -3x < 9. Then divide by -3 and reverse the sign."
  - prompt: "Solve: x / (-5) <= 3"
    solution: "x >= -15"
    explanation: "Multiply both sides by -5 and reverse <= to >=."
applications:
  - title: "Number-line reasoning"
    description: "Sign reversal explains why multiplying by a negative reflects values across zero."
  - title: "Linear inequalities"
    description: "Negative coefficients are common in inequalities, so sign reversal is essential for correct solving."
  - title: "Constraints"
    description: "Reversing signs correctly keeps real-world limits such as maximums and minimums meaningful."
test:
