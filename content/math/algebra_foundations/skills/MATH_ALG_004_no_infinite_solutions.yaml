id: MATH_ALG_004
schema_version: 0.2
name: No and infinite solutions
domain: Math
subdomain: Algebra Foundations
description: Classify linear equations as having one solution, no solution, or infinitely many solutions.
prerequisites:
  - MATH_ALG_003
tags:
  - algebra
  - equations
  - linear_equations
  - no_solution
  - infinite_solutions
  - one_solution
  - variables_on_both_sides
  - equation_classification
unlocks:
  - MATH_SYS_001
mastery:
  passing_score: 0.8
  minimum_confidence: 3
  review_after_days_if_mastered: 7
  review_after_days_if_learning: 2
theory: |
  Some linear equations do not end with one value for x.

  When solving an equation with variables on both sides, the variable terms may cancel out. What remains tells you what kind of equation you have.

  Decision rule:
  1. If you get a true statement like 8 = 8, the equation has infinitely many solutions.
  2. If you get a false statement like 8 = 11, the equation has no solution.
  3. If one variable term remains, the equation has one solution.

  Example:
  3x + 5 = 3x + 5

  Subtract 3x from both sides:

  5 = 5

  This is always true, so there are infinitely many solutions.

  Example:
  4x + 2 = 4x + 9

  Subtract 4x from both sides:

  2 = 9

  This is false, so there is no solution.

  Example:
  8x + 4 = 2x + 22

  Subtract 2x from both sides:

  6x + 4 = 22

  One variable term remains, so the equation has one solution.

  Common mistake:
  Do not write x = 0 just because the x-terms cancel. Look at the statement that remains.

  Another common mistake:
  If both sides simplify to the same expression, the equation has infinitely many solutions, not one solution.

  Another common mistake:
  If the variable terms cancel and the constants are different, the equation has no solution.
examples:
  - prompt: "Classify: 5x + 7 = 5x + 7"
    solution: "Infinitely many solutions"
    explanation: "Subtract 5x from both sides to get 7 = 7, which is always true."
  - prompt: "Classify: 6x - 3 = 6x + 10"
    solution: "No solution"
    explanation: "Subtract 6x from both sides to get -3 = 10, which is false."
  - prompt: "Classify: 8x + 4 = 2x + 22"
    solution: "One solution"
    explanation: "Subtract 2x from both sides to get 6x + 4 = 22, so one variable term remains."
  - prompt: "Classify: 3(x + 4) = 3x + 12"
    solution: "Infinitely many solutions"
    explanation: "Distribute first: 3x + 12 = 3x + 12. Both sides are identical."
  - prompt: "Classify: 4(x + 2) = 4x + 11"
    solution: "No solution"
    explanation: "Distribute first: 4x + 8 = 4x + 11. This reduces to 8 = 11, which is false."
  - prompt: "Classify: 2(x + 5) = 6x - 2"
    solution: "One solution"
    explanation: "Distribute first: 2x + 10 = 6x - 2. One variable term remains after moving x-terms."
applications:
  - title: "Checking equations"
    description: "Classification helps learners know whether solving should end in a value, a contradiction, or an identity."
  - title: "Systems of equations"
    description: "No solution and infinitely many solutions also describe special cases in systems of equations."
  - title: "Modeling"
    description: "Classifying equations can reveal whether a word problem has one answer, no possible answer, or many possible answers."
  - title: "Equivalent expressions"
    description: "If both sides of an equation are equivalent expressions, the equation is true for every value of the variable."
