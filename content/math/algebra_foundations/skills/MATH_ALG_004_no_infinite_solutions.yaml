      prompt_template: "Classify the equation: {a}x + {b} = {a}x + {b}"
      answer_mode: final_plus_required_work
      variables:
        a:
          type: int
          min: 2
          max: 12
        b:
          type: int
          min: 2
          max: 30
      options:
        - id: A
          label: "One solution"
        - id: B
          label: "No solution"
        - id: C
          label: "Infinitely many solutions"
      answer:
        type: multiple_choice
        value: "C"
      grading:
        method: multiple_choice
      work:
        mode: procedural_steps
        prompt: "Show equivalent equation steps until the equation reduces to a true statement, false statement, or x = value."
        line_type: equation
        minimum_steps: 2
        require_final_answer_match: false
      review_policy:
        work_review: auto
        mastery_requires_review_pass: false
      explanation_template: |
        Both sides are exactly the same.
        Subtract {a}x from both sides: {b} = {b}.
        This is always true, so the equation has infinitely many solutions.
      mistake_tags:
        - equation_classification
        - infinite_solutions
        - variables_cancel
      difficulty: easy

