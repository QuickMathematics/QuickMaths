id: MATH_PREALG_002
schema_version: 0.2
name: Combining like terms
domain: Math
subdomain: Pre-Algebra
description: Simplify expressions by combining terms that have the same variable part.
prerequisites:
  - MATH_PREALG_001
tags:
  - pre_algebra
  - expressions
  - like_terms
  - simplifying_expressions
  - coefficients
  - zero_pairs
  - powers
unlocks:
  - MATH_PREALG_003
  - MATH_ALG_001
mastery:
  passing_score: 0.8
  minimum_confidence: 3
  review_after_days_if_mastered: 7
  review_after_days_if_learning: 2
theory: |
  Like terms have the same variable part. You can combine them by adding or subtracting their coefficients.

  This matters because simplifying expressions makes algebra easier. Before solving equations or graphing lines, you often need to clean up expressions by collecting like terms.

  Method:
  1. Identify terms with the same variable part.
  2. Add or subtract their coefficients.
  3. Keep the variable part unchanged.
  4. Do not combine unlike terms.
  5. If like terms cancel out, the result may be 0.
  6. If the coefficient becomes 1, write x instead of 1x.
  7. If the coefficient becomes -1, write -x instead of -1x.

  Example:
  4x + 7x - 3 = 11x - 3.

  The x-terms combine because they both have x. The constant -3 stays separate.

  Cancellation example:
  5x - 5x + 8 = 8.

  The x-terms cancel because 5x - 5x = 0.

  Coefficient of 1 example:
  6x - 5x = x.

  Coefficient of -1 example:
  4x - 5x = -x.

  Powers:
  x and x^2 are not like terms. The exponent is part of the variable part.

  Example:
  3x^2 + 5x cannot be combined.

  Common mistake:
  Do not combine unlike terms. In 5x + 2, the terms are not alike, so the expression is already simplified.

  Another common mistake:
  Do not combine x and x^2. They are different kinds of terms.
examples:
  - prompt: "Simplify: 6x + 4x"
    solution: "10x"
    explanation: "Both terms are x-terms, so add the coefficients: 6 + 4 = 10."
  - prompt: "Simplify: 8x - 3 + 2x + 5"
    solution: "10x + 2"
    explanation: "Combine x-terms: 8x + 2x = 10x. Combine constants: -3 + 5 = 2."
  - prompt: "Simplify: 5x - 5x + 8"
    solution: "8"
    explanation: "The x-terms cancel because 5x - 5x = 0."
  - prompt: "Simplify: 6x - 5x + 3"
    solution: "x + 3"
    explanation: "The x-coefficient is 1, so write x instead of 1x."
  - prompt: "Simplify: 4x - 5x + 7"
    solution: "-x + 7"
    explanation: "The x-coefficient is -1, so write -x instead of -1x."
  - prompt: "Simplify: 4a + 7b - 2a + 3b"
    solution: "2a + 10b"
    explanation: "Combine a-terms with a-terms and b-terms with b-terms."
  - prompt: "Simplify: 3x^2 + 5x + 4x^2"
    solution: "7x^2 + 5x"
    explanation: "x^2 terms combine with x^2 terms. The x-term is unlike them, so it stays separate."
  - prompt: "Simplify: 3x^2 + 5x"
    solution: "3x^2 + 5x"
    explanation: "x^2 and x are unlike terms, so the expression is already simplified."
applications:
  - title: "Solving equations"
    description: "Combining like terms cleans up each side of an equation before using inverse operations."
  - title: "Geometry expressions"
    description: "Perimeter and area expressions often need like terms combined before they are useful."
  - title: "Linear functions"
    description: "Combining like terms helps rewrite expressions into standard linear forms."
  - title: "Checking algebra work"
    description: "Combining like terms helps reveal whether two expressions are actually equivalent."
test:
  question_count: 18
  randomize_order: true
  questions:
    - id: LIKE_TERMS_X_ONLY_001
      type: generated
      prompt_template: "Simplify: {a}x + {b}x"
      answer_mode: final_plus_required_work
      variables:
        a:
          type: int
          min: -12
          max: 12
          exclude: [0, 1, -1]
        b:
          type: int
          min: -12
          max: 12
          exclude: [0, 1, -1]
      derived:
        x_total: "a + b"
      constraints:
        - "x_total != 0"
        - "x_total != 1"
        - "x_total != -1"
      answer:
        type: expression
        value: "{x_total}x"
      grading:
        method: symbolic_expression
      work:
        mode: procedural_steps
        prompt: "Show each equivalent expression step, ending with the simplified final answer."
        line_type: expression
        minimum_steps: 2
        require_final_answer_match: true
      review_policy:
        work_review: auto
        mastery_requires_review_pass: false
      explanation_template: |
        Both terms are x-terms.
        Add the coefficients: {a} + {b} = {x_total}.
        The simplified expression is {x_total}x.
      mistake_tags:
        - coefficient_error
        - sign_error
        - like_terms_error
      difficulty: easy

