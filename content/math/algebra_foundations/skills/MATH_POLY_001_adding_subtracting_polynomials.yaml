id: MATH_POLY_001
schema_version: 0.2
name: Adding and subtracting polynomials
domain: Math
subdomain: Exponents and Polynomials
description: Identify polynomial structure and add or subtract polynomials by organizing and combining like terms.
prerequisites:
  - MATH_EXP_001
  - MATH_PREALG_003
tags:
  - algebra
  - polynomials
  - adding_polynomials
  - subtracting_polynomials
  - like_terms
  - degree
  - coefficients
  - simplifying_expressions
unlocks:
  - MATH_POLY_002
mastery:
  passing_score: 0.8
  minimum_confidence: 3
  review_after_days_if_mastered: 7
  review_after_days_if_learning: 2
theory: |
  A polynomial is an expression made from terms with whole-number exponents.

  Examples:
  4x^3 - 2x + 7
  x^2 + 5x - 9
  6

  Each term has a coefficient and a variable part. In -3x^2, the coefficient is -3 and the variable part is x^2.

  The degree of a term is its exponent. The degree of a polynomial is the greatest exponent with a nonzero coefficient.

  Like terms have exactly the same variable part:
  - 4x^2 and -7x^2 are like terms.
  - 3x and 8x are like terms.
  - x^2 and x are not like terms.

  Adding polynomials:
  Remove the grouping symbols, then combine like terms.

  (3x^2 + 5x - 2) + (4x^2 - x + 7)
  = 3x^2 + 4x^2 + 5x - x - 2 + 7
  = 7x^2 + 4x + 5

  Subtracting polynomials:
  Distribute a negative sign to every term in the polynomial being subtracted.

  (6x^2 + 3x - 4) - (2x^2 - 5x + 1)
  = 6x^2 + 3x - 4 - 2x^2 + 5x - 1
  = 4x^2 + 8x - 5

  Method:
  1. Identify the terms and their exponents.
  2. When subtracting, change the sign of every term in the second polynomial.
  3. Group terms with matching variable parts.
  4. Add or subtract their coefficients.
  5. Write the result in descending powers when practical.
  6. Check that no unlike terms were combined.

  Missing terms:
  A missing power has coefficient 0. For example, x^3 + 4x - 2 has no x^2 term.

  Cancellation:
  The highest-degree terms may cancel, causing the result to have a lower degree.

  Common mistake:
  When subtracting, do not change only the first sign. The negative applies to every term in the second polynomial.

  Another common mistake:
  Do not combine x^2 terms with x terms. The exponents must match.

  Another common mistake:
  Adding polynomials does not add exponents. Add coefficients of like terms and keep the exponent unchanged.
examples:
  - prompt: "Add: (3x^2 + 4x) + (5x^2 - 2x)"
    solution: "8x^2 + 2x"
    explanation: "Combine x^2 terms and x terms separately."
  - prompt: "Add: (2x^3 + 5x - 1) + (4x^2 - 3x + 7)"
    solution: "2x^3 + 4x^2 + 2x + 6"
    explanation: "Align like powers, treating missing powers as coefficients of 0."
  - prompt: "Subtract: (7x^2 + 3x + 5) - (2x^2 + x - 4)"
    solution: "5x^2 + 2x + 9"
    explanation: "Distribute the subtraction across the second polynomial, then combine like terms."
  - prompt: "Subtract: (4x^2 - 6x + 2) - (-3x^2 + 5x - 8)"
    solution: "7x^2 - 11x + 10"
    explanation: "Subtracting the second polynomial changes all three of its signs."
  - prompt: "Simplify: (5x^2 + 2x - 1) + (-5x^2 + 7x + 4)"
    solution: "9x + 3"
    explanation: "The x^2 terms cancel, so the result has degree 1."
  - prompt: "What is the degree of 8x^4 - 3x^2 + 6?"
    solution: "4"
    explanation: "The greatest exponent with a nonzero coefficient is 4."
  - prompt: "What is the coefficient of x^2 in -5x^3 + 7x^2 - x + 9?"
    solution: "7"
    explanation: "The x^2 term is 7x^2, so its coefficient is 7."
  - prompt: "A rectangle has length 3x + 4 and width 2x - 1. Find its perimeter."
    solution: "10x + 6"
    explanation: "Perimeter is 2L + 2W. Add the four side expressions and combine like terms."
applications:
  - title: "Polynomial multiplication"
    description: "Products of polynomials create several terms that must be combined correctly."
  - title: "Geometry"
    description: "Perimeter and combined-area expressions often require polynomial addition."
  - title: "Data models"
    description: "Adding model components combines their effects into one expression."
  - title: "Calculus preparation"
    description: "Polynomial structure and degree become central in later algebra and calculus."
test:
  question_count: 10
  randomize_order: true
  questions:
    - id: POLY_IDENTIFY_DEGREE_001
      type: generated
      prompt_template: "What is the degree of {a}x^4 + {b}x^2 + {c}x + {d}?"
      answer_mode: final_only
      variables:
        a:
          type: int
          min: -9
          max: 9
          exclude: [0]
        b:
          type: int
          min: -9
          max: 9
          exclude: [0]
        c:
          type: int
          min: -9
          max: 9
          exclude: [0]
        d:
          type: int
          min: -12
          max: 12
          exclude: [0]
      answer:
        type: numeric
        value: "4"
      grading:
        method: exact_numeric
      work:
        mode: none
      review_policy:
        work_review: none
        mastery_requires_review_pass: false
      explanation_template: |
        The highest power with a nonzero coefficient is x^4.
        Therefore the polynomial has degree 4.
      mistake_tags:
        - degree_error
        - exponent_error
        - coefficient_error
      difficulty: easy

    - id: POLY_IDENTIFY_COEFFICIENT_001
      type: generated
      prompt_template: "What is the coefficient of x^2 in {a}x^3 + {b}x^2 + {c}x + {d}?"
      answer_mode: final_only
      variables:
        a:
          type: int
          min: -9
          max: 9
          exclude: [0]
        b:
          type: int
          min: -12
          max: 12
          exclude: [0]
        c:
          type: int
          min: -9
          max: 9
          exclude: [0]
        d:
          type: int
          min: -12
          max: 12
          exclude: [0]
      answer:
        type: numeric
        value: "{b}"
      grading:
        method: exact_numeric
      work:
        mode: none
      review_policy:
        work_review: none
        mastery_requires_review_pass: false
      explanation_template: |
        The x^2 term is {b}x^2.
        Its coefficient is {b}.
      mistake_tags:
        - coefficient_error
        - exponent_error
        - term_identification
      difficulty: easy

    - id: POLY_ADD_TRINOMIALS_001
      type: generated
      prompt_template: "Add and simplify: ({a}x^2 + {b}x + {c}) + ({d}x^2 + {e}x + {f})"
      answer_mode: final_plus_required_work
      max_attempts: 250
      variables:
        a:
          type: int
          min: -8
          max: 8
          exclude: [0, 1, -1]
        b:
          type: int
          min: -10
          max: 10
          exclude: [0, 1, -1]
        c:
          type: int
          min: -15
          max: 15
          exclude: [0]
        d:
          type: int
          min: -8
          max: 8
          exclude: [0, 1, -1]
        e:
          type: int
          min: -10
          max: 10
          exclude: [0, 1, -1]
        f:
          type: int
          min: -15
          max: 15
          exclude: [0]
      derived:
        quadratic: "a + d"
        linear: "b + e"
        constant: "c + f"
      constraints:
        - "quadratic != 0"
        - "quadratic != 1"
        - "quadratic != -1"
        - "linear != 0"
        - "linear != 1"
        - "linear != -1"
        - "constant != 0"
      answer:
        type: expression
        value: "{quadratic}x^2 + {linear}x + {constant}"
      grading:
        method: symbolic_expression
      work:
        mode: procedural_steps
        prompt: "Group like powers and show equivalent expression steps."
        line_type: expression
        minimum_steps: 3
        require_final_answer_match: true
      review_policy:
        work_review: auto
        mastery_requires_review_pass: false
      explanation_template: |
        Combine x^2 terms: {a} + {d} = {quadratic}.
        Combine x terms: {b} + {e} = {linear}.
        Combine constants: {c} + {f} = {constant}.
        The sum is {quadratic}x^2 + {linear}x + {constant}.
      mistake_tags:
        - like_terms_error
        - coefficient_error
        - sign_error
        - polynomial_addition
      difficulty: easy

    - id: POLY_ADD_MISSING_POWERS_001
      type: generated
      prompt_template: "Add and simplify: ({a}x^3 + {b}x) + ({c}x^2 + {d})"
      answer_mode: final_plus_required_work
      variables:
        a:
          type: int
          min: 2
          max: 8
        b:
          type: int
          min: -9
          max: 9
          exclude: [0, 1, -1]
        c:
          type: int
          min: -8
          max: 8
          exclude: [0, 1, -1]
        d:
          type: int
          min: -15
          max: 15
          exclude: [0]
      answer:
        type: expression
        value: "{a}x^3 + {c}x^2 + {b}x + {d}"
      grading:
        method: symbolic_expression
      work:
        mode: procedural_steps
        prompt: "Align like powers and show the polynomial in descending powers."
        line_type: expression
        minimum_steps: 2
        require_final_answer_match: true
      review_policy:
        work_review: auto
        mastery_requires_review_pass: false
      explanation_template: |
        No powers match between the two polynomials.
        Keep every term and arrange them in descending powers.
        The sum is {a}x^3 + {c}x^2 + {b}x + {d}.
      mistake_tags:
        - missing_term_error
        - exponent_error
        - polynomial_addition
        - term_order_error
      difficulty: medium

    - id: POLY_SUBTRACT_TRINOMIALS_001
      type: generated
      prompt_template: "Subtract and simplify: ({a}x^2 + {b}x + {c}) - ({d}x^2 + {e}x + {f})"
      answer_mode: final_plus_required_work
      max_attempts: 300
      variables:
        a:
          type: int
          min: 3
          max: 10
        b:
          type: int
          min: 3
          max: 12
        c:
          type: int
          min: 3
          max: 15
        d:
          type: int
          min: 2
          max: 9
        e:
          type: int
          min: 2
          max: 11
        f:
          type: int
          min: 2
          max: 14
      derived:
        quadratic: "a - d"
        linear: "b - e"
        constant: "c - f"
      constraints:
        - "quadratic != 0"
        - "quadratic != 1"
        - "quadratic != -1"
        - "linear != 0"
        - "linear != 1"
        - "linear != -1"
        - "constant != 0"
      answer:
        type: expression
        value: "{quadratic}x^2 + {linear}x + {constant}"
      grading:
        method: symbolic_expression
      work:
        mode: procedural_steps
        prompt: "Distribute the subtraction to every term, then combine like powers."
        line_type: expression
        minimum_steps: 3
        require_final_answer_match: true
      review_policy:
        work_review: auto
        mastery_requires_review_pass: false
      explanation_template: |
        Change every sign in the second polynomial.
        x^2 coefficient: {a} - {d} = {quadratic}.
        x coefficient: {b} - {e} = {linear}.
        Constant: {c} - {f} = {constant}.
        The difference is {quadratic}x^2 + {linear}x + {constant}.
      mistake_tags:
        - subtraction_distribution_error
        - like_terms_error
        - sign_error
        - polynomial_subtraction
      difficulty: medium

    - id: POLY_SUBTRACT_NEGATIVE_TERMS_001
      type: generated
      prompt_template: "Subtract and simplify: ({a}x^2 - {b}x + {c}) - (-{d}x^2 + {e}x - {f})"
      answer_mode: final_plus_required_work
      variables:
        a:
          type: int
          min: 2
          max: 9
        b:
          type: int
          min: 2
          max: 10
        c:
          type: int
          min: 2
          max: 15
        d:
          type: int
          min: 2
          max: 9
        e:
          type: int
          min: 2
          max: 10
        f:
          type: int
          min: 2
          max: 15
      derived:
        quadratic: "a + d"
        linear: "0 - b - e"
        constant: "c + f"
      answer:
        type: expression
        value: "{quadratic}x^2 + {linear}x + {constant}"
      grading:
        method: symbolic_expression
      work:
        mode: procedural_steps
        prompt: "Distribute the subtraction to all three terms, then combine like powers."
        line_type: expression
        minimum_steps: 3
        require_final_answer_match: true
      review_policy:
        work_review: auto
        mastery_requires_review_pass: false
      explanation_template: |
        Subtracting -{d}x^2 produces +{d}x^2.
        Subtracting +{e}x produces -{e}x.
        Subtracting -{f} produces +{f}.
        The result is {quadratic}x^2 + {linear}x + {constant}.
      mistake_tags:
        - subtraction_distribution_error
        - double_negative_error
        - sign_error
        - polynomial_subtraction
      difficulty: hard

    - id: POLY_LEADING_TERMS_CANCEL_001
      type: generated
      prompt_template: "Add and simplify: ({a}x^2 + {b}x + {c}) + ({negative_a}x^2 + {d}x + {e})"
      answer_mode: final_plus_required_work
      max_attempts: 200
      variables:
        a:
          type: int
          min: 2
          max: 9
        b:
          type: int
          min: -10
          max: 10
          exclude: [0]
        c:
          type: int
          min: -15
          max: 15
          exclude: [0]
        d:
          type: int
          min: -10
          max: 10
          exclude: [0]
        e:
          type: int
          min: -15
          max: 15
          exclude: [0]
      derived:
        negative_a: "0 - a"
        linear: "b + d"
        constant: "c + e"
      constraints:
        - "linear != 0"
        - "linear != 1"
        - "linear != -1"
        - "constant != 0"
      answer:
        type: expression
        value: "{linear}x + {constant}"
      grading:
        method: symbolic_expression
      work:
        mode: procedural_steps
        prompt: "Show the cancellation of the leading terms, then combine the remaining like terms."
        line_type: expression
        minimum_steps: 3
        require_final_answer_match: true
      review_policy:
        work_review: auto
        mastery_requires_review_pass: false
      explanation_template: |
        {a}x^2 and {negative_a}x^2 cancel.
        Combine x terms: {b} + {d} = {linear}.
        Combine constants: {c} + {e} = {constant}.
        The result is {linear}x + {constant}.
      mistake_tags:
        - cancellation_error
        - degree_error
        - like_terms_error
        - sign_error
      difficulty: medium

    - id: POLY_ADD_THREE_EXPRESSIONS_001
      type: generated
      prompt_template: "Add and simplify: ({a}x^2 + {b}x) + ({c}x^2 + {d}) + ({e}x + {f})"
      answer_mode: final_plus_required_work
      max_attempts: 250
      variables:
        a:
          type: int
          min: -7
          max: 7
          exclude: [0, 1, -1]
        b:
          type: int
          min: -9
          max: 9
          exclude: [0]
        c:
          type: int
          min: -7
          max: 7
          exclude: [0, 1, -1]
        d:
          type: int
          min: -12
          max: 12
          exclude: [0]
        e:
          type: int
          min: -9
          max: 9
          exclude: [0]
        f:
          type: int
          min: -12
          max: 12
          exclude: [0]
      derived:
        quadratic: "a + c"
        linear: "b + e"
        constant: "d + f"
      constraints:
        - "quadratic != 0"
        - "quadratic != 1"
        - "quadratic != -1"
        - "linear != 0"
        - "linear != 1"
        - "linear != -1"
        - "constant != 0"
      answer:
        type: expression
        value: "{quadratic}x^2 + {linear}x + {constant}"
      grading:
        method: symbolic_expression
      work:
        mode: procedural_steps
        prompt: "Collect like powers across all three polynomials and show equivalent steps."
        line_type: expression
        minimum_steps: 3
        require_final_answer_match: true
      review_policy:
        work_review: auto
        mastery_requires_review_pass: false
      explanation_template: |
        Combine x^2 coefficients: {a} + {c} = {quadratic}.
        Combine x coefficients: {b} + {e} = {linear}.
        Combine constants: {d} + {f} = {constant}.
        The sum is {quadratic}x^2 + {linear}x + {constant}.
      mistake_tags:
        - like_terms_error
        - coefficient_error
        - sign_error
        - polynomial_addition
      difficulty: hard

    - id: POLY_PERIMETER_APPLICATION_001
      type: generated
      prompt_template: "A rectangle has length {a}x + {b} and width {c}x + {d}. Write a simplified expression for its perimeter."
      answer_mode: final_plus_required_work
      variables:
        a:
          type: int
          min: 2
          max: 8
        b:
          type: int
          min: 2
          max: 15
        c:
          type: int
          min: 2
          max: 8
        d:
          type: int
          min: 2
          max: 15
      derived:
        linear: "2 * a + 2 * c"
        constant: "2 * b + 2 * d"
      answer:
        type: expression
        value: "{linear}x + {constant}"
      grading:
        method: symbolic_expression
      work:
        mode: procedural_steps
        prompt: "Use P = 2L + 2W, distribute, and combine like terms."
        line_type: expression
        minimum_steps: 3
        require_final_answer_match: true
      review_policy:
        work_review: auto
        mastery_requires_review_pass: false
      explanation_template: |
        Perimeter is 2L + 2W.
        Double the length and width expressions.
        Combine x terms to get {linear}x and constants to get {constant}.
        The perimeter is {linear}x + {constant}.
      mistake_tags:
        - polynomial_addition
        - distribution_error
        - perimeter_error
        - like_terms_error
      difficulty: medium

    - id: POLY_EVALUATE_SUM_001
      type: generated
      prompt_template: "Let P(x) = {a}x^2 + {b}x + {c} and Q(x) = {d}x^2 + {e}x + {f}. Find P({x_value}) + Q({x_value})."
      answer_mode: final_plus_required_work
      max_attempts: 250
      variables:
        a:
          type: int
          min: -5
          max: 5
          exclude: [0]
        b:
          type: int
          min: -7
          max: 7
          exclude: [0]
        c:
          type: int
          min: -10
          max: 10
          exclude: [0]
        d:
          type: int
          min: -5
          max: 5
          exclude: [0]
        e:
          type: int
          min: -7
          max: 7
          exclude: [0]
        f:
          type: int
          min: -10
          max: 10
          exclude: [0]
        x_value:
          type: int
          min: -4
          max: 4
          exclude: [0]
      derived:
        answer_value: "(a + d) * x_value ** 2 + (b + e) * x_value + c + f"
      constraints:
        - "answer_value != 0"
      answer:
        type: numeric
        value: "{answer_value}"
      grading:
        method: exact_numeric
      work:
        mode: procedural_steps
        prompt: "Add the polynomial values or combine the polynomials first, then evaluate."
        line_type: expression
        minimum_steps: 3
        require_final_answer_match: true
      review_policy:
        work_review: auto
        mastery_requires_review_pass: false
      explanation_template: |
        Combine the polynomial values at x = {x_value}.
        The x^2 coefficient is {a + d}, the x coefficient is {b + e}, and the constant is {c + f}.
        Evaluating gives {answer_value}.
      mistake_tags:
        - substitution_error
        - polynomial_addition
        - exponent_arithmetic
        - sign_error
      difficulty: hard
