id: MATH_STAT_007
schema_version: 0.2
name: Hypothesis tests, p-values, and power
domain: Math
subdomain: Statistics
topic: Statistical Significance
description: Form hypotheses, calculate test statistics/p-values, decisions, errors, power and practical significance.
prerequisites:
- MATH_STAT_006
tags:
- statistics
unlocks: []
mastery:
  passing_score: 0.8
  minimum_confidence: 3
  max_guessing_allowed: maybe
  review_after_days_if_mastered: 7
  review_after_days_if_learning: 2
theory: A significance test measures compatibility of data with a specified null model. Hypotheses concern population
  parameters. Test statistic=(estimate-null value)/(SE under H0). The p-value is the probability under H0/model of
  a statistic at least as extreme in the direction(s) of Ha; it is not P(H0). Choose alpha before analysis. Reject
  when p≤alpha; otherwise fail to reject. Type I error rejects a true H0; Type II misses a real alternative; power
  is probability of rejection under a specified alternative. Report effect size, interval, practical importance, design,
  and limitations.
examples:
  - prompt: 'A test has p-value 0.03 and significance level 0.05. State the decision and its meaning.'
    solution: 'With p-value 0.03 and alpha 0.05, reject H0; the evidence is statistically significant at the 5% level.'
    explanation: 'A p-value is the chance of results this extreme or more under H0, not the probability H0 is true.'
  - prompt: 'Explain how increasing sample size affects power when the effect is fixed.'
    solution: 'For an effect size 0.5 with SE 0.2, the standardized signal is 2.5; increasing n lowers SE and raises power.'
    explanation: 'Power is the probability of rejecting a false null under a specified alternative.'
applications:
  - title: 'Treatment claims'
    description: 'Hypothesis tests evaluate claims about treatments, process changes, or population parameters.'
  - title: 'Power analysis'
    description: 'Power analysis helps determine whether a study can detect a practically important effect.'
test:
  question_count: 13
  randomize_order: true
  questions:
  - id: TEST_NULL_ALTERNATIVE
    type: fixed
    prompt_template: Research asks whether μ>50. Hypotheses?
    answer_mode: final_only
    options:
    - id: A
      label: H0:μ=50; Ha:μ>50
    - id: B
      label: H0:μ>50;Ha:μ=50
    - id: C
      label: H0:xbar=50;Ha:xbar>50
    - id: D
      label: H0:μ<50;Ha:μ=50
    answer:
      type: multiple_choice
      value: A
    grading:
      method: multiple_choice
    work:
      mode: none
    review_policy:
      work_review: none
      mastery_requires_review_pass: false
      allow_self_review: true
    explanation_template: Null contains reference equality; alternative expresses claim.
    mistake_tags:
    - concept_error
    difficulty: medium
  - id: TEST_MEAN_Z_STATISTIC
    type: generated
    prompt_template: 'H0: μ={mu0}, sigma={sigma}, n={n}, x-bar={xbar}. Find z.'
    answer_mode: final_plus_required_work
    max_attempts: 300
    variables:
      mu0:
        type: int
        min: -20
        max: 100
      root:
        type: choice
        values:
        - 2
        - 3
        - 4
        - 5
        - 6
        - 8
        - 10
      k:
        type: int
        min: 1
        max: 6
      z:
        type: choice
        values:
        - -3
        - -2
        - -1
        - 1
        - 2
        - 3
    derived:
      n: root**2
      sigma: root*k
      se: k
      xbar: mu0+z*se
    answer:
      type: numeric
      value: '{z}'
    grading:
      method: exact_numeric
    work:
      mode: capture_only
      prompt: Show the formula, substitution, and result.
    review_policy:
      work_review: none
      mastery_requires_review_pass: false
      allow_self_review: true
    explanation_template: Use null SE.
    mistake_tags:
    - calculation_error
    difficulty: medium
  - id: TEST_PROPORTION_Z_STATISTIC
    type: generated
    prompt_template: Test H0:p=1/2. n={n}, successes={successes}. Find z.
    answer_mode: final_plus_required_work
    max_attempts: 300
    variables:
      root:
        type: choice
        values:
        - 10
        - 12
        - 16
        - 20
        - 24
        - 30
      z:
        type: choice
        values:
        - -3
        - -2
        - -1
        - 1
        - 2
        - 3
    derived:
      n: root**2
      successes: n/2+z*root/2
    answer:
      type: numeric
      value: '{z}'
    grading:
      method: exact_numeric
    work:
      mode: capture_only
      prompt: Show the formula, substitution, and result.
    review_policy:
      work_review: none
      mastery_requires_review_pass: false
      allow_self_review: true
    explanation_template: Under H0 SE=1/(2root).
    mistake_tags:
    - calculation_error
    difficulty: hard
  - id: TEST_P_VALUE_INTERPRETATION
    type: fixed
    prompt_template: Correct interpretation of p=.03?
    answer_mode: final_only
    options:
    - id: A
      label: If H0 true, results at least as extreme occur about3% of time under model
    - id: B
      label: 3% probability H0 true
    - id: C
      label: 3% sample errors
    - id: D
      label: Ha 97% likely
    answer:
      type: multiple_choice
      value: A
    grading:
      method: multiple_choice
    work:
      mode: none
    review_policy:
      work_review: none
      mastery_requires_review_pass: false
      allow_self_review: true
    explanation_template: p-value is conditional on H0/model.
    mistake_tags:
    - concept_error
    difficulty: medium
  - id: TEST_TAIL_DIRECTION
    type: fixed
    prompt_template: Ha:μ<μ0. Which outcomes count as extreme?
    answer_mode: final_only
    options:
    - id: A
      label: Far into left tail
    - id: B
      label: Right tail only
    - id: C
      label: Exactly zero
    - id: D
      label: Between sample mean and μ0
    answer:
      type: multiple_choice
      value: A
    grading:
      method: multiple_choice
    work:
      mode: none
    review_policy:
      work_review: none
      mastery_requires_review_pass: false
      allow_self_review: true
    explanation_template: Less-than alternative is left-tailed.
    mistake_tags:
    - concept_error
    difficulty: medium
  - id: TEST_TWO_SIDED_P_VALUE
    type: generated
    prompt_template: Symmetric two-sided z test has one-tail area {tail}/1000. Find p-value.
    answer_mode: final_plus_required_work
    max_attempts: 300
    variables:
      tail:
        type: choice
        values:
        - 5
        - 8
        - 12
        - 17
        - 23
        - 31
        - 42
    derived:
      double: 2*tail
    answer:
      type: numeric
      value: '{double}/1000'
    grading:
      method: exact_numeric
    work:
      mode: capture_only
      prompt: Show the formula, substitution, and result.
    review_policy:
      work_review: none
      mastery_requires_review_pass: false
      allow_self_review: true
    explanation_template: Double one-tail area.
    mistake_tags:
    - calculation_error
    difficulty: medium
  - id: TEST_REJECT_DECISION
    type: fixed
    prompt_template: p=.032, alpha=.05. Decision?
    answer_mode: final_only
    options:
    - id: A
      label: Reject H0
    - id: B
      label: Fail reject
    - id: C
      label: Accept H0 proven
    - id: D
      label: Increase alpha after data
    answer:
      type: multiple_choice
      value: A
    grading:
      method: multiple_choice
    work:
      mode: none
    review_policy:
      work_review: none
      mastery_requires_review_pass: false
      allow_self_review: true
    explanation_template: p<alpha.
    mistake_tags:
    - concept_error
    difficulty: medium
  - id: TEST_FAIL_TO_REJECT
    type: fixed
    prompt_template: p=.18, alpha=.05. Conclusion?
    answer_mode: final_only
    options:
    - id: A
      label: Fail to reject H0; insufficient evidence for Ha
    - id: B
      label: Accept H0 certainly
    - id: C
      label: Reject H0
    - id: D
      label: Null measured exactly
    answer:
      type: multiple_choice
      value: A
    grading:
      method: multiple_choice
    work:
      mode: none
    review_policy:
      work_review: none
      mastery_requires_review_pass: false
      allow_self_review: true
    explanation_template: Large p does not prove H0.
    mistake_tags:
    - concept_error
    difficulty: medium
  - id: TEST_TYPE_I_ERROR
    type: fixed
    prompt_template: H0 says treatment has no benefit. Type I error?
    answer_mode: final_only
    options:
    - id: A
      label: Conclude benefit when none exists
    - id: B
      label: Miss real benefit
    - id: C
      label: Use sample not census
    - id: D
      label: Compute mean correctly
    answer:
      type: multiple_choice
      value: A
    grading:
      method: multiple_choice
    work:
      mode: none
    review_policy:
      work_review: none
      mastery_requires_review_pass: false
      allow_self_review: true
    explanation_template: Type I is false positive.
    mistake_tags:
    - concept_error
    difficulty: medium
  - id: TEST_TYPE_II_ERROR
    type: fixed
    prompt_template: Same study. Type II error?
    answer_mode: final_only
    options:
    - id: A
      label: Fail to detect real benefit
    - id: B
      label: Claim benefit when none
    - id: C
      label: Choose alpha before data
    - id: D
      label: Report statistic
    answer:
      type: multiple_choice
      value: A
    grading:
      method: multiple_choice
    work:
      mode: none
    review_policy:
      work_review: none
      mastery_requires_review_pass: false
      allow_self_review: true
    explanation_template: Type II is false negative.
    mistake_tags:
    - concept_error
    difficulty: medium
  - id: TEST_POWER
    type: fixed
    prompt_template: Which usually increases power at fixed alpha?
    answer_mode: final_only
    options:
    - id: A
      label: Increase n and reduce noise
    - id: B
      label: Make true effect smaller
    - id: C
      label: Increase variability
    - id: D
      label: Choose alternative after p-value
    answer:
      type: multiple_choice
      value: A
    grading:
      method: multiple_choice
    work:
      mode: none
    review_policy:
      work_review: none
      mastery_requires_review_pass: false
      allow_self_review: true
    explanation_template: Larger samples/lower noise separate distributions.
    mistake_tags:
    - concept_error
    difficulty: medium
  - id: TEST_STATISTICAL_PRACTICAL_SIGNIFICANCE
    type: fixed
    prompt_template: Huge sample finds improvement .02 with p<.001. What still matters?
    answer_mode: final_only
    options:
    - id: A
      label: Whether .02 is practically important and design supports claim
    - id: B
      label: Nothing
    - id: C
      label: Convert p to P(H0)
    - id: D
      label: Everyone improved .02
    answer:
      type: multiple_choice
      value: A
    grading:
      method: multiple_choice
    work:
      mode: none
    review_policy:
      work_review: none
      mastery_requires_review_pass: false
      allow_self_review: true
    explanation_template: Significance is not effect size or practical value.
    mistake_tags:
    - concept_error
    difficulty: hard
  - id: TEST_CONFIDENCE_INTERVAL_DUALITY
    type: fixed
    prompt_template: Matching two-sided 95% CI excludes μ0. At alpha=.05?
    answer_mode: final_only
    options:
    - id: A
      label: Reject H0:μ=μ0
    - id: B
      label: Fail reject
    - id: C
      label: Null 95% false
    - id: D
      label: Every one-sided test same
    answer:
      type: multiple_choice
      value: A
    grading:
      method: multiple_choice
    work:
      mode: none
    review_policy:
      work_review: none
      mastery_requires_review_pass: false
      allow_self_review: true
    explanation_template: Matching interval/test decisions correspond.
    mistake_tags:
    - concept_error
    difficulty: hard
