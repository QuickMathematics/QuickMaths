id: MATH_ARITH_010
schema_version: '0.2'
name: Rounding, significant figures and bounds
domain: Math
subdomain: Arithmetic
topic: Arithmetic Foundations
description: Rounding replaces a value by a nearby value at a stated place. It is useful when a measurement,
  report, or decision does not need every recorded digit, but it changes the value. An exact value is spec
prerequisites:
- MATH_ARITH_009
unlocks: []
tags:
- arithmetic
- rounding
- significant_figures
- bounds
- measurement
mastery:
  passing_score: 0.8
  minimum_confidence: 3
  max_guessing_allowed: maybe
  review_after_days_if_mastered: 7
  review_after_days_if_learning: 2
theory: 'Rounding replaces a value by a nearby value at a stated place. It is useful when a measurement, report,
  or decision does not need every recorded digit, but it changes the value. An exact value is specified without
  approximation in the problem’s number system, such as 3/8 or exactly 0.375 kg. A measured value may be recorded
  as 12.4 cm because the instrument resolves tenths; it is a report of a quantity with limited precision, not
  a claim that all later digits are zero.


  To round to a place, keep the digits through that place and inspect the first discarded digit. If it is 0,
  1, 2, 3, or 4, keep the retained digit. If it is 5, 6, 7, 8, or 9, increase the retained digit by one. Discarded
  digits then become zeros in whole-number places or disappear after the decimal point. For 6,347 rounded to
  the nearest hundred, inspect the tens digit 4 and report 6,300. For 6,350, the tens digit is 5, so report
  6,400. State the place; “6,4” is not an adequate answer to a nearest-hundred question.


  Rounding can carry into a new place. Rounding 9.96 to the nearest tenth starts with retained digit 9 and
  a discarded hundredths digit 6. Increasing 9 tenths produces 10 tenths, which is 1 whole, so the answer is
  10.0. Keep a trailing zero when it communicates the requested place. A negative number is rounded by distance
  to the target multiples; if signed values arise, decide using the same nearest-value idea rather than treating
  a minus sign as a digit.


  Significant figures record meaningful digits in a measurement. Nonzero digits always count. Zeros between
  nonzero digits count, as in 1002 (four significant figures). Leading zeros only locate the decimal point
  and do not count, as in 0.00450 (three significant figures: 4, 5, and the final zero). Trailing zeros after
  a decimal point count, as in 2.300 (four significant figures). A whole number such as 1500 is ambiguous without
  notation; write 1.5×10^3 for two significant figures or 1.500×10^3 for four. Scientific notation makes the
  intended precision visible.


  For multiplication and division, a common reporting rule is to give the result to the fewest significant
  figures among the measured inputs. For addition and subtraction, compare decimal places instead: align the
  values and report to the least precise decimal place. These rules describe a sensible measurement report;
  they do not make the intermediate arithmetic less exact. Keep extra guard digits during calculation, then
  round once at the end. Exact counted numbers, defined constants, and specified conversions do not limit significant
  figures in the same way as measured inputs.


  Bounds make an approximation informative. If a value x rounds to 48.4 to the nearest tenth, then 48.35 ≤
  x < 48.45. The lower endpoint is included because 48.35 is exactly halfway and rounds up under the usual
  half-up convention; the upper endpoint is excluded because 48.45 would round to 48.5. For rounding to the
  nearest whole number n, the interval is [n−0.5,n+0.5). If a displayed value is truncated rather than rounded,
  its bounds differ: 48.4 truncated to one decimal means 48.4 ≤ x < 48.5.


  Use a symbol or inequality for uncertainty instead of inventing digits. A mass reported as 2.30 g to the
  nearest hundredth lies from 2.295 g up to but not including 2.305 g. A calculation using bounds can estimate
  a range for an area or cost, but the result’s precision should not imply more knowledge than the inputs provide.
  Do not confuse accuracy (closeness to a true value) with precision (repeatable detail or resolution); rounding
  changes the reported precision, while calibration affects accuracy.


  Before rounding, identify the target place or number of significant figures. Mark the last kept digit, inspect
  the next digit, and perform any carry. Afterward, check that the notation still communicates the requested
  precision and that the result is close to the original. The capstone asks you to give a rounded measurement
  and its half-open bounds, and to explain why the upper endpoint is excluded.

  Rounding is a communication decision as well as a calculation. A bus timetable may round a duration to the
  nearest minute, while a laboratory report may retain hundredths because the instrument supports them. The
  same underlying value can therefore have several honest displays, provided each display states its place
  or significant-figure rule. When comparing rounded values, remember that two displays can overlap in their
  possible true intervals; a visible difference does not always prove the underlying values differ.


  A bound is an interval statement, so endpoint symbols carry information. For nearest-tenth half-up rounding,
  the lower midpoint belongs to the displayed bin and the upper midpoint belongs to the next bin. If a problem
  uses a different tie rule, such as ties-to-even, state that rule before changing the endpoint. Bounds are
  also useful in later calculations: adding lower bounds gives a lower bound for a sum when all quantities
  are nonnegative, while multiplying bounds requires attention to signs. Keep the simple one-value interval
  separate from those later interval operations.

  '
examples:
- prompt: Round 6,347 to the nearest hundred.
  solution: 6,300
  explanation: The tens digit is 4, so keep the hundreds digit and replace later places by zero.
- prompt: Round 6,350 to the nearest hundred.
  solution: 6,400
  explanation: The tens digit is 5, so increase the hundreds digit.
- prompt: Round 9.96 to the nearest tenth.
  solution: '10.0'
  explanation: The hundredths digit 6 raises 9 tenths to 10 tenths, which is 10.0.
- prompt: How many significant figures are in 0.00450?
  solution: '3'
  explanation: Leading zeros do not count; 4, 5, and the trailing decimal zero do.
- prompt: Write 1500 to two significant figures in scientific notation.
  solution: 1.5×10^3
  explanation: Scientific notation makes the two meaningful digits explicit.
- prompt: Round 12.347 to three decimal places.
  solution: '12.347'
  explanation: The requested place is already the thousandths place.
- prompt: Round 12.347 to two decimal places.
  solution: '12.35'
  explanation: The third decimal digit is 7, so the hundredths digit increases.
- prompt: Give bounds for a value rounding to 8.2 to the nearest tenth.
  solution: 8.15 ≤ x < 8.25
  explanation: Half a tenth on either side gives the interval; the upper endpoint would round to 8.3.
- prompt: 'Which is exact: 12 counted chairs or 12.0 cm measured length?'
  solution: 12 counted chairs
  explanation: Counting can give an exact whole number; the measurement has instrument precision.
- prompt: Round 0.00996 to two significant figures.
  solution: '0.010'
  explanation: The significant digits are 9 and 9; carrying produces 1.0×10^-2, written 0.010 to show two figures.
applications:
- title: Instrument readings
  description: A ruler, scale, or sensor determines a resolution, so rounded reports need a place and meaningful
    bounds.
- title: Budgets and estimates
  description: A rounded cost can support a quick decision while bounds show how much the true total could
    differ.
- title: Science reporting
  description: Significant figures prevent a calculation from claiming more precision than the measured inputs
    support.
- title: Public data displays
  description: Tables and dashboards use rounding to stay readable, but exact source values and rounding rules
    should remain recoverable.
