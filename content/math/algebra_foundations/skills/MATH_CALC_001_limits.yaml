  caption: The left and right limiting values disagree.
  width: 800
  height: 500
  fit: contain
examples:
- prompt: Find lim as x -> -2 of 3x^2 + 1.
  solution: '13'
  explanation: 'A polynomial has the substitution limit: 3(-2)^2 + 1 = 13.'
- prompt: Find lim as x -> 1 of (x+2)/(x+4).
  solution: 3/5
  explanation: The denominator limit is 5, not zero, so the quotient law applies.
- prompt: Find lim as x -> 3 of (x^2 - 9)/(x - 3).
  solution: '6'
  explanation: Direct substitution is indeterminate. For x != 3, factor and cancel to obtain x+3, whose
    limit is 6.
- prompt: The function equals x+1 except that f(1)=5. Compare f(1) with the limit at 1.
  solution: f(1)=5, but the limit is 2.
  explanation: Nearby values follow the line toward the open-circle height. The separate filled point
    does not alter that approach.
  media:
  - *id001
- prompt: Compare the sides of x+1 for x<0 and x+3 for x>=0 at zero.
  solution: 'Left limit: 1. Right limit: 3. Two-sided limit: DNE.'
  explanation: The condition selects each nearby branch. Unequal one-sided values cannot be combined by
    averaging.
  media:
  - *id002
- prompt: Find lim as x -> 4 of [sqrt(x)-2]/(x-4).
  solution: 1/4
  explanation: Multiply by the conjugate. Away from 4 the expression equals 1/[sqrt(x)+2], and its denominator
    approaches 4.
- prompt: Find lim as h -> 0 of [(2+h)^2 - 4]/h.
  solution: '4'
  explanation: For h != 0 the quotient equals 4+h. Taking its limit is not the same as assigning a value
    to the original quotient at h=0.
- prompt: Describe 1/x near zero from both sides.
  solution: 'Left: -inf. Right: +inf. Two-sided: DNE.'
  explanation: The denominator has opposite signs on the two sides. Unbounded magnitude alone does not
    determine a common signed limit.
  media:
  - src: media/native-calculus-bridge/limit-reciprocal.svg
    alt: The graph y = 1/x is negative for x < 0 and positive for x > 0. It decreases without bound as
      x approaches 0 from the left and increases without bound from the right.
    caption: Opposite one-sided infinite behavior does not give a common two-sided limit.
    width: 800
    height: 500
    fit: contain
- prompt: Describe 1/x^2 near zero.
  solution: +inf from both sides; no finite real limit.
  explanation: The squared denominator is positive and shrinks toward zero on either side. The output
    is never an actual real number called infinity.
- prompt: A finite table approaches height 2 from the left. Does it prove a two-sided limit of 2?
  solution: No. It suggests a conjecture, not a complete proof.
  explanation: Finitely many samples do not control every sufficiently close input, and the table gives
    no right-side information.
applications:
- title: Instantaneous change
  description: A difference quotient describes a secant rate; its limit can describe a local rate without
    dividing by zero.
- title: Removable model defects
  description: A formula can fail at one input while nearby outputs still determine a useful continuous
    extension.
- title: Numerical computation
  description: Tables and plots provide evidence, but finite resolution cannot replace a mathematical
    guarantee about all nearby inputs.
- title: Threshold behavior
  description: One-sided limits reveal whether a rule change is a harmless join or a genuine jump.
