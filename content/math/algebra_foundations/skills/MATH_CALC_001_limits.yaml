    constraints: []
    answer:
      type: numeric
      value: '{ans}'
    grading:
      method: exact_numeric
    explanation_template: |-
      Polynomial limits are found by substitution.
      {p}*({a})^2 + ({b}) = {ans}.
    solution_steps: []
