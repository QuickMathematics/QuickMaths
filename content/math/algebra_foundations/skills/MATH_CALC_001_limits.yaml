  - id: BRIDGE_LIM_PROOF
    type: fixed
    prompt_template: Define f(x) = (x^2 - 9)/(x - 3) for x != 3 and f(3) = 100. Give its limit at 3 and
      justify why the assigned value 100 does not control that limit.
    variables: {}
