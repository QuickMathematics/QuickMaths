  - id: FUNC_INV_QUADRATIC_RIGHT_001
    type: generated
    prompt_template: Let f(x) = (x - {h})^2 + {k}, restricted to x >= {h}. Give a formula for f^(-1)(x),
      writing only the expression.
    difficulty: hard
    answer_mode: final_plus_optional_work
    variables:
