  randomize_order: true
  questions:
  - id: FUNC_INV_TABLE_001
    type: fixed
    prompt_template: A one-to-one function has the complete table f(2) = 7, f(5) = 11, f(8) = 16. Find
      f^(-1)(11). Enter a number.
    difficulty: easy
    answer_mode: final_only
    variables: {}
    derived: {}
    constraints: []
    answer:
      type: numeric
      value: '5'
    grading:
      method: exact_numeric
    work:
      mode: none
    review_policy:
      work_review: none
      mastery_requires_review_pass: false
      allow_self_review: true
    explanation_template: |-
      The inverse asks which original input produced 11.
      The table gives f(5) = 11, so f^(-1)(11) = 5.
    mistake_tags:
    - inverse_input_output_swap
  - id: FUNC_INV_NOT_RECIPROCAL_001
    type: fixed
    prompt_template: For an invertible function f, what does f^(-1)(x) mean?
    difficulty: easy
    answer_mode: final_only
    variables: {}
    derived: {}
    constraints: []
    answer:
      type: choice
      value: B
    grading:
      method: multiple_choice
    work:
      mode: none
    review_policy:
      work_review: none
      mastery_requires_review_pass: false
      allow_self_review: true
    explanation_template: An inverse undoes the input-output rule. The notation f^(-1) is not the reciprocal
      1/f.
    mistake_tags:
    - inverse_reciprocal_confusion
    options:
    - id: A
      label: The square of f(x)
    - id: B
      label: The input that f sends to x
    - id: C
      label: The number 1/f(x)
    - id: D
      label: The negative of f(x)
  - id: FUNC_INV_AFFINE_FORMULA_001
    type: generated
    prompt_template: Let f(x) = {a}x + {b} on R. Give a formula for f^(-1)(x), writing only the expression.
    difficulty: medium
    answer_mode: final_plus_optional_work
    variables:
      a:
        type: int
        min: 2
        max: 7
      b:
        type: int
        min: -6
        max: 6
    derived: {}
    constraints: []
    answer:
      type: expression
      value: (x - {b})/{a}
      variable: x
    grading:
      method: symbolic_expression
    work:
      mode: capture_only
      prompt: 'Optional: record the restrictions, substitution, or reasoning that supports your answer.'
    review_policy:
      work_review: optional
      mastery_requires_review_pass: false
      allow_self_review: true
    explanation_template: |-
      Write y = {a}x + {b}.
      Solve for the original input: x = (y - {b})/{a}.
      Rename the inverse input x to get (x - {b})/{a}. Both domains are R.
    mistake_tags:
    - inverse_operation_order
  - id: FUNC_INV_AFFINE_VALUE_001
    type: generated
    prompt_template: Let f(x) = {a}x + {b} on R. Find f^(-1)({target}). Enter a number.
    difficulty: medium
    answer_mode: final_plus_required_work
    variables:
      a:
        type: choice
        values:
        - -5
        - -3
        - -2
        - 2
        - 3
        - 5
      b:
        type: int
        min: -6
        max: 6
      r:
        type: int
        min: -8
        max: 8
    derived:
      target: a*r+b
    constraints: []
    answer:
      type: numeric
      value: '{r}'
    grading:
      method: exact_numeric
    work:
      mode: procedural_steps
      prompt: Write one equivalent expression per line. Substitute the given values before simplifying;
        do not include f(...) notation in the work lines.
      line_type: expression
      minimum_steps: 2
      require_final_answer_match: true
    review_policy:
      work_review: auto
      mastery_requires_review_pass: false
      allow_self_review: true
    explanation_template: |-
      Find the original input whose output is {target}.
      Undo the addition, then the multiplication: ({target} - {b})/{a} = {r}.
      Check that f({r}) = {target}.
    mistake_tags:
    - inverse_evaluation
  - id: FUNC_INV_DECREASING_AFFINE_001
    type: generated
    prompt_template: Let f(x) = -{a}x + {b} on R. Give a formula for f^(-1)(x), writing only the expression.
    difficulty: medium
    answer_mode: final_only
    variables:
      a:
        type: int
        min: 2
        max: 6
      b:
        type: int
        min: -6
        max: 6
    derived: {}
    constraints: []
    answer:
      type: expression
      value: ({b} - x)/{a}
      variable: x
    grading:
      method: symbolic_expression
    work:
      mode: none
    review_policy:
      work_review: none
      mastery_requires_review_pass: false
      allow_self_review: true
    explanation_template: |-
      From y = -{a}x + {b}, obtain {a}x = {b} - y.
      Divide by {a}, then rename the inverse input x.
      The inverse is ({b} - x)/{a}; a negative slope does not prevent invertibility.
    mistake_tags:
    - inverse_negative_slope
    - inverse_operation_order
  - id: FUNC_INV_VERIFY_BOTH_001
    type: fixed
    prompt_template: Let f(x) = 3x - 4 and g(x) = (x + 4)/3 on R. Which check establishes that g is the
      inverse of f?
    difficulty: medium
    answer_mode: final_only
    variables: {}
    derived: {}
    constraints: []
    answer:
      type: choice
      value: A
    grading:
      method: multiple_choice
    work:
      mode: none
    review_policy:
      work_review: none
      mastery_requires_review_pass: false
      allow_self_review: true
    explanation_template: Substitute to get 3((x + 4)/3) - 4 = x and ((3x - 4) + 4)/3 = x. Both compositions
      are defined on R.
    mistake_tags:
    - inverse_verification
    - composition_identity
    options:
    - id: A
      label: Both f(g(x)) = x and g(f(x)) = x for every real x
    - id: B
      label: f(x) + g(x) = x at one input
    - id: C
      label: f(x)g(x) = 1 for every real x
    - id: D
      label: The graphs intersect at least once
  - id: FUNC_INV_WRONG_SIGN_001
    type: fixed
    prompt_template: A learner claims that the inverse of f(x) = 3x - 4 is g(x) = (x - 4)/3. Which response
      identifies the error?
    difficulty: medium
    answer_mode: final_only
    variables: {}
    derived: {}
    constraints: []
    answer:
      type: choice
      value: A
    grading:
      method: multiple_choice
    work:
      mode: none
    review_policy:
      work_review: none
      mastery_requires_review_pass: false
      allow_self_review: true
    explanation_template: The proposed formula gives f(g(x)) = x - 8, not x. The correct inverse is (x
      + 4)/3.
    mistake_tags:
    - inverse_operation_order
    - inverse_verification
    options:
    - id: A
      label: Undoing subtraction of 4 requires adding 4 before dividing by 3
    - id: B
      label: The claim is correct because both formulas contain 3 and 4
    - id: C
      label: The inverse should be 1/(3x - 4)
    - id: D
      label: No nonconstant linear function can have an inverse
  - id: FUNC_INV_RECIPROCAL_FORMULA_001
    type: generated
    prompt_template: Let f(x) = {a}/(x - {h}) + {k} on its natural real domain. Give a formula for f^(-1)(x),
      writing only the expression.
    difficulty: hard
    answer_mode: final_plus_optional_work
    variables:
      a:
        type: choice
        values:
        - -4
        - -2
        - 2
        - 4
      h:
        type: int
        min: -6
        max: 6
      k:
        type: int
        min: -6
        max: 6
    derived: {}
    constraints: []
    answer:
      type: expression
      value: '{h} + {a}/(x - {k})'
      variable: x
    grading:
      method: symbolic_expression
    work:
      mode: capture_only
      prompt: 'Optional: record the restrictions, substitution, or reasoning that supports your answer.'
    review_policy:
      work_review: optional
      mastery_requires_review_pass: false
      allow_self_review: true
    explanation_template: |-
      Start from y - {k} = {a}/(x - {h}).
      Because {a} is nonzero, solve x - {h} = {a}/(y - {k}).
      The inverse formula is {h} + {a}/(x - {k}); its input cannot equal {k}.
    mistake_tags:
    - rational_inverse
    - inverse_operation_order
  - id: FUNC_INV_RECIPROCAL_DOMAIN_001
    type: generated
    prompt_template: Let f(x) = {a}/(x - {h}) + {k} on its natural real domain. Find the domain of f^(-1)
      in interval notation.
    difficulty: medium
    answer_mode: final_only
    variables:
      a:
        type: int
        min: 1
        max: 6
      h:
        type: int
        min: -6
        max: 6
      k:
        type: int
        min: -6
        max: 6
    derived: {}
    constraints: []
    answer:
      type: interval_set
      value: (-inf, {k}) U ({k}, inf)
      variable: x
    grading:
      method: interval_set
    work:
      mode: none
    review_policy:
      work_review: none
      mastery_requires_review_pass: false
      allow_self_review: true
    explanation_template: |-
      The reciprocal term is never zero, so the original output is never {k}.
      Every other real output is attained by x = {h} + {a}/(y - {k}).
      The inverse domain is the original range: R excluding {k}.
    mistake_tags:
    - inverse_domain_range_swap
    - unattainable_output
  - id: FUNC_INV_RECIPROCAL_RANGE_001
    type: generated
    prompt_template: Let f(x) = {a}/(x - {h}) + {k} on its natural real domain. Find the range of f^(-1)
