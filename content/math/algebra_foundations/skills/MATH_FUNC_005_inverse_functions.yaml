examples:
- prompt: Let f(x) = 2x + 1 on R. Find and check its inverse.
  solution: f^(-1)(x) = (x - 1)/2 on R.
  explanation: From y = 2x + 1, solve x = (y - 1)/2. Both 2((x - 1)/2) + 1 and ((2x + 1) - 1)/2 simplify
    to x.
  media:
  - src: media/native-functions/inverse-linear.svg
    alt: The lines y = 2x + 1 and y = (x - 1)/2 are reflections in y = x. The points (1, 3) and (3, 1)
      correspond.
    caption: An inverse swaps an allowed input and its output; it does not take the reciprocal of the
      output.
    width: 800
    height: 500
    fit: contain
- prompt: A one-to-one function has f(5) = 12. What is f^(-1)(12)?
  solution: '5'
  explanation: The inverse returns the input that produced 12. It does not return 1/12 and does not evaluate
    the original f at 12.
- prompt: Find the inverse of f(x) = -3x + 6 on R.
  solution: f^(-1)(x) = (6 - x)/3.
  explanation: From y = -3x + 6, obtain 3x = 6 - y. A strictly decreasing line with a nonzero slope is
    one-to-one.
- prompt: Does f(x) = x^2 on R have an inverse function?
  solution: No. It must be restricted before it can have an inverse function.
  explanation: The inputs -2 and 2 both produce 4. The horizontal line y = 4 meets the graph twice, although
    the graph still passes the vertical line test.
  media:
  - src: media/native-functions/inverse-horizontal-test.svg
    alt: The full parabola y = x^2 meets the horizontal line y = 4 at both (-2, 4) and (2, 4).
    caption: Two different inputs share an output, so this function cannot be reversed uniquely on all
      real inputs.
    width: 800
    height: 500
    fit: contain
- prompt: Let f(x) = (x - 1)^2 + 2 for x >= 1. Find its inverse, domain, and range.
  solution: f^(-1)(x) = 1 + sqrt(x - 2); domain [2, inf), range [1, inf).
  explanation: The restriction makes x - 1 nonnegative, selecting the positive root. The original endpoint
    (1, 2) becomes the inverse endpoint (2, 1).
  media:
  - src: media/native-functions/inverse-restricted-quadratic.svg
    alt: The right-hand branch y = (x - 1)^2 + 2, x >= 1, and its inverse y = 1 + sqrt(x - 2), x >= 2,
      are reflected in y = x. The points (3, 6) and (6, 3) correspond.
    caption: A domain restriction selects one branch and makes the inverse single-valued.
    width: 800
    height: 500
    fit: contain
- prompt: Let f(x) = (x - 1)^2 + 2 for x <= 1 instead. Find its inverse.
  solution: f^(-1)(x) = 1 - sqrt(x - 2), with domain [2, inf) and range (-inf, 1].
  explanation: The original x - 1 is nonpositive. The negative root is therefore required to recover the
    left-hand branch.
- prompt: Find the inverse of f(x) = sqrt(x - 2) + 3 on its natural domain.
  solution: f^(-1)(x) = (x - 3)^2 + 2, restricted to x >= 3.
  explanation: The original output is at least 3. Subtract 3 and square, but retain this restriction on
    the inverse input even though the polynomial formula itself allows more inputs.
- prompt: Find the inverse of f(x) = 4/(x - 2) + 3, x != 2.
  solution: f^(-1)(x) = 2 + 4/(x - 3), x != 3; inverse range R excluding 2.
  explanation: From y - 3 = 4/(x - 2), solve x = 2 + 4/(y - 3). The original excluded output 3 becomes
    the inverse excluded input.
- prompt: Let f(x) = 2x + 1 only for x in [-1, 3). Find the inverse domain and range.
  solution: Inverse domain [-1, 7); inverse range [-1, 3).
  explanation: The original increasing function sends its included left endpoint to -1 and approaches
    but never reaches 7. Those original outputs become the allowed inverse inputs.
- prompt: Verify g(t) = 2 + sqrt(t - 1) as the inverse of f(x) = (x - 2)^2 + 1 for x >= 2.
  solution: f(g(t)) = t for t >= 1, and g(f(x)) = x for x >= 2.
  explanation: The first composition squares a nonnegative root. The second gives 2 + |x - 2|, which equals
    x because the original domain requires x >= 2. Both domain conditions are essential.
applications:
- title: Calibration and measurement
  description: An invertible calibration rule lets a reported reading be converted back to a possible
    original quantity, with units and physical limits retained.
- title: Solving equations
  description: Inverse operations explain how to recover an unknown input from an output. Domain restrictions
    distinguish valid solutions from extraneous algebraic candidates.
- title: Reversible transformations
  description: A sequence of reversible operations is undone in reverse order. Losing information, such
    as squaring without recording a sign, prevents a unique reversal.
- title: Logarithms and later analysis
  description: Exponential and logarithmic functions are an important inverse pair. General inverse reasoning
    clarifies their domain restrictions and provides a foundation for later study of inverse rates of
    change.
