      mastery_requires_review_pass: false
      allow_self_review: true
    explanation_template: |-
      The original output satisfies y >= {k}.
      Subtract {k} and square to get x = (y - {k})^2 + {h}.
      The inverse formula is (x - {k})^2 + {h}, but its domain remains [{k}, inf), not all of R.
    mistake_tags:
    - inverse_domain_restriction
    - inverse_operation_order
  - id: FUNC_INV_ROOT_DOMAIN_001
    type: generated
    prompt_template: Let f(x) = sqrt(x - {h}) + {k} on its natural real domain. Find the domain of f^(-1)
      in interval notation.
    difficulty: medium
    answer_mode: final_only
    variables:
