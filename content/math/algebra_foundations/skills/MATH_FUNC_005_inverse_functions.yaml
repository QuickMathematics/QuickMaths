  - id: FUNC_INV_COMPOSITION_ORDER_001
    type: fixed
    prompt_template: Suppose f and g are invertible and their domains and ranges match so that both stages
      can be reversed. How do you undo f(g(x))?
    difficulty: hard
    answer_mode: final_only
