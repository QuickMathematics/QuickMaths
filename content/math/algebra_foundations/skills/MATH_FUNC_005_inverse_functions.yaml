id: MATH_FUNC_005
schema_version: '0.2'
name: Inverse functions and domain restrictions
domain: Math
subdomain: Algebra
topic: Functions
description: Reverse one-to-one functions, swap domains and ranges, choose valid inverse branches, and
  verify inverse claims by composition.
prerequisites:
- MATH_FUNC_003
- MATH_FUNC_004
- MATH_ALG_005
unlocks: []
tags:
- functions
- inverse_functions
- one_to_one
- domain_range
- composition
- principal_roots
- proof
