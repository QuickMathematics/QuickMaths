      prompt: 'Optional: record the restrictions, substitution, or reasoning that supports your answer.'
    review_policy:
      work_review: optional
      mastery_requires_review_pass: false
      allow_self_review: true
    explanation_template: |-
      On the stated domain, x - {h} is nonpositive.
      Thus x - {h} = -sqrt(y - {k}).
      The inverse is {h} - sqrt(x - {k}), with domain [{k}, inf) and range (-inf, {h}].
    mistake_tags:
    - inverse_branch_selection
    - principal_square_root
  - id: FUNC_INV_ROOT_FORMULA_001
    type: generated
    prompt_template: Let f(x) = sqrt(x - {h}) + {k} on its natural real domain. Give a formula for f^(-1)(x),
