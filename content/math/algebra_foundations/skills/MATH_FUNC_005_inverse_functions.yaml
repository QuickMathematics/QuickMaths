  - id: FUNC_INV_BRANCH_PROOF_001
    type: fixed
    prompt_template: Let f(x) = (x - 2)^2 + 1 with domain [2, inf). Give an expression for its inverse
      and justify that it really reverses f on the appropriate domains.
    difficulty: hard
    answer_mode: final_plus_required_work
    variables: {}
    derived: {}
    constraints: []
    answer:
      type: expression
      value: 2 + sqrt(x - 1)
      variable: x
    grading:
      method: symbolic_expression
    work:
      mode: proof_obligations
      prompt: Give a complete argument. Your short answer alone is not a proof.
      proof_policy:
        obligations:
        - Explains why the restriction x >= 2 makes the original function one-to-one.
        - Identifies the original range and inverse domain as [1, inf), with the endpoint included.
        - Derives the positive-root branch rather than a plus-or-minus relation.
        - Verifies both composition identities on their stated domains, using sqrt((x - 2)^2) = x - 2
          only when x >= 2.
        accepted_strategies:
        - direct algebraic argument
        - point mapping with explicit domain checks
    review_policy:
      work_review: tutor_required
      mastery_requires_review_pass: true
      allow_self_review: false
    explanation_template: |-
      On x >= 2, x - 2 is nonnegative and its square increases strictly, so f is one-to-one.
      The original range is [1, inf), hence the inverse domain is [1, inf).
      Solving y = (x - 2)^2 + 1 on this branch gives x = 2 + sqrt(y - 1).
      For t >= 1, f(2 + sqrt(t - 1)) = t.
      For x >= 2, 2 + sqrt((x - 2)^2) = 2 + |x - 2| = x.
    mistake_tags:
    - inverse_proof
    - inverse_domain_restriction
    - principal_square_root
