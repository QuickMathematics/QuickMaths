examples:
- prompt: Find the perimeter and area of a 9 cm by 4 cm rectangle.
  solution: Perimeter 26 cm; area 36 cm^2.
  explanation: P = 2(9+4) = 26 and A = 9*4 = 36.
- prompt: A square has side 7 m. Find its perimeter and area.
  solution: 28 m and 49 m^2.
  explanation: P = 4*7 and A = 7^2.
- prompt: A parallelogram has base 12 cm and perpendicular height 5 cm. Find its area.
  solution: 60 cm^2.
  explanation: A = b*h = 12*5; the slanted side is irrelevant to area.
- prompt: A trapezoid has bases 8 m and 14 m and height 5 m. Find its area.
  solution: 55 m^2.
  explanation: A = (8+14)*5/2 = 55.
- prompt: A rectangle has area 72 cm^2 and length 9 cm. Find its width.
  solution: 8 cm.
  explanation: w = A/l = 72/9.
- prompt: A garden has perimeter 34 m and length 11 m. Find its width.
  solution: 6 m.
  explanation: 34 = 2(11+w), so w = 17 - 11 = 6.
- prompt: A 12 cm by 8 cm rectangle has a 3 cm by 2 cm rectangular notch removed. Find its area.
  solution: 90 cm^2.
  explanation: 12*8 - 3*2 = 96 - 6 = 90.
- prompt: A composite floor is two non-overlapping rectangles of areas 24 m^2 and 35 m^2. Find the total area.
  solution: 59 m^2.
  explanation: 'Non-overlapping pieces add: 24 + 35 = 59.'
- prompt: Convert 2.4 m^2 to cm^2.
  solution: 24,000 cm^2.
  explanation: 1 m^2 = 10,000 cm^2, so 2.4*10,000 = 24,000.
- prompt: A rectangle is rotated and its sides remain 5 cm and 13 cm. Find its area.
  solution: 65 cm^2.
  explanation: Rotation does not change the product of side lengths.
applications:
- title: Fencing and edging
  description: Perimeter estimates the length of a boundary material, while gates or openings must be excluded from the walked boundary.
- title: Flooring and paint
  description: Area gives the surface quantity; composite rooms can be split into rectangles or enclosed and subtracted.
- title: Garden beds and paving
  description: Trapezoid and parallelogram formulas model slanted beds when a perpendicular height is measured.
- title: Materials and pricing
  description: Match a price per metre to perimeter and a price per square metre to area before multiplying.
