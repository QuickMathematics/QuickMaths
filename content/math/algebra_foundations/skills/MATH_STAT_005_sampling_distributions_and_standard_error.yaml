id: MATH_STAT_005
schema_version: 0.2
name: Sampling distributions and standard error
domain: Math
subdomain: Statistics
topic: Sampling Distributions
description: Distinguish parameters/statistics, model sampling variability, calculate standard errors and apply CLT
  conditions.
prerequisites:
- MATH_STAT_004
- MATH_PROB_005
tags:
- statistics
unlocks:
- MATH_STAT_006
mastery:
  passing_score: 0.8
  minimum_confidence: 3
  max_guessing_allowed: maybe
  review_after_days_if_mastered: 7
  review_after_days_if_learning: 2
theory: Inference starts from sampling variability. A population parameter is fixed but unknown; a sample statistic
  varies across random samples. Sampling distributions describe this variation. E(x-bar)=μ and E(p-hat)=p. SE(x-bar)=σ/sqrt(n),
  SE(p-hat)=sqrt[p(1-p)/n]. Quadrupling n halves SE. Check randomization, independence/10% condition, and normal/large-count
  conditions. The Central Limit Theorem makes the distribution of sample means more nearly normal as n grows. Large
  n reduces random variation but does not repair selection or measurement bias.
examples:
  - prompt: 'A population has SD 12 and samples have size 36. Find the standard error of the sample mean.'
    solution: 'If population SD is 12 and n=36, SE(x-bar)=12/sqrt(36)=2.'
    explanation: 'The sampling mean varies less than individual observations.'
  - prompt: 'Assume a normal population has mean 50 and SD 10. Describe the center and approximate 95% spread of means for n=25.'
    solution: 'The sampling mean is 50 and SE=10/sqrt(25)=2; about 95% of means lie within 50±2(2), or (46,54).'
    explanation: 'Center stays at the population mean while standard error controls spread.'
applications:
  - title: 'Polling precision'
    description: 'Sampling distributions and standard errors quantify how poll estimates vary from sample to sample.'
  - title: 'Sample-size planning'
    description: 'Use sample-size planning to make estimates precise while distinguishing population spread from sampling spread.'
test:
