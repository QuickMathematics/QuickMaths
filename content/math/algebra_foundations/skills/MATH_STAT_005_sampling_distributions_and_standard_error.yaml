        - 9
        - 16
        - 25
        - 36
        - 49
        - 64
        - 100
    derived: {}
    answer:
      type: numeric
      value: '{mu}'
    grading:
      method: exact_numeric
    work:
      mode: none
    review_policy:
      work_review: none
      mastery_requires_review_pass: false
      allow_self_review: true
    explanation_template: Sample mean is unbiased.
    mistake_tags:
