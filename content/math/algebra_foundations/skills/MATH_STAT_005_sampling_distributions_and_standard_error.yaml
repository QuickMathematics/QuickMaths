      label: p is a parameter and .57 a statistic
    - id: B
      label: Both parameters
    - id: C
      label: .57 parameter p statistic
    - id: D
      label: Neither
    answer:
      type: multiple_choice
      value: A
    grading:
      method: multiple_choice
    work:
      mode: none
    review_policy:
      work_review: none
      mastery_requires_review_pass: false
      allow_self_review: true
    explanation_template: Parameters describe populations; statistics summarize samples.
    mistake_tags:
    - concept_error
    difficulty: medium
