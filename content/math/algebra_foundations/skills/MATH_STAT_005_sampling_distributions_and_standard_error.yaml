        - 3
        - 4
        - 5
        - 6
        - 8
        - 10
      k:
        type: int
        min: 1
        max: 6
      z:
        type: choice
        values:
        - -3
        - -2
        - -1
        - 1
        - 2
        - 3
    derived:
      n: root**2
      sigma: root*k
      se: k
      xbar: mu+z*se
    answer:
      type: numeric
      value: '{z}'
    grading:
      method: exact_numeric
    work:
      mode: capture_only
      prompt: Show the formula, substitution, and result.
    review_policy:
