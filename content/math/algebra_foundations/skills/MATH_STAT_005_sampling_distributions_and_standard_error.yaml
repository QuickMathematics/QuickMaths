    max_attempts: 300
    variables:
      root:
        type: choice
        values:
        - 2
        - 3
        - 4
        - 5
        - 6
        - 8
        - 10
      k:
        type: int
        min: 1
        max: 7
    derived:
      n: root**2
      sigma: root*k
      se: k
    answer:
      type: numeric
      value: '{se}'
    grading:
      method: exact_numeric
    work:
      mode: capture_only
      prompt: Show the formula, substitution, and result.
    review_policy:
      work_review: none
      mastery_requires_review_pass: false
      allow_self_review: true
    explanation_template: SE=sigma/sqrt(n).
    mistake_tags:
    - calculation_error
    difficulty: medium
