examples:
- prompt: Name the vertex and sides of angle ABC.
  solution: B is the vertex; rays BA and BC are the sides.
  explanation: The middle letter names the common endpoint. The sides are rays starting at B and passing through A and C.
- prompt: Two lines intersect. One angle is 68 degrees. Find its vertical angle and each adjacent angle.
  solution: Vertical angle 68 degrees; each adjacent angle 112 degrees.
  explanation: Vertical angles are equal. Each adjacent linear-pair angle is 180 - 68 = 112 degrees.
- prompt: Three rays around point O make angles 95 degrees, 125 degrees, and x. Find x.
  solution: 140 degrees.
  explanation: Angles around a point total 360 degrees, so x = 360 - 95 - 125 = 140 degrees.
- prompt: A straight angle is split into 47 degrees and x. Find x.
  solution: 133 degrees.
  explanation: A straight angle is 180 degrees, so x + 47 = 180.
- prompt: Lines p and q are parallel. A transversal makes a 74 degree angle in the upper-left position at p. Find the corresponding angle at q.
  solution: 74 degrees.
  explanation: Corresponding angles are equal when parallel lines are cut by a transversal.
- prompt: In parallel lines p || q, one interior angle is 112 degrees. Find its alternate interior partner and its same-side interior partner.
  solution: Alternate interior 112 degrees; same-side interior 68 degrees.
  explanation: Alternate interior angles are equal, while co-interior angles sum to 180 degrees.
- prompt: Two lines cut by a transversal have alternate interior angles both equal to 63 degrees. What conclusion is justified?
  solution: The two lines are parallel.
  explanation: Equal alternate interior angles establish parallelism by the converse theorem.
- prompt: A transversal crosses two lines, and same-side interior angles measure 121 degrees and 59 degrees. What conclusion is justified?
  solution: The lines are parallel.
  explanation: 121 + 59 = 180 degrees, so the supplementary co-interior converse applies.
- prompt: A diagram labels a ray AB and a segment CD. Which object has exactly one endpoint?
  solution: Ray AB.
  explanation: A ray starts at A and continues through B; a segment has two endpoints.
- prompt: One angle at a parallel-line intersection is 38 degrees. List the only two measures appearing among all eight angles.
  solution: 38 degrees and 142 degrees.
  explanation: Vertical, corresponding, and alternate angles copy 38 degrees; adjacent angles are its supplement, 142 degrees.
applications:
- title: Road and rail crossings
  description: Parallel lane markings and a crossing road create predictable turning angles for signs, lane design, and surveying.
- title: Roof trusses
  description: Repeated parallel braces transfer angle constraints so a builder can check a joint from a measured partner angle.
- title: Tile and textile patterns
  description: Translated stripes use corresponding angles to keep borders aligned after a pattern repeats.
- title: Maps and camera sight lines
  description: Grid lines and a line of sight can model transversal relationships when estimating a missing direction angle.
test:
  question_count: 20
  randomize_order: true
  questions:
  - id: GEOM005_VERTEX_NAME_001
    type: fixed
    prompt_template: In angle XYZ, which point is the vertex?
    answer_mode: final_only
    options:
    - {id: A, label: 'X'}
    - {id: B, label: 'Y'}
    - {id: C, label: 'Z'}
    - {id: D, label: 'The point halfway between X and Z'}
    answer: {type: multiple_choice, value: B}
    grading: {method: multiple_choice}
    work: {mode: none}
    review_policy: {work_review: none, mastery_requires_review_pass: false, allow_self_review: true}
    explanation_template: The middle letter names the vertex, so Y is the common endpoint of rays YX and YZ.
    mistake_tags: [angle_notation, vertex]
    difficulty: easy
  - id: GEOM005_VERTICAL_002
    type: generated
    prompt_template: Two lines intersect. One angle is {a} degrees. What is its vertical angle?
    variables: {a: {type: int, min: 25, max: 155}}
    answer_mode: final_only
    answer: {type: numeric, value: '{a}'}
    grading: {method: exact_numeric}
    work: {mode: none}
    review_policy: {work_review: none, mastery_requires_review_pass: false, allow_self_review: true}
    explanation_template: Vertical angles are equal, so the opposite angle is {a} degrees.
    mistake_tags: [vertical_angles]
    difficulty: easy
  - id: GEOM005_LINEAR_PAIR_003
    type: generated
    prompt_template: A linear pair contains angles {a} degrees and x. Find x.
    variables: {a: {type: int, min: 25, max: 155}}
    derived: {x: 180-a}
    answer_mode: final_only
    answer: {type: numeric, value: '{x}'}
    grading: {method: exact_numeric}
    work: {mode: none}
    review_policy: {work_review: none, mastery_requires_review_pass: false, allow_self_review: true}
    explanation_template: A linear pair sums to 180 degrees, so x = 180 - {a} = {x} degrees.
    mistake_tags: [linear_pair]
    difficulty: easy
  - id: GEOM005_AROUND_POINT_004
    type: fixed
    prompt_template: Three angles around a point are 80 degrees, 120 degrees, and x. Find x.
    answer_mode: final_only
    answer: {type: numeric, value: '160'}
    grading: {method: exact_numeric}
    work: {mode: none}
    review_policy: {work_review: none, mastery_requires_review_pass: false, allow_self_review: true}
    explanation_template: Angles around a point total 360 degrees, so x = 360 - 80 - 120 = 160 degrees.
    mistake_tags: [full_turn]
    difficulty: easy
  - id: GEOM005_CORRESPONDING_005
    type: fixed
    prompt_template: In the diagram, p || q and a corresponding angle at p is 71 degrees. What is the matching angle at q?
    answer_mode: final_only
    answer: {type: numeric, value: '71'}
    grading: {method: exact_numeric}
    work: {mode: none}
    review_policy: {work_review: none, mastery_requires_review_pass: false, allow_self_review: true}
    explanation_template: Corresponding angles are equal for parallel lines, giving 71 degrees.
    mistake_tags: [corresponding_angles, parallel_hypothesis]
    difficulty: medium
  - id: GEOM005_ALTERNATE_006
    type: generated
    prompt_template: For p || q, an alternate interior angle is {a} degrees. Find its partner.
    variables: {a: {type: int, min: 30, max: 150}}
    answer_mode: final_only
    answer: {type: numeric, value: '{a}'}
    grading: {method: exact_numeric}
    work: {mode: none}
    review_policy: {work_review: none, mastery_requires_review_pass: false, allow_self_review: true}
    explanation_template: Alternate interior angles are equal, so the partner is {a} degrees.
    mistake_tags: [alternate_interior]
    difficulty: medium
  - id: GEOM005_COINTERIOR_007
    type: generated
    prompt_template: Same-side interior angles are {a} degrees and x for parallel lines. Find x.
    variables: {a: {type: int, min: 30, max: 150}}
    derived: {x: 180-a}
    answer_mode: final_only
    answer: {type: numeric, value: '{x}'}
    grading: {method: exact_numeric}
    work: {mode: none}
    review_policy: {work_review: none, mastery_requires_review_pass: false, allow_self_review: true}
    explanation_template: Same-side interior angles are supplementary, so x = 180 - {a} = {x} degrees.
    mistake_tags: [cointerior, supplementary]
    difficulty: medium
  - id: GEOM005_CONVERSE_008
    type: fixed
    prompt_template: A transversal creates equal alternate interior angles of 64 degrees. What can be concluded?
    answer_mode: final_only
    options:
    - {id: A, label: 'The lines are parallel'}
    - {id: B, label: 'The lines are perpendicular'}
    - {id: C, label: 'The lines must intersect again'}
    - {id: D, label: 'No conclusion is possible'}
    answer: {type: multiple_choice, value: A}
    grading: {method: multiple_choice}
    work: {mode: none}
    review_policy: {work_review: none, mastery_requires_review_pass: false, allow_self_review: true}
    explanation_template: Equal alternate interior angles invoke the converse of the parallel-line theorem.
    mistake_tags: [converse, parallel_lines]
    difficulty: medium
  - id: GEOM005_NOT_CONVERSE_009
    type: fixed
    prompt_template: Two unrelated angles elsewhere in a drawing both measure 50 degrees. Does that alone prove two lines are parallel?
    answer_mode: final_only
    options:
    - {id: A, label: 'Yes, any equal angles prove parallelism'}
    - {id: B, label: 'No, their positions must form a qualifying converse pair'}
    - {id: C, label: 'Yes, if the drawing is rotated'}
    - {id: D, label: 'No, parallel lines cannot have equal angles'}
    answer: {type: multiple_choice, value: B}
    grading: {method: multiple_choice}
    work: {mode: none}
    review_policy: {work_review: none, mastery_requires_review_pass: false, allow_self_review: true}
    explanation_template: A converse requires corresponding, alternate interior, or supplementary same-side positions.
    mistake_tags: [converse, insufficient_information]
    difficulty: medium
  - id: GEOM005_OBJECTS_010
    type: fixed
    prompt_template: Which object has one endpoint and continues forever in one direction?
    answer_mode: final_only
    options:
    - {id: A, label: 'A segment'}
    - {id: B, label: 'A ray'}
    - {id: C, label: 'A line'}
    - {id: D, label: 'A point'}
