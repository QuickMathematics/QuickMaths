    review_policy: {work_review: none, mastery_requires_review_pass: false, allow_self_review: true}
    explanation_template: Corresponding angles are equal; adjacent angles and same-side interior angles generally form supplementary pairs.
    mistake_tags: [parallel_angle_rules]
    difficulty: easy
