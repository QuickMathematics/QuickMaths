    grading: {method: multiple_choice}
    work: {mode: none}
    review_policy: {work_review: none, mastery_requires_review_pass: false, allow_self_review: true}
    explanation_template: Rotating a figure changes orientation but preserves all angle measures and parallel relationships.
    mistake_tags: [orientation, rigid_motion]
    difficulty: medium
  - id: GEOM005_TUTOR_REASONING_013
    type: fixed
    prompt_template: Explain why the marked 72 degree angle and its same-side interior partner in the p || q diagram sum to 180 degrees. State the hypothesis and the relationship.
    answer_mode: final_plus_required_work
    answer: {type: numeric, value: '108'}
    grading: {method: exact_numeric}
    work:
      mode: rubric_check
      prompt: Explain the angle relationship and calculate the partner; a number without a reason is incomplete.
      rubric:
        criteria:
        - {id: hypothesis, description: States that p and q are parallel and a transversal crosses them., weight: 2}
        - {id: relationship, description: Identifies the angles as same-side interior (co-interior) and supplementary., weight: 2}
        - {id: equation, description: Writes 72 + x = 180 or an equivalent equation., weight: 2}
        - {id: conclusion, description: Solves x = 108 degrees and connects it to the stated relationship., weight: 2}
    review_policy:
      work_review: tutor_required
      mastery_requires_review_pass: true
      allow_self_review: false
    explanation_template: Same-side interior angles formed by a transversal of parallel lines are supplementary. Thus 72 + x = 180, giving x = 108 degrees.
    mistake_tags: [tutor_reasoning, cointerior, parallel_hypothesis]
    difficulty: hard
    media:
    - src: media/native-plane-foundations/geom005-capstone.svg
      alt: Parallel lines p and q are crossed by a transversal; the marked same-side interior angles are 72 degrees and x.
      width: 720
      height: 360
      caption: Use the parallel marks and the stated 72 degree angle; do not measure the picture.
