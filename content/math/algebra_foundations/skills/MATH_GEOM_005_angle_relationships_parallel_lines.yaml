    - {id: C, label: 'Yes, if the page is rotated'}
    - {id: D, label: 'No, transversals never create angle relationships'}
    answer: {type: multiple_choice, value: B}
    grading: {method: multiple_choice}
    work: {mode: none}
    review_policy: {work_review: none, mastery_requires_review_pass: false, allow_self_review: true}
    explanation_template: A visual appearance does not establish parallelism; use a stated hypothesis or a qualifying converse pair.
    mistake_tags: [parallel_hypothesis, diagram_not_to_scale]
    difficulty: hard
