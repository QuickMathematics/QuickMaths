    mistake_tags: [ray_segment_line]
    difficulty: easy
  - id: GEOM005_TWO_MEASURES_011
    type: fixed
    prompt_template: A right-angle mark shows a 90 degree angle split by a ray. One part is 34 degrees. Find the other part.
