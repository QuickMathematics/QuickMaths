id: MATH_CALC_005
schema_version: '0.2'
name: Product and quotient rules
domain: Math
subdomain: Calculus
topic: Differentiation
description: Differentiate products and quotients with explicit hypotheses, retain original domains after cancellation,
  and interpret product and quotient rates in context.
prerequisites:
- MATH_CALC_004
- MATH_RAT_001
- MATH_RAT_002
- MATH_RAT_003
unlocks:
- MATH_CALC_006
tags:
- calculus
- derivatives
- reasoning
- graph_interpretation
- domain_restrictions
mastery:
  passing_score: 0.8
  minimum_confidence: 3
  max_guessing_allowed: maybe
  review_after_days_if_mastered: 7
  review_after_days_if_learning: 2
theory: 'Products and quotients describe interacting quantities. Area can be length times width, and an average
  cost is total cost divided by output. When both components change, a derivative must account for both changes.
  The sum rule does not extend by simply multiplying or dividing derivatives. This lesson uses polynomials and
  rational functions, with the original real domain kept visible throughout.


  The product rule:

  If u and v are differentiable at an interior point, then (uv)''=u''v+uv''. One term describes change in u while
  retaining the current value of v; the other describes change in v while retaining the current value of u. Both
  original functions still appear. For (x+2)(x+5), the derivative is 1*(x+5)+(x+2)*1=2x+7. Multiplying the two
  derivatives would give 1, which misses almost all the change.


  Why there are two terms:

  Consider a rectangle of dimensions u and v whose side changes are du and dv. Its area change is v*du+u*dv+du*dv.
  Dividing by the input change gives two main contributions and a small cross term. For differentiable side functions,
  the cross term tends to zero in the limiting calculation. Equivalently, add and subtract u(a+h)*v(a) in the
  difference quotient and use continuity of differentiable functions. This explanation needs differentiability;
  it is not a rule for arbitrary discontinuous quantities.


  An organized product calculation:

  For f(x)=x^2(3x-4), choose u=x^2 and v=3x-4. Then u''=2x and v''=3. Apply the product rule before simplifying:
  f''=2x(3x-4)+3x^2=9x^2-8x. Expanding f to 3x^3-4x^2 first gives the same derivative by the power and sum rules.
  Either route is legitimate when the problem does not prescribe a method. The explicit two-term setup is useful
  evidence that you understand the product rule.


  The quotient rule:

  If u and v are differentiable at a and v(a)!=0, then the derivative of u/v at a is [u''(a)*v(a)-u(a)*v''(a)]/[v(a)]^2.
  For a derivative function, use the same formula wherever the hypotheses hold. The order of subtraction matters.
  The denominator is the original denominator squared, not the derivative of that denominator. Write the numerator
  in parentheses before reducing it.


  A quotient example:

  For f(x)=(x^2+1)/(x+1), the original domain excludes -1. Set u=x^2+1 and v=x+1. The derivative is [2x(x+1)-(x^2+1)]/(x+1)^2=(x^2+2x-1)/(x+1)^2,
  still for x!=-1. At x=1 the derivative equals (1+2-1)/4=1/2. The function value there is 1. Those two numbers
  have different roles in a tangent equation: y=1+(1/2)(x-1).


  A way to remember the quotient structure:

  The identity u=(u/v)*v holds where v is nonzero. Applying the product rule there gives u''=(u/v)''*v+(u/v)*v''.
  Rearranging yields the quotient formula. This is a useful consistency check once differentiability of the reciprocal
  has been established; it should not be presented as a circular existence proof. The reciprocal limit calculation
  from the first derivative lesson provides the missing foundation.


  Simple special cases:

  For c/(x+b), where c and b are constants, the derivative is -c/(x+b)^2 on x!=-b. For x/(x+b), it is b/(x+b)^2.
  A fixed numerical denominator such as x^3/5 is better viewed as (1/5)*x^3 and differentiated by constant multiplication.
  Select the simplest valid representation rather than mechanically use the longest available rule.


  Original domains survive simplification:

  The function (x^2-4)/(x-2) agrees with x+2 only where x!=2. It therefore has derivative 1 at every allowed input,
  but has no derivative at 2 because its value is undefined there. The extended function x+2 does have derivative
  1 at 2; that is a different function. A cancelled factor in a derivative formula cannot restore a missing point
  in the original domain. Record restrictions before reducing either the function or its derivative.


  Data without formulas:

  Suppose u(a)=2, u''(a)=3, v(a)=5, and v''(a)=7. Then (uv)''(a)=3*5+2*7=29, while (u/v)''(a)=(3*5-2*7)/25=1/25.
  All four values are needed in general. The expression u''(a)/v''(a)=3/7 is neither the quotient derivative nor
  a substitute for it. When v(a)=0 the quotient is not defined at a, regardless of whether a simplified expression
  has a limit.


  Applications and units:

  If L(t) and W(t) are lengths in metres with t in seconds, A''(t)=L''(t)W(t)+L(t)W''(t) has units square metres
  per second. One side can grow while the other shrinks, so the signs of both contributions matter. If C(q) is
  total cost and q is output quantity, the average cost C(q)/q has derivative [q*C''(q)-C(q)]/q^2 for q>0 in the
  model. This is not the same quantity as the marginal total cost C''(q).


  Limits of the rules:

  A nonzero denominator alone is not sufficient; differentiability of the components must also be established.
  For example, abs(x-1)/(x+1) is defined at 1 but has unequal one-sided slopes there. Conversely, a particular
  product can be differentiable even if the usual rule''s component hypotheses fail, so do not infer a converse.
  The lesson focuses on applying sufficient hypotheses correctly.


  Self-check and proof:

  Before calculating, identify u, v, their derivatives, and the original domain. After calculating, check signs,
  parentheses, units, and a simple sample value. A graph may reveal a sign error but is not a proof. The formal
  exercise checks one exact quotient derivative with its nonzero denominator; the reviewed capstone separately
  asks you to distinguish an original rational function from a continuous extension. Neither task replaces the
  other.'
math_blocks:
- type: notation
  text: (u*v)' = u'*v + u*v'
  alt: Product differentiation rule
  linear_text: (u*v)' = u'*v + u*v'
- type: fraction
  numerator: u'*v-u*v'
  denominator: v^2
  alt: Quotient derivative; u and v differentiable and v nonzero
  linear_text: (u'*v-u*v')/(v^2)
examples:
- prompt: Differentiate (x+2)(x+5).
  solution: 2x+7
  explanation: The product rule gives 1*(x+5)+(x+2)*1. Expand-and-differentiate confirms the answer.
- prompt: Differentiate x^2(3x-4).
  solution: 9x^2-8x
  explanation: Use 2x(3x-4)+x^2*3, then combine terms. The product of the derivatives is not the derivative of
    the product.
- prompt: At a, u=2, u'=3, v=5, v'=7. Find (uv)'(a).
  solution: '29'
  explanation: Compute 3*5+2*7. Both the current values and the rates contribute.
- prompt: Differentiate x/(x+4).
  solution: 4/(x+4)^2, x!=-4
  explanation: The numerator is 1*(x+4)-x*1=4. Retain the original excluded input -4.
- prompt: Differentiate (x^2+1)/(x+1).
  solution: (x^2+2x-1)/(x+1)^2, x!=-1
  explanation: Form [2x(x+1)-(x^2+1)]/(x+1)^2 before simplifying. Parentheses preserve the subtraction of both
    numerator terms.
- prompt: Differentiate 5/(x-2).
  solution: -5/(x-2)^2, x!=2
  explanation: The constant numerator has derivative zero. The quotient numerator is 0*(x-2)-5*1=-5.
- prompt: At a, u=2, u'=3, v=5, v'=7. Find (u/v)'(a).
  solution: 1/25
  explanation: The numerator is 3*5-2*7=1 and the denominator is 5^2. The condition v(a)!=0 holds.
- prompt: For f(x)=(x^2-4)/(x-2), find f'(3) and explain x=2.
  solution: f'(3)=1; no derivative at 2
  explanation: For x!=2, f=x+2 and f'=1. At 2 the original function has no value, so its derivative is not defined
    there.
- prompt: A rectangle has L=6 m, W=4 m, L'=0.5 m/s, W'=-0.2 m/s. Find A'.
  solution: 0.8 square metres per second
  explanation: A'=L'W+LW'=0.5*4+6*(-0.2)=0.8. One side's growth outweighs the other side's shrinkage.
- prompt: Total cost is C(q)=q^2+100 for q>0. Find the rate of average cost at q=20.
  solution: 3/4 cost-units per output-unit squared
  explanation: Average cost is C/q=q+100/q. Its derivative is 1-100/q^2, so at 20 it is 3/4. This is not C'(20)=40.
applications:
- title: Changing area
  description: Changing rectangle sides make two first-order contributions to area rate; include both with their
    signed rates and square-length-per-time units.
- title: Average quantities
  description: Differentiate average cost or another quotient model rather than accidentally differentiate its
    numerator alone.
- title: Concentration and density
  description: A numerator and denominator that both change contribute separately to the rate of their ratio;
    check the denominator and units.
- title: Models with excluded inputs
  description: A simplified formula may hide a hole. Preserve the original model domain when reporting a derivative
    or interpreting a graph.
