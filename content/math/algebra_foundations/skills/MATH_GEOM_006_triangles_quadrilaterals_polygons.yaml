examples:
- prompt: Find the interior-angle sum of a pentagon.
  solution: 540 degrees.
  explanation: (5 - 2) * 180 = 540 degrees.
- prompt: Find each interior angle of a regular hexagon.
  solution: 120 degrees.
  explanation: The sum is 720 degrees, and 720/6 = 120 degrees.
- prompt: A triangle has angles 48 and 67 degrees. Find the third angle.
  solution: 65 degrees.
  explanation: Triangle angles sum to 180, so 180 - 48 - 67 = 65.
- prompt: Can lengths 5, 8, and 13 form a nondegenerate triangle?
  solution: No.
  explanation: The two shorter lengths sum to 13, not more than 13, so the triangle inequality fails.
- prompt: Classify a triangle with side lengths 9, 9, and 12.
  solution: Isosceles.
  explanation: Two equal sides make it isosceles; the unequal third side does not prevent that classification.
- prompt: A triangle has angles 90, 35, and 55 degrees. Classify it by angles.
  solution: Right triangle.
  explanation: One angle is exactly 90 degrees.
- prompt: Under the inclusive convention, is a square a trapezoid?
  solution: Yes.
  explanation: A square has two pairs of parallel sides, so it has at least one pair.
- prompt: A quadrilateral has angles 92, 88, 104, and x. Find x.
  solution: 76 degrees.
  explanation: Quadrilateral sum is 360, so x = 360 - 92 - 88 - 104 = 76.
- prompt: Find the exterior angle of a regular decagon.
  solution: 36 degrees.
  explanation: Regular exterior angles sum to 360, so 360/10 = 36.
- prompt: A figure is a square rotated 30 degrees. Has its classification changed?
  solution: No, it is still a square.
  explanation: Rigid rotation preserves lengths, right angles, and parallel sides.
applications:
- title: Roof and bridge trusses
  description: Triangle inequality and angle sums help reject impossible member lengths and check a repeated frame.
- title: Floor and tile layouts
  description: Polygon sums identify missing corner angles when a rotated tile must meet neighboring pieces.
- title: Signs and panels
  description: Regular polygon exterior turns guide repeated cuts and equal spacing around a sign.
- title: Structural classification
  description: The quadrilateral hierarchy helps describe which sides are parallel or equal before selecting a calculation.
