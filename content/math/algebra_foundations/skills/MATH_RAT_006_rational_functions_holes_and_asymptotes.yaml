    grading:
      method: exact_numeric
    work:
      mode: none
    review_policy:
      work_review: none
      mastery_requires_review_pass: false
    explanation_template: |-
      The numerator has degree 1 and the denominator has degree 2.
      Because the numerator degree is smaller, the function approaches 0 as |x| grows.
      The horizontal asymptote is y = 0.
    mistake_tags:
    - horizontal_asymptote_error
    - degree_error
    - end_behavior_error
    difficulty: medium
