  - id: FUNC_RANGE_HOLE_REASONING_001
    type: fixed
    prompt_template: For the original real function f(x) = (x^2 - 4)/(x - 2), give its range in interval
      notation and justify every excluded output.
    difficulty: hard
    answer_mode: final_plus_required_work
    variables: {}
    derived: {}
    constraints: []
    answer:
      type: interval_set
      value: (-inf, 4) U (4, inf)
      variable: x
    grading:
      method: interval_set
    work:
      mode: rubric_check
      prompt: Explain your conclusion using the visible criteria; a correct short answer alone is not
        sufficient.
      rubric:
        criteria:
        - id: criterion_1
          description: Identifies x = 2 as excluded by the original denominator before cancellation.
          weight: 2
        - id: criterion_2
          description: Derives f(x) = x + 2 only on the original domain.
          weight: 2
        - id: criterion_3
          description: Explains why output 4 has no allowed preimage.
          weight: 2
        - id: criterion_4
          description: Shows that every output other than 4 is attained, for example using x = y - 2.
          weight: 2
    review_policy:
      work_review: tutor_required
      mastery_requires_review_pass: true
      allow_self_review: false
    explanation_template: |-
      For x != 2 the formula equals x + 2.
      The value 4 would require x = 2, which is forbidden by the original denominator.
      Every other real output y comes from the allowed input x = y - 2.
      Thus the range is all real numbers except 4.
    mistake_tags:
    - cancelled_domain_restriction
    - range_surjectivity
