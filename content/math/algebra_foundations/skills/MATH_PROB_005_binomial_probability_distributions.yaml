id: MATH_PROB_005
schema_version: 0.2
name: Binomial probability distributions
domain: Math
subdomain: Probability
topic: Binomial Models
description: Recognize binomial settings and calculate probabilities, mean and spread.
prerequisites:
- MATH_PROB_003
- MATH_PROB_004
tags:
- probability
- binomial
unlocks:
- MATH_STAT_004
mastery:
  passing_score: 0.8
  minimum_confidence: 3
  max_guessing_allowed: maybe
  review_after_days_if_mastered: 7
  review_after_days_if_learning: 2
theory: 'A binomial random variable counts successes in a fixed number n of independent binary trials with constant
  success probability p. Check BINS: Binary, Independent, Number fixed, Same p. P(X=k)=nCk p^k(1-p)^(n-k). “At least
  one” is often a complement. Mean=np, variance=np(1-p), SD=sqrt(np(1-p)). Sampling without replacement is not exactly
  binomial because p changes.'
examples:
  - prompt: 'Five independent trials have success probability .2. Find P(X=2).'
    solution: 'P(X=2)=C(5,2)(0.2)^2(0.8)^3=10(0.04)(0.512)=0.2048.'
    explanation: 'Choose the two success positions and multiply the probability of each sequence.'
  - prompt: 'For n=5 and p=.2, find P(X>=1), the expected number, and the standard deviation.'
    solution: 'For n=5,p=.2, P(X>=1)=1-.8^5=.67232, mean=np=1, and SD=sqrt(np(1-p))=sqrt(.8)=.8944.'
    explanation: 'The complement is efficient for at-least-one events, while np and np(1-p) give center and spread.'
applications:
  - title: 'Repeated-trial quality control'
    description: 'Binomial models estimate defect counts, conversion totals, and repeated-trial success rates.'
  - title: 'Success-rate planning'
    description: 'Means, standard deviations, and tail probabilities support staffing and risk decisions.'
test:
