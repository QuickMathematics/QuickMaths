    type: fixed
    prompt_template: Which is binomial?
    answer_mode: final_only
    options:
    - id: A
      label: 30 independent items each defective with probability .02
    - id: B
      label: Draw cards until first ace
    - id: C
      label: Record bus waiting times
    - id: D
      label: Roll until total exceeds 20
    answer:
      type: multiple_choice
      value: A
    grading:
      method: multiple_choice
    work:
      mode: none
    review_policy:
      work_review: none
      mastery_requires_review_pass: false
      allow_self_review: true
    explanation_template: BINS conditions hold only in A.
    mistake_tags:
    - concept_error
    difficulty: medium
  - id: BINOMIAL_WITHOUT_REPLACEMENT
