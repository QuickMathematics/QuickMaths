  randomize_order: true
  questions:
    - id: VAR_BOTH_SIDES_BASIC_001
      type: generated
      prompt_template: "Solve for x: {a}x + {b} = {c}x + {d}"
      answer_mode: final_plus_required_work
      max_attempts: 250
      variables:
        x:
          type: int
          min: -12
          max: 12
          exclude: [0]
        a:
          type: int
          min: 4
          max: 12
        c:
          type: int
          min: 2
          max: 10
        b:
          type: int
          min: 2
          max: 20
      derived:
        d: "a * x + b - c * x"
        variable_difference: "a - c"
        constant_difference: "d - b"
      constraints:
        - "a != c"
        - "d != 0"
        - "variable_difference != 1"
        - "variable_difference != -1"
      answer:
        type: equation_solution
        variable: x
        value: "{x}"
      grading:
        method: equation_solution
      work:
        mode: procedural_steps
        prompt: "Show each equivalent equation step, ending with x = your final answer."
        line_type: equation
        target_variable: x
        minimum_steps: 4
        require_final_answer_match: true
      review_policy:
        work_review: auto
        mastery_requires_review_pass: false
      explanation_template: |
        Start with {a}x + {b} = {c}x + {d}.
        Move x-terms together: subtract {c}x from both sides to get {variable_difference}x + {b} = {d}.
        Move constants: {variable_difference}x = {constant_difference}.
        Divide by {variable_difference}: x = {x}.
      mistake_tags:
        - inverse_operations
        - variables_on_both_sides
        - equation_balance
        - sign_error
        - coefficient_error
      difficulty: easy

