id: MATH_CALC_003
schema_version: '0.2'
name: Derivatives as local rates and limits
domain: Math
subdomain: Calculus
topic: Differentiation
description: Connect secant slopes, difference quotients, finite two-sided limits, tangent lines, and instantaneous
  rates; distinguish point values, approximation, and failure of differentiability.
prerequisites:
- MATH_FUNC_007
- MATH_CALC_001
- MATH_CALC_002
unlocks:
- MATH_CALC_004
tags:
- calculus
- derivatives
- reasoning
- graph_interpretation
- domain_restrictions
mastery:
  passing_score: 0.8
  minimum_confidence: 3
  max_guessing_allowed: maybe
  review_after_days_if_mastered: 7
  review_after_days_if_learning: 2
theory: 'A derivative describes local change. An average rate uses two distinct inputs; a derivative asks what
  those rates approach as the second input moves toward the first. This lesson connects the difference quotients
  and limits you already know. All functions and derivatives here are real. An ordinary derivative means a finite,
  two-sided derivative at an interior point unless a question explicitly asks about one-sided behavior.



  From a secant to a local rate:

  For a function f and distinct inputs a and a+h, the average rate is [f(a+h)-f(a)]/h. The numerator is a change
  in output, not the output itself. The denominator is a change in input and may be positive or negative, but
  it is not zero. On a graph this quotient is the slope of a secant through two points. As h approaches zero,
  the points approach each other. If the quotients approach one common finite value, that value is f''(a).



  The definition:

  f''(a) = lim as h -> 0 of [f(a+h)-f(a)]/h.

  A prime does not mean multiplication, an inverse function, or a reciprocal. If y=f(x), dy/dx is another notation
  for the derivative. At this stage treat it as derivative notation, not permission to cancel arbitrary symbols.
  A derivative at a point is a number. The derivative function f''(x) assigns that number at each input where
  it exists.



  A complete first-principles calculation:

  Let f(x)=x^2 and a=3. Then f(3+h)=(3+h)^2 and f(3)=9. The quotient is [(3+h)^2-9]/h. Expanding the numerator
  gives 6h+h^2. For h!=0, division gives 6+h. Only now take the limit: f''(3)=6. The excluded increment remains
  excluded from the original quotient. A limit of 6 does not turn division by zero into a valid operation.



  The same calculation at a general input gives [(a+h)^2-a^2]/h=2a+h for h!=0, so the derivative function of x^2
  is 2x. At a=-2 it is -4; at zero it is zero. The graph can have a horizontal tangent at one point without being
  a constant function. A tangent need not touch the graph only once or stay entirely on one side of it: y=0 is
  tangent to y=x^3 at zero and the curve crosses it there.



  Other definitions-based examples:

  For f(x)=mx+b, the output change is mh, so every nonzero-increment quotient equals m. A constant output has
  zero output change and derivative zero. For x^3, expansion gives [ (a+h)^3-a^3 ]/h=3a^2+3ah+h^2 for h!=0, hence
  the derivative at a is 3a^2. These results are consequences of the definition, not rules that should be invoked
  when an exercise specifically asks for first principles.



  Roots and reciprocals:

  For sqrt(x) at a=4, multiply the difference quotient by the conjugate. On nearby allowed inputs, [sqrt(4+h)-2]/h
  becomes 1/[sqrt(4+h)+2], whose limit is 1/4. At a general positive a the corresponding result is 1/[2sqrt(a)].
  For 1/x at a!=0, combine the numerator fractions to obtain -1/[a(a+h)] for h!=0 and a+h!=0. The limit is -1/a^2.
  State the function''s original domain as well as the increment restriction.



  When the derivative fails:

  For f(x)=abs(x) at zero, the difference quotient is abs(h)/h. It equals -1 to the left and 1 to the right. The
  two-sided derivative does not exist because the sides disagree. Continuity alone therefore does not guarantee
  differentiability. Conversely, differentiability at an interior point implies continuity there. A jump, an unfilled
  hole, or a reassigned point value can prevent differentiability even when a nearby simplified curve looks smooth.



  At an endpoint such as zero for sqrt(x), this lesson does not invent a missing real left neighborhood. Even
  the right-hand quotient equals 1/sqrt(h) for h>0 and grows without bound. That is not a finite ordinary derivative.
  Keep a finite slope, unequal one-sided slopes, an undefined function value, and unbounded one-sided slope conceptually
  separate.



  Interpretation and approximation:

  If s measures position in metres and t measures time in seconds, s''(a) has units metres per second. Its sign
  indicates direction in that coordinate, not whether the position itself is positive. A negative temperature
  derivative means cooling; it does not imply a negative temperature. For small delta, f(a+delta) is approximately
  f(a)+f''(a)*delta when the local linear model is appropriate. This is an approximation, not a claim that every
  curved graph is a line.



  The tangent through (a,f(a)) has equation y=f(a)+f''(a)(x-a). The point value locates the line and the derivative
  controls its slope. Do not substitute f(a) for the slope. Numerical tables and graphs help form and check conjectures,
  but finitely many samples alone do not establish a limit. In the formal exercise, prove the exact punctured
  limit first, then cite it with derivative_from_limit. A shortcut polynomial derivative is not evidence that
  you used the requested definition.


  Before calculating, identify the original function, evaluation point, and increment separately.'
math_blocks:
- type: limit
  variable: h
  to: '0'
  direction: both
  expression: (f(a+h)-f(a))/h
  alt: Two-sided limit as h approaches 0
  linear_text: lim as h -> 0 of (f(a+h)-f(a))/h
- type: notation
  text: f'(a) = lim_{h -> 0} (f(a+h)-f(a))/h; h != 0 in the quotient
  alt: Definition of the derivative at an interior point
  linear_text: f'(a) = lim_{h -> 0} (f(a+h)-f(a))/h; h != 0 in the quotient
- type: notation
  text: y = f(a) + f'(a)*(x-a)
  alt: Tangent line using the point value and the derivative slope
  linear_text: y = f(a) + f'(a)*(x-a)
examples:
- prompt: For f(x)=x^2, find the secant slope from x=3 to x=3.2.
  solution: '6.2'
  explanation: The output change is 10.24-9=1.24 and the input change is 0.2. Divide to obtain 6.2; this is an
    average rate, not exactly f'(3).
- prompt: Use the definition to find the derivative of x^2 at 3.
  solution: '6'
  explanation: For h!=0, [(3+h)^2-9]/h=(6h+h^2)/h=6+h. Its two-sided limit is 6. The original quotient remains
    undefined at h=0.
- prompt: Find the derivative function of f(x)=x^2 using the definition.
  solution: f'(x)=2x
  explanation: At a general input x, [(x+h)^2-x^2]/h=2x+h for h!=0. Let h tend to zero with x held fixed.
- prompt: Use the definition for f(x)=-4x+7.
  solution: f'(x)=-4
  explanation: f(x+h)-f(x)=-4h. Dividing by h!=0 gives -4 on both sides; the intercept does not affect the rate.
- prompt: Find the derivative of f(x)=x^3 at -1 using first principles.
  solution: '3'
  explanation: '[(-1+h)^3-(-1)^3]/h=3-3h+h^2 for h!=0. The limit is 3, although f(-1)=-1.'
- prompt: Find the derivative of sqrt(x) at 4 by a conjugate.
  solution: 1/4
  explanation: For h!=0 near 0, [sqrt(4+h)-2]/h=1/[sqrt(4+h)+2]. The denominator approaches 4; nearby radicands
    are positive.
- prompt: Find the derivative of 1/x at 2 from the quotient.
  solution: -1/4
  explanation: '[1/(2+h)-1/2]/h=-1/[2(2+h)] for h!=0 and h!=-2. The limit at h=0 is -1/4.'
- prompt: Does abs(x) have a derivative at zero?
  solution: No finite two-sided derivative
  explanation: The quotient abs(h)/h equals -1 for h<0 and 1 for h>0. Continuity at zero does not make those limits
    equal.
- prompt: Find the tangent to y=x^2 at x=-2.
  solution: y=4-4(x+2), or y=-4x-4
  explanation: The point is (-2,4) and the derivative there is -4. Use y=f(a)+f'(a)(x-a); the output 4 is not
    the slope.
- prompt: If f(5)=12 and f'(5)=-3, use the local linear model to estimate f(5.02).
  solution: Approximately 11.94
  explanation: The input change is 0.02. The model predicts output change -3*0.02=-0.06, so 12-0.06=11.94. It
    is not an exact equality for an arbitrary f.
applications:
- title: Motion
  description: Position changes over intervals give average velocity; their local limit gives signed instantaneous
    velocity. State metres, seconds, and the coordinate direction.
- title: Sensor response
  description: A calibration curve can change slowly or quickly near an operating point. Its derivative describes
    local sensitivity, not the sensor reading itself.
- title: Local estimates
  description: Use the tangent model to estimate a nearby value while keeping the approximation sign and a sensible
    input range.
- title: Model boundaries
  description: Corners, jumps, holes, and endpoints distinguish a defined output from a finite ordinary derivative.
    Explain the failure instead of forcing a number.
