    variables:
      h:
        type: int
        min: 1
        max: 9
      t:
        type: int
        min: 0
        max: 9
      u:
        type: int
        min: 0
        max: 9
    derived:
      number: 100*h+10*t+u
      value: 100*h
    constraints: []
    answer:
      type: numeric
      value: '{value}'
    grading:
      method: exact_numeric
    difficulty: medium
    answer_mode: final_only
    work:
      mode: none
    review_policy:
      work_review: none
      mastery_requires_review_pass: false
      allow_self_review: true
    explanation_template: Hundreds have value digit times 100.
    mistake_tags:
    - place_value
