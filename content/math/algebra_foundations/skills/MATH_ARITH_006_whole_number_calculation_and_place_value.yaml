id: MATH_ARITH_006
schema_version: '0.2'
name: Whole-number calculation and place value
domain: Math
subdomain: Arithmetic
topic: Arithmetic Foundations
description: 'Whole numbers count complete units: 0, 1, 2, 3, and so on. This is an entry point; you do not
  need signed-number rules first.'
prerequisites: []
tags:
- arithmetic
- foundations
- reasoning
unlocks: []
mastery:
  passing_score: 0.8
  minimum_confidence: 3
  review_after_days_if_mastered: 7
  review_after_days_if_learning: 2
theory: 'Whole numbers count complete units: 0, 1, 2, 3, and so on. This is an entry point; you do not need
  signed-number rules first.


  Read a number by place value, not by the size of its digits. In 40,306, the 4 represents four ten-thousands,
  the 3 three hundreds, the 0 no tens, and the 6 six ones. Zero is a placeholder: 406 and 46 are different.
  Expanded notation is 40,000 + 300 + 6. A comma here separates groups of three digits; it is not a decimal
  point. To compare nonnegative whole numbers, first compare the number of digits (ignoring leading zeros),
  then compare from the left until a place differs. On a number line, larger numbers lie farther right. Zero
  counts an empty collection, not a missing answer.


  Addition combines amounts measured in the same unit. It can also describe moving forward or increasing a
  starting amount. In 278 + 156, combine ones: 8 + 6 = 14 ones. Exchange ten ones for one ten and keep four
  ones. Seven tens plus five tens plus the exchanged ten make thirteen tens: exchange ten tens for one hundred.
  The final result is 434. A carried 1 is one unit of the next place, not an extra single object. Align ones
  with ones. Adding 0 changes nothing, and the order of two addends does not change their sum.


  Subtraction can remove objects, compare two amounts, or find a missing addend. For 402 - 178, there are not
  enough ones or tens to subtract directly. Exchange one hundred into ten tens, then one of those tens into
  ten ones. The same 402 is now 3 hundreds, 9 tens and 12 ones. Subtract by place to get 224. Regrouping changes
  the representation, not the total. Check with 178 + 224 = 402. You cannot generally reverse subtraction:
  8 - 3 is not 3 - 8. In this lesson, removal calculations keep nonnegative answers; signed numbers come next.


  Multiplication counts equal groups. Four rows of six tiles give 4 times 6 = 24 tiles. Rotating the array
  shows why 6 times 4 has the same total. Decomposing an array explains distribution: 7 times 23 = 7 times
  20 + 7 times 3 = 161. The 2 in 23 represents twenty, so its partial product is 140, not 14. Multiplying by
  1 preserves an amount; multiplying by 0 gives no objects. Addition of unequal groups cannot always be replaced
  by one multiplication without further work.


  Division has two useful meanings. Sharing 24 tiles among 6 children asks how many tiles per child: 4. Grouping
  24 tiles into groups of 6 asks how many groups: also 4, but the answer has a different meaning. In a whole-number
  calculation with divisor d greater than zero, dividend = d times quotient + remainder, where 0 <= remainder
  < d. Thus 29 divided by 6 is 4 remainder 5 because 29 = 6 times 4 + 5. A remainder of 6 would make another
  full group. Dividing zero by a positive number gives zero. Division by zero is undefined: no number of zero-sized
  groups makes a positive total, and zero divided by zero would not select a unique quotient.


  A context decides what to do with a remainder. To carry 29 pupils in six-seat vehicles, four vehicles are
  insufficient: five are needed. To fill six-item sealed boxes from 29 items, only four full boxes can be sold,
  with five items left. If 29 litres can be shared continuously among six containers, each can receive 4 and
  5/6 litres. These are different questions about the same division. Read what the answer counts before rounding
  or discarding anything.


  A good calculation includes a plan, the operation, the unit, and a check. Estimate 398 + 205 as about 400
  + 200 = 600 before calculating exactly 603. Estimates detect an implausible place-value slip but are not
  exact answers. Use inverse operations to check: addition undoes subtraction, and multiplication checks division
  when the remainder is included. For a two-stage story, identify what happens first and label its intermediate
  result. Do not combine unlike units or let a keyword replace understanding. The reviewed capstone asks you
  to explain grouping and the meaning of a remainder as well as find a number.'
examples:
- prompt: Write 50,204 in expanded notation.
  solution: 50,000 + 200 + 4
  explanation: The 5 is in the ten-thousands place. Zeros preserve the empty thousands and tens places.
- prompt: 'Which is greater: 39,980 or 40,002?'
  solution: 40,002
  explanation: 'Compare the ten-thousands place first: four ten-thousands exceed three, regardless of later
    digits.'
- prompt: Calculate 278 + 156.
  solution: '434'
  explanation: 14 ones become 1 ten and 4 ones; 13 tens become 1 hundred and 3 tens; four hundreds remain.
  math_blocks:
  - type: derivation
    steps:
    - 278 + 156
    - (200 + 100) + (70 + 50) + (8 + 6)
    - 300 + 120 + 14
    - '434'
    alt: Addition regrouped by place value
    linear_text: 278 plus 156 equals 300 plus 120 plus 14, which equals 434.
- prompt: Calculate 402 - 178.
  solution: '224'
  explanation: Rewrite 402 as 3 hundreds, 9 tens, 12 ones. Subtract 1 hundred, 7 tens, 8 ones. Check 224 +
    178 = 402.
- prompt: An array has 4 rows of 6 tiles. How many tiles?
  solution: 24 tiles
  explanation: Each of four rows contributes six, so 6+6+6+6=24. Rotating the array gives six rows of four.
- prompt: Calculate 7 times 23 by decomposition.
  solution: '161'
  explanation: 7(20+3)=140+21. Both parts must be multiplied; the tens contribute 140.
- prompt: Share 24 counters equally among 6 people.
  solution: 4 counters each
  explanation: Six equal shares of four reconstruct 24. The quotient counts counters in each share.
- prompt: Put 24 counters in bags of 6. How many bags?
  solution: 4 bags
  explanation: Repeatedly remove a group of six. Here the quotient counts groups, not counters per person.
- prompt: Divide 29 by 6 as a whole-number quotient and remainder.
  solution: 4 remainder 5
  explanation: 6 times 4 + 5 = 29 and 0 <= 5 < 6. A remainder at least six would allow another group.
- prompt: A trip has 29 pupils and vehicles hold 6 pupils. How many vehicles?
  solution: 5 vehicles
  explanation: Four carry only 24. The five remaining pupils need one additional vehicle, even though it is
    not full.
applications:
- title: A shop receives 125 notebooks and then 78 more. It sells 96. How many remain?
  description: 107 notebooks First find 203 delivered, then subtract 96. Check 107 + 96 = 203.
- title: Six shelves hold 18 books each. Find the total.
  description: '108 books Six equal groups: 6(10+8)=60+48. The unit is books, not shelves.'
- title: There are 53 biscuits, with 8 in each complete gift box. How many complete boxes and leftovers?
  description: 6 boxes and 5 biscuits 53 = 8 times 6 + 5. Do not count the incomplete seventh box as complete.
- title: One walking route is 1,204 m and another is 985 m. How much longer is the first?
  description: 219 m Subtraction compares the lengths; 985 + 219 = 1,204 checks the difference.
