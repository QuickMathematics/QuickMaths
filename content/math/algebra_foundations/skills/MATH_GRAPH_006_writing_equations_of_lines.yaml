id: MATH_GRAPH_006
schema_version: 0.2
name: Writing equations of lines
domain: Math
subdomain: Linear Functions
description: Write linear equations in slope-intercept form from slope, intercept, and point information.
prerequisites:
  - MATH_GRAPH_004
tags:
  - linear_functions
  - writing_equations
  - slope_intercept_form
  - slope
  - y_intercept
  - linear_equations
unlocks:
  - MATH_SYS_001
mastery:
  passing_score: 0.8
  minimum_confidence: 3
  review_after_days_if_mastered: 7
  review_after_days_if_learning: 2
theory: |
  Writing an equation of a line means finding a rule that connects x-values to y-values.

  The most common form is slope-intercept form:

  y = mx + b

  The slope m tells how much y changes when x increases by 1. The y-intercept b tells the y-value when x = 0.

  Why it matters:
  A line equation lets you predict values, compare patterns, and graph the relationship.

  Method:
  1. Find the slope m.
  2. Find the y-intercept b.
  3. Substitute m and b into y = mx + b.
  4. If you know a point and the slope, substitute the point into y = mx + b to solve for b.
  5. Parallel lines have the same slope. Keep that slope, then use the new
     y-intercept or a point on the new line to determine b.

  Example:
  A line has slope 4 and y-intercept -7.
  Substitute into y = mx + b:
  y = 4x - 7.

  Example:
  A line has slope 3 and passes through (2, 10).
  Use y = mx + b:
  10 = 3(2) + b
  10 = 6 + b
  b = 4
  So y = 3x + 4.

  Common mistake:
  Do not use the point's y-value as the y-intercept unless the point has x = 0.
examples:
  - prompt: "Write the right-hand side of the line with slope 5 and y-intercept -2."
    solution: "5x - 2"
    explanation: "Use y = mx + b with m = 5 and b = -2."
  - prompt: "Write the right-hand side of the line with slope -3 and y-intercept 8."
    solution: "-3x + 8"
    explanation: "Use y = mx + b with m = -3 and b = 8."
  - prompt: "Write the right-hand side of the line with slope 2 through the point (4, 11)."
    solution: "2x + 3"
    explanation: "Substitute the point into y = 2x + b: 11 = 8 + b, so b = 3."
  - prompt: "Write the right-hand side of the line through (0, -6) and (1, -2)."
    solution: "4x - 6"
    explanation: "The y-intercept is -6. From x = 0 to x = 1, y increases by 4, so the slope is 4."
applications:
  - title: "Prediction"
    description: "A line equation can predict future values when a pattern changes at a constant rate."
  - title: "Graphing"
    description: "Once a line is written in slope-intercept form, it is easy to graph."
  - title: "Systems of equations"
    description: "Writing equations of lines lets learners build systems from real-world descriptions."
test:
  question_count: 8
  randomize_order: true
  questions:
    - id: WRITE_LINE_FROM_SLOPE_INTERCEPT_001
      type: generated
      prompt_template: "A line has slope {m} and y-intercept {b}. Enter only the right-hand side of the equation y = ?"
      answer_mode: final_plus_required_work
      variables:
        m:
          type: int
          min: -12
          max: 12
          exclude: [0, 1, -1]
        b:
          type: int
          min: -20
          max: 20
          exclude: [0]
      answer:
        type: expression
        value: "{m}x + {b}"
      grading:
        method: symbolic_expression
      work:
        mode: procedural_steps
        prompt: "Show each equivalent expression step, ending with the simplified final answer."
        line_type: expression
        minimum_steps: 2
        require_final_answer_match: true
      review_policy:
        work_review: auto
        mastery_requires_review_pass: false
      explanation_template: |
        Use y = mx + b.
        Substitute m = {m} and b = {b}.
        The right-hand side is {m}x + {b}.
      mistake_tags:
        - slope_error
        - y_intercept_error
        - equation_form_error
        - sign_error
      difficulty: easy

    - id: WRITE_LINE_FROM_POINT_AT_ZERO_001
      type: generated
      prompt_template: "A line has slope {m} and passes through (0, {b}). Enter only the right-hand side of the equation y = ?"
      answer_mode: final_plus_required_work
      variables:
        m:
          type: int
          min: -12
          max: 12
          exclude: [0, 1, -1]
        b:
          type: int
          min: -20
          max: 20
          exclude: [0]
      answer:
        type: expression
        value: "{m}x + {b}"
      grading:
        method: symbolic_expression
      work:
        mode: procedural_steps
        prompt: "Show each equivalent expression step, ending with the simplified final answer."
        line_type: expression
        minimum_steps: 2
        require_final_answer_match: true
      review_policy:
        work_review: auto
        mastery_requires_review_pass: false
      explanation_template: |
        A point with x = 0 is the y-intercept.
        So b = {b}.
        With slope {m}, the equation is y = {m}x + {b}.
      mistake_tags:
        - y_intercept_error
        - slope_error
        - coordinate_error
        - equation_form_error
      difficulty: easy

    - id: WRITE_LINE_FROM_SLOPE_POINT_001
      type: generated
      prompt_template: "A line has slope {m} and passes through ({x1}, {y1}). Enter only the right-hand side of the equation y = ?"
      answer_mode: final_plus_required_work
      max_attempts: 300
      variables:
        m:
          type: int
          min: -10
          max: 10
          exclude: [0, 1, -1]
        x1:
          type: int
          min: -8
          max: 8
          exclude: [0]
        b:
          type: int
          min: -20
          max: 20
          exclude: [0]
      derived:
        y1: "m * x1 + b"
      constraints:
        - "y1 != 0"
      answer:
        type: expression
        value: "{m}x + {b}"
      grading:
        method: symbolic_expression
      work:
        mode: procedural_steps
        prompt: "Show each equivalent expression step, ending with the simplified final answer."
        line_type: expression
        minimum_steps: 2
        require_final_answer_match: true
      review_policy:
        work_review: auto
        mastery_requires_review_pass: false
      explanation_template: |
        Start with y = {m}x + b.
        Substitute the point ({x1}, {y1}): {y1} = {m}({x1}) + b.
        Since {m} * {x1} = {m * x1}, b = {b}.
        The right-hand side is {m}x + {b}.
      mistake_tags:
        - slope_error
        - substitution_error
        - y_intercept_error
        - arithmetic_error
      difficulty: medium

    - id: WRITE_LINE_FROM_POINT_AND_INTERCEPT_001
      type: generated
      prompt_template: "A line has y-intercept {b} and passes through ({x1}, {y1}). Enter only the right-hand side of the equation y = ?"
      answer_mode: final_plus_required_work
      max_attempts: 300
      variables:
        m:
          type: int
          min: -10
          max: 10
          exclude: [0, 1, -1]
        b:
          type: int
          min: -20
          max: 20
          exclude: [0]
        x1:
          type: int
          min: -8
          max: 8
          exclude: [0]
      derived:
        y1: "m * x1 + b"
      constraints:
        - "y1 != 0"
      answer:
        type: expression
        value: "{m}x + {b}"
      grading:
        method: symbolic_expression
      work:
        mode: procedural_steps
        prompt: "Show each equivalent expression step, ending with the simplified final answer."
        line_type: expression
        minimum_steps: 2
        require_final_answer_match: true
      review_policy:
        work_review: auto
        mastery_requires_review_pass: false
      explanation_template: |
        The y-intercept gives b = {b}.
        Use the point to find the slope: the change from (0, {b}) to ({x1}, {y1}) matches slope {m}.
        Substitute m = {m} and b = {b}.
        The right-hand side is {m}x + {b}.
      mistake_tags:
        - slope_error
        - y_intercept_error
        - coordinate_error
        - arithmetic_error
      difficulty: medium

    - id: WRITE_LINE_PARALLEL_GIVEN_INTERCEPT_001
      type: generated
      prompt_template: "A line is parallel to y = {m}x + {b1} and has y-intercept {b2}. Enter only the right-hand side of the equation y = ?"
      answer_mode: final_plus_required_work
      variables:
        m:
          type: int
          min: -12
          max: 12
          exclude: [0, 1, -1]
        b1:
          type: int
          min: -20
          max: 20
          exclude: [0]
        b2:
          type: int
          min: -20
          max: 20
          exclude: [0]
      constraints:
        - "b1 != b2"
      answer:
        type: expression
        value: "{m}x + {b2}"
      grading:
        method: symbolic_expression
      work:
        mode: procedural_steps
        prompt: "Show each equivalent expression step, ending with the simplified final answer."
        line_type: expression
        minimum_steps: 2
        require_final_answer_match: true
      review_policy:
        work_review: auto
        mastery_requires_review_pass: false
      explanation_template: |
        Parallel lines have the same slope.
        The given line has slope {m}, so the new line also has slope {m}.
        Its y-intercept is {b2}.
        The right-hand side is {m}x + {b2}.
      mistake_tags:
        - parallel_lines
        - slope_error
        - y_intercept_error
        - equation_form_error
      difficulty: medium

    - id: WRITE_LINE_FROM_TWO_SIMPLE_POINTS_001
      type: generated
      prompt_template: "A line passes through (0, {b}) and (1, {y1}). Enter only the right-hand side of the equation y = ?"
      answer_mode: final_plus_required_work
      variables:
        m:
          type: int
          min: -10
          max: 10
          exclude: [0, 1, -1]
        b:
          type: int
          min: -20
          max: 20
          exclude: [0]
      derived:
        y1: "b + m"
      constraints:
        - "y1 != 0"
      answer:
        type: expression
        value: "{m}x + {b}"
      grading:
        method: symbolic_expression
      work:
        mode: procedural_steps
        prompt: "Show each equivalent expression step, ending with the simplified final answer."
        line_type: expression
        minimum_steps: 2
        require_final_answer_match: true
      review_policy:
        work_review: auto
        mastery_requires_review_pass: false
      explanation_template: |
        The point (0, {b}) gives the y-intercept: b = {b}.
        From x = 0 to x = 1, y changes from {b} to {y1}.
        The change is {m}, so the slope is {m}.
        The right-hand side is {m}x + {b}.
      mistake_tags:
        - coordinate_error
        - slope_error
        - y_intercept_error
        - arithmetic_error
      difficulty: hard

    - id: WRITE_LINE_FROM_TABLE_STEP_ONE_001
      type: generated
      prompt_template: "A linear table has y = {y0} when x = 0, and y = {y2} when x = 2. Enter only the right-hand side of the equation y = ?"
      answer_mode: final_plus_required_work
      variables:
        m:
          type: int
          min: -8
          max: 8
          exclude: [0, 1, -1]
        y0:
          type: int
          min: -20
          max: 20
          exclude: [0]
      derived:
        y2: "y0 + 2 * m"
      constraints:
        - "y2 != 0"
      answer:
        type: expression
        value: "{m}x + {y0}"
      grading:
        method: symbolic_expression
      work:
        mode: procedural_steps
        prompt: "Show each equivalent expression step, ending with the simplified final answer."
        line_type: expression
        minimum_steps: 2
        require_final_answer_match: true
      review_policy:
        work_review: auto
        mastery_requires_review_pass: false
      explanation_template: |
        When x = 0, y = {y0}, so the y-intercept is {y0}.
        From x = 0 to x = 2, y changes from {y0} to {y2}.
        That is a change of {2 * m} over 2 x-units, so the slope is {m}.
        The right-hand side is {m}x + {y0}.
      mistake_tags:
        - slope_error
        - y_intercept_error
        - table_error
        - arithmetic_error
      difficulty: hard

    - id: WRITE_LINE_FROM_SLOPE_POINT_NEGATIVE_INTERCEPT_001
      type: generated
      prompt_template: "A line has slope {m} and passes through ({x1}, {y1}). Enter only the right-hand side of the equation y = ?"
      answer_mode: final_plus_required_work
      max_attempts: 300
      variables:
        m:
          type: int
          min: -10
          max: 10
          exclude: [0, 1, -1]
        x1:
          type: int
          min: -8
          max: 8
          exclude: [0]
        b:
          type: int
          min: -20
          max: -2
      derived:
        y1: "m * x1 + b"
      constraints:
        - "y1 != 0"
      answer:
        type: expression
        value: "{m}x + {b}"
      grading:
        method: symbolic_expression
      work:
        mode: procedural_steps
        prompt: "Show each equivalent expression step, ending with the simplified final answer."
        line_type: expression
        minimum_steps: 2
        require_final_answer_match: true
      review_policy:
        work_review: auto
        mastery_requires_review_pass: false
      explanation_template: |
        Use y = mx + b with m = {m}.
        Substitute ({x1}, {y1}): {y1} = {m}({x1}) + b.
        Solve for b to get b = {b}.
        The right-hand side is {m}x + {b}.
      mistake_tags:
        - slope_error
        - substitution_error
        - sign_error
        - y_intercept_error
      difficulty: hard
