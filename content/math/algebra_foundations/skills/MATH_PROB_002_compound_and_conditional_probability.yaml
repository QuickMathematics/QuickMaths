  - id: PROB_COMPOUND_DISJOINT_ADDITION
    type: generated
    prompt_template: Mutually exclusive A and B have {a} and {b} outcomes, with {n} in neither. Find P(A or B).
    answer_mode: final_only
    max_attempts: 300
    variables:
      a:
        type: int
        min: 2
        max: 12
      b:
        type: int
        min: 2
        max: 12
      n:
        type: int
        min: 1
        max: 10
    derived:
      fav: a+b
      total: a+b+n
    answer:
      type: numeric
      value: '{fav}/{total}'
    grading:
      method: exact_numeric
    work:
      mode: none
    review_policy:
      work_review: none
      mastery_requires_review_pass: false
      allow_self_review: true
    explanation_template: Disjoint event counts add.
    mistake_tags:
    - calculation_error
    difficulty: medium
  - id: PROB_COMPOUND_GENERAL_ADDITION
