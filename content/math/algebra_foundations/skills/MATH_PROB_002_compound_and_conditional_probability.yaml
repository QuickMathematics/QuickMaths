id: MATH_PROB_002
schema_version: 0.2
name: Compound and conditional probability
domain: Math
subdomain: Probability
topic: Conditional Probability
description: Combine events with addition/multiplication rules, conditional probability, independence, tables, trees
  and Bayes rule.
prerequisites:
- MATH_PROB_001
tags:
- probability
- conditional_probability
- independence
unlocks:
- MATH_PROB_003
mastery:
  passing_score: 0.8
  minimum_confidence: 3
  max_guessing_allowed: maybe
  review_after_days_if_mastered: 7
  review_after_days_if_learning: 2
theory: 'Compound probability distinguishes union, intersection, conditional probability, independence, and complements.
  P(A or B)=P(A)+P(B)-P(A and B). Conditional probability changes the denominator: P(A|B)=P(A and B)/P(B). Multiplication
  gives P(A and B)=P(A)P(B|A); for independence this becomes P(A)P(B). Tree diagrams multiply along a path and add
  across qualifying paths. Without replacement changes later probabilities. Bayes reasoning reverses a condition by
  dividing the relevant joint path by all paths producing the observed event.'
examples:
  - prompt: 'A bag has 3 red and 2 blue counters. Find the probability of drawing two red without replacement.'
    solution: 'A bag has 3 red and 2 blue counters. P(two red)=(3/5)(2/4)=3/10.'
    explanation: 'Without replacement changes the second denominator.'
  - prompt: 'Given P(A)=1/2, P(B|A)=2/3, and P(B)=1/3, find P(A and B) and P(A|B).'
    solution: 'If P(A)=1/2 and P(B|A)=2/3, then P(A and B)=1/3; if P(B)=1/3, P(A|B)=1.'
    explanation: 'Multiplication finds a joint path and Bayes reasoning reverses the condition.'
applications:
  - title: 'Screening decisions'
    description: 'Conditional probability and Bayes reasoning support medical screening, fraud detection, and diagnostic decisions.'
  - title: 'Conditional risk'
    description: 'Tree diagrams and contingency tables clarify dependence and changing denominators.'
test:
  question_count: 13
  randomize_order: true
  questions:
  - id: PROB_COMPOUND_VENN_INTERSECTION
    type: fixed
    prompt_template: Among 30 cases, 6 are in both A and B. Find P(A and B).
    answer_mode: final_only
    answer:
      type: numeric
      value: 1/5
    grading:
      method: exact_numeric
    work:
      mode: none
    review_policy:
      work_review: none
      mastery_requires_review_pass: false
      allow_self_review: true
    explanation_template: 6/30=1/5.
    mistake_tags:
    - calculation_error
    difficulty: easy
  - id: PROB_COMPOUND_VENN_UNION
    type: fixed
    prompt_template: Among 30 cases, 12 are A-only, 6 in both, 8 B-only. Find P(A or B).
    answer_mode: final_plus_required_work
    answer:
      type: numeric
      value: 13/15
    grading:
      method: exact_numeric
    work:
      mode: capture_only
      prompt: Show the calculation and explain the result.
    review_policy:
      work_review: none
