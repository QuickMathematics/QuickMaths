    type: fixed
    prompt_template: What is total area under a probability density curve?
    answer_mode: final_only
    answer:
      type: numeric
      value: '1'
    grading:
      method: exact_numeric
    work:
      mode: none
    review_policy:
      work_review: none
      mastery_requires_review_pass: false
      allow_self_review: true
    explanation_template: Total probability is 1.
    mistake_tags:
    - calculation_error
    difficulty: easy
  - id: NORMAL_Z_SCORE
    type: generated
    prompt_template: A normal model has mean {mu}, SD {sigma}, and x={x}. Find z.
    answer_mode: final_plus_required_work
    max_attempts: 300
    variables:
      mu:
        type: int
        min: -20
        max: 100
      sigma:
        type: int
        min: 2
        max: 12
      z:
        type: choice
        values:
        - -3
        - -2
        - -1
        - 1
        - 2
        - 3
    derived:
      x: mu+sigma*z
    answer:
      type: numeric
      value: '{z}'
    grading:
      method: exact_numeric
    work:
      mode: capture_only
      prompt: Show the formula, substitution, and result.
    review_policy:
      work_review: none
      mastery_requires_review_pass: false
      allow_self_review: true
    explanation_template: z=(x-mu)/sigma.
