id: MATH_STAT_004
schema_version: 0.2
name: Normal distributions and z-scores
domain: Math
subdomain: Statistics
topic: Normal Distributions
description: Interpret normal density curves, z-scores, empirical-rule areas and standardized comparisons.
prerequisites:
- MATH_STAT_002
- MATH_PROB_005
tags:
- statistics
- normal_distribution
- z_scores
unlocks: []
mastery:
  passing_score: 0.8
  minimum_confidence: 3
  max_guessing_allowed: maybe
  review_after_days_if_mastered: 7
  review_after_days_if_learning: 2
theory: A normal distribution is a continuous symmetric bell-shaped model determined by mean μ and standard deviation
  σ. Probability is area, and an exact point has probability zero. Standardize with z=(x-μ)/σ and reverse with x=μ+zσ.
  The empirical rule gives about 68%,95%,99.7% within 1,2,3 SD. z-scores compare relative standing across scales.
  A normal model is questionable for strong skew, multimodality, extreme outliers, or hard boundaries near the center.
examples:
  - prompt: 'A battery life is 12.25 hours, with mean 10 and SD 1.5. Find its z-score.'
    solution: 'A battery life is normal with mean 10 hours and SD 1.5. For 12.25 hours, z=(12.25-10)/1.5=1.5.'
    explanation: 'The battery lasts 1.5 standard deviations above the mean.'
  - prompt: 'For a normal model with mean 70 and SD 8, estimate P(62<X<78).'
    solution: 'For N(70,8), P(62<X<78) is approximately the area between z=-1 and z=1, about 0.68.'
    explanation: 'Standardize both bounds, then use the empirical rule or a normal calculator.'
applications:
  - title: 'Battery-life z-scores'
    description: 'Standardize exam scores, manufacturing tolerances, or biological measurements to compare observations from different normal populations.'
  - title: 'Normal percentile cutoffs'
    description: 'Use normal areas and z-scores to set percentile cutoffs and flag unusually high or low observations.'
test:
