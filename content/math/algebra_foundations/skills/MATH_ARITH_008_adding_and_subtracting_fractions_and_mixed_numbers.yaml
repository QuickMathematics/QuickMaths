id: MATH_ARITH_008
schema_version: '0.2'
name: Adding and subtracting fractions and mixed numbers
domain: Math
subdomain: Arithmetic
topic: Arithmetic Foundations
description: Fractions count equal-sized parts of a chosen whole. Adding and subtracting them means combining
  or comparing numbers measured in the same unit. Begin with positive amounts; the signed cases later use Integer
  operations (MATH_ARITH_001).
prerequisites:
- MATH_ARITH_003
- MATH_ARITH_007
tags:
- arithmetic
- foundations
- reasoning
unlocks: []
mastery:
  passing_score: 0.8
  minimum_confidence: 3
  review_after_days_if_mastered: 7
  review_after_days_if_learning: 2
theory: 'Fractions count equal-sized parts of a chosen whole. Adding and subtracting them means combining or
  comparing numbers measured in the same unit. Begin with positive amounts; the signed cases later use Integer
  operations (MATH_ARITH_001).


  With a common denominator, the unit already matches: 2/7 + 3/7 = 5/7. Count two sevenths and three sevenths.
  The denominator stays seven because adding portions does not change the size of each portion. Likewise, 6/9
  - 2/9 = 4/9. Fractions may exceed one: 9/7 means one whole and two sevenths. A large numerator is not itself
  an error.


  Unlike denominators require a common unit. To add 1/2 and 1/3 of the same whole, split each half into three
  sixths and each third into two sixths. The amounts do not change: 1/2 = 3/6 and 1/3 = 2/6. Now count 3/6
  + 2/6 = 5/6. The incorrect answer 2/5 is smaller than 1/2 even though a positive amount was added. More fundamentally,
  adding denominators invents a new unit without preserving either original fraction. Pictures must use the
  same-sized whole: half a small pizza and a third of a large pizza cannot be combined as fractions of one
  unspecified pizza.


  A common multiple of the denominators supplies a common denominator. The least common multiple is efficient
  but not compulsory. For 1/6 + 1/4, twelfths give 2/12 + 3/12 = 5/12. Twenty-fourths give 4/24 + 6/24 = 10/24,
  the same value. Multiply both numerator and denominator by the same nonzero number to preserve a fraction;
  changing only the denominator changes its value. If one denominator divides the other, use the larger: 3/8
  + 1/4 = 3/8 + 2/8 = 5/8. Simplify your final fraction when useful. Equivalent exact fractions describe the
  same number even when written differently.


  Subtraction uses the same unit rule. For 5/6 - 1/4, write 10/12 - 3/12 = 7/12. Do not subtract denominators
  or reverse the numerator subtraction to force a positive answer. For a missing addend, subtract the known
  part from the total: 2/5 + x = 7/10 gives x = 7/10 - 4/10 = 3/10. Check by adding the result back.


  Mixed notation combines a whole number with a proper fraction. The number 2 3/5 means 2 + 3/5, not multiplication.
  Two wholes contain ten fifths, so 2 3/5 = 13/5. Conversely, 17/6 = 2 5/6 because 17 = 6 times 2 + 5. On this
  lesson''s answer line use an improper fraction such as 13/5 rather than mixed notation unless asked for just
  a whole part or numerator. This avoids ambiguity while keeping an exact answer.


  For mixed-number addition, convert first or add whole and fractional parts carefully. In 1 3/4 + 2 2/3, the
  whole parts make 3 and the fractional parts make 9/12 + 8/12 = 17/12 = 1 5/12. Combine them to obtain 4 5/12,
  or 53/12. Do not lose the extra whole created by the fractional sum.


  For mixed subtraction, exchange a whole if the first fractional part is too small. The calculation 3 1/4
  - 1 2/3 becomes 2 15/12 - 1 8/12 = 1 7/12. Exchanging a whole adds twelve twelfths to the fractional part
  while removing one from the whole part; it does not change the starting number. Subtracting the whole parts
  and then reversing the fractional subtraction is invalid. Improper fractions independently check the result:
  39/12 - 20/12 = 19/12.


  Signed fractions follow number-line addition. For -1/2 + 3/4, start at -2/4 and move three quarter-units
  right, ending at 1/4. For 1/3 - (-1/6), subtracting a negative adds a positive: 2/6 + 1/6 = 1/2. A negative
  mixed amount, minus two and one third, means -(2+1/3) = -7/3, not -2+1/3. Parentheses make the intended sign
  explicit. Review signed integers first if this section is unfamiliar.


  Interpret and check. A sum of positive fractions exceeds each addend. Subtracting a smaller positive amount
  reduces a positive starting quantity. Length, time and capacity problems need matching measurement units
  and a shared reference whole. Explain why the conversion preserves the amount, then explain the operation.
  The capstone requires equal-unit reasoning and error analysis; the number 5/6 alone does not demonstrate
  understanding.'
examples:
- prompt: Calculate 2/7 + 3/7.
  solution: 5/7
  explanation: Both count sevenths. Add their counts without changing that unit.
- prompt: Calculate 1/2 + 1/3.
  solution: 5/6
  explanation: 'Split the same whole into sixths: 3/6 + 2/6 = 5/6.'
  math_blocks:
  - type: derivation
    steps:
    - 1/2 + 1/3
    - 3/6 + 2/6
    - 5/6
    alt: Halves and thirds converted to sixths
    linear_text: One half plus one third equals three sixths plus two sixths, which equals five sixths.
- prompt: Calculate 1/6 + 1/4 using two common denominators.
  solution: 5/12
  explanation: Twelfths give 2/12+3/12; twenty-fourths give 4/24+6/24=10/24=5/12.
- prompt: Calculate 5/6 - 1/4.
  solution: 7/12
  explanation: Convert to 10/12-3/12. Subtract counts of twelfths.
- prompt: Write 2 3/5 as an improper fraction.
  solution: 13/5
  explanation: Two wholes are ten fifths; add three more fifths.
- prompt: Calculate 1 3/4 + 2 2/3.
  solution: 53/12
  explanation: 21/12+32/12=53/12, or 4 5/12. The fractional sum contributes another whole.
- prompt: Calculate 3 1/4 - 1 2/3.
  solution: 19/12
  explanation: 'Exchange a whole: 2 15/12 - 1 8/12=1 7/12. Check 39/12-20/12.'
- prompt: Calculate -1/2 + 3/4.
  solution: 1/4
  explanation: -2/4+3/4=1/4. A rightward move crosses zero.
- prompt: Calculate 1/3 - (-1/6).
  solution: 1/2
  explanation: 'Subtracting a negative adds: 2/6+1/6=3/6=1/2.'
- prompt: Find x in 2/5 + x = 7/10.
  solution: 3/10
  explanation: 7/10-4/10=3/10; adding 4/10 back checks the answer.
applications:
- title: Walk 3/4 km then 2/3 km. Find the total.
  description: 17/12 km 9/12+8/12=17/12. The total is greater than one kilometre.
- title: Pour 5/6 litre from a jug containing 2 1/4 litres. What remains?
  description: 17/12 litres 27/12-10/12=17/12. Subtract from the original capacity.
- title: Preparation takes 1/3 hour and finishing takes 1/4 hour. Total time?
  description: 7/12 hour 4/12+3/12=7/12 hour; 20+15=35 minutes checks the result.
- title: Cut 3/5 m and 1/4 m from a 2 m ribbon. What remains?
  description: 23/20 m 40/20-12/20-5/20=23/20. Subtract both cuts.
