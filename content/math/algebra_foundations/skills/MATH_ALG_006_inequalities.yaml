          min: -15
          max: 15
          exclude: [0]
        b:
          type: int
          min: 2
          max: 20
      derived:
        c: "s + b"
      answer:
        type: text
        value: "x < {s}"
      grading:
        method: inequality_solution
      work:
        mode: procedural_steps
        prompt: "Show each equivalent inequality step, ending with x isolated."
        line_type: inequality
        target_variable: x
        minimum_steps: 2
        require_final_answer_match: true
      review_policy:
        work_review: auto
        mastery_requires_review_pass: false
      explanation_template: |
        Start with x + {b} < {c}.
        Subtract {b} from both sides.
        The sign stays the same: x < {s}.
