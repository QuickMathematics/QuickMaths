id: MATH_ALG_006
schema_version: 0.2
name: Inequalities
domain: Math
subdomain: Algebra Foundations
description: Solve one-step and two-step linear inequalities without needing to reverse the inequality sign.
prerequisites:
  - MATH_ALG_002
tags:
  - algebra
  - inequalities
  - inverse_operations
  - linear_inequalities
  - comparison
  - equation_balance
  - number_line_reasoning
unlocks:
  - MATH_ALG_007
mastery:
  passing_score: 0.8
  minimum_confidence: 3
  review_after_days_if_mastered: 7
  review_after_days_if_learning: 2
theory: |
  An inequality compares two expressions using symbols such as <, >, <=, or >=.

  Solving an inequality is like solving an equation: the goal is to isolate the variable. The solution is usually a range of values, not just one number.

  Method:
  1. Undo addition or subtraction using inverse operations.
  2. Undo multiplication or division using inverse operations.
  3. Keep the inequality sign facing the same way when adding or subtracting.
  4. Keep the inequality sign facing the same way when multiplying or dividing by a positive number.
  5. Write the answer with the variable isolated.

  Example:
  Solve 3x + 4 < 19.

  3x + 4 < 19
  3x < 15
  x < 5

  Subtract 4 from both sides, then divide by positive 3. The inequality sign stays the same.

  Example:
  Solve x/4 - 6 >= 3.

  x/4 - 6 >= 3
  x/4 >= 9
  x >= 36

  Add 6 to both sides, then multiply by positive 4.

  Common mistake:
  Do not change the inequality sign unless you multiply or divide both sides by a negative number. That sign-reversal case is a separate skill.

  Another common mistake:
  The solution is a range of values. x < 5 means every number less than 5 is a solution.

  Another common mistake:
  If the variable expression is on the right, isolate x and then rewrite the final answer with x on the left.
examples:
  - prompt: "Solve: x + 7 < 12"
    solution: "x < 5"
    explanation: "Subtract 7 from both sides. The inequality sign stays the same."
  - prompt: "Solve: x - 4 >= 9"
    solution: "x >= 13"
    explanation: "Add 4 to both sides. The inequality sign stays the same."
  - prompt: "Solve: 5x <= 35"
    solution: "x <= 7"
    explanation: "Divide both sides by positive 5. The inequality sign stays the same."
  - prompt: "Solve: 2x + 3 > 15"
    solution: "x > 6"
    explanation: "Subtract 3, then divide by positive 2."
  - prompt: "Solve: x/3 - 5 <= 2"
    solution: "x <= 21"
    explanation: "Add 5, then multiply by positive 3."
  - prompt: "Solve: 4 < x + 9"
    solution: "x > -5"
    explanation: "Subtract 9 from both sides to get -5 < x, then rewrite as x > -5."
applications:
  - title: "Real-life limits"
    description: "Inequalities model limits such as budgets, minimum scores, age requirements, and capacity."
  - title: "Number lines"
    description: "Solving inequalities connects algebra to shaded regions on a number line."
  - title: "Linear constraints"
    description: "Inequalities are the foundation for constraints in graphing, systems, optimization, and programming."
  - title: "Decision rules"
    description: "Inequalities describe when a value is allowed, too small, too large, or within a limit."
