- src: media/native-number-foundations/arith012-reverse.svg
  alt: An arrow divides a final 80 dollar price by 0.80 to recover the original 100 dollar price.
  caption: Reverse the multiplier instead of subtracting from the final value.
  width: 800
  height: 360
  fit: contain
