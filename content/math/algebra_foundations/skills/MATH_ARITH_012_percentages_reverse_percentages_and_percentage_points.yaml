id: MATH_ARITH_012
schema_version: '0.2'
name: Percentages, reverse percentages and percentage points
domain: Math
subdomain: Arithmetic
topic: Arithmetic Foundations
description: A percent is a rate per hundred. The symbol % means divide by 100, so 20% = 20/100 = 0.20 = 1/5.
  A percentage can describe a part of a reference base, a change from an earlier value, or a comparison b
prerequisites:
- MATH_ARITH_005
- MATH_ARITH_009
unlocks: []
tags:
- arithmetic
- percentages
- reverse_percentages
- percentage_points
- reference_base
mastery:
  passing_score: 0.8
  minimum_confidence: 3
  max_guessing_allowed: maybe
  review_after_days_if_mastered: 7
  review_after_days_if_learning: 2
theory: 'A percent is a rate per hundred. The symbol % means divide by 100, so 20% = 20/100 = 0.20 = 1/5. A
  percentage can describe a part of a reference base, a change from an earlier value, or a comparison between
  two groups. Always name the base: 20% of 80 is 16, while 20% of 200 is 40. The same percent does not mean
  the same number when the base changes.


  To find p% of an amount A, multiply A by p/100. For 15% of 60, use 0.15×60=9. To find what percent a part
  B is of a base A, divide B by A and multiply by 100: 18 is 30% of 60 because 18/60=0.30. A percent increase
  from old value O to new value N is (N−O)/O×100%; the old value is the reference base. A decrease uses the
  same formula with the signed change or with O−N as a positive decrease.


  Percent change is not the same as percentage points. If a survey share moves from 40% to 55%, the increase
  is 15 percentage points because 55−40=15. Relative percent change is 15/40×100%=37.5%, because the original
  40% is the base. Say which one you mean. A move from 0.40 to 0.55 can be described as +0.15 in proportion
  units, +15 percentage points, or a 37.5% relative increase.


  A forward percentage change uses a multiplier. Increasing by r% multiplies the old amount by 1+r/100; decreasing
  by r% multiplies it by 1−r/100. An 80% result after a 20% decrease came from 100 because 100×0.80=80. Two
  successive changes multiply their factors: a 20% increase then a 20% decrease gives 1.20×0.80=0.96, a net
  4% decrease. The percentages act on different intermediate bases, so “up 20 then down 20” does not cancel.


  Reverse percentages undo the multiplier. If a final value F is after an r% increase, original O=F/(1+r/100).
  If F is after an r% decrease, O=F/(1−r/100). Do not subtract r% of the final value when reversing a change;
  the final value is not the original reference base. For a 20% discount, a sale price of $80 means O=$80/0.80=$100.
  The check is to apply the stated change forward and recover $80.


  Percentage points are especially useful for rates, probabilities, and survey shares. A tax rate moving from
  5% to 6% rises 1 percentage point, but its relative increase is 20% because 1/5=0.20. A percentage point
  is an absolute difference between percentages; percent change is a ratio of a difference to a base. Keep
  the percent sign attached to rates and use a separate unit such as “points” when comparing them.


  Rounding can enter at the final display, but keep the unrounded multiplier while calculating. A discount
  of 12.5% is exactly one eighth, so multiplying by 0.875 may be clearer than subtracting a rounded dollar
  amount. In a context, identify whether the question asks for the percent, the percentage amount, the final
  value, or the original value. Label the reference base and check by reversing the operation. The capstone
  asks you to recover an original price from a reduction and to explain why the final price cannot be used
  as the base for a simple subtraction.

  A percentage amount and a percentage rate should be kept separate. Saying “the discount is 20%” gives a rate;
  saying “the discount is $16” gives an amount for a particular base. To compute the amount, multiply the rate
  by the base. To compare two discounts, compare both their rates and the bases they act on. A $16 discount
  could be 20% of $80 or 8% of $200, so the dollar amount alone does not identify the percentage.


  Repeated changes are easiest to audit by naming each base. Start with O, apply the first multiplier to get
  an intermediate value, then apply the second multiplier to that intermediate value. If a quantity decreases
  by 10% three times, the multiplier is 0.9³, not 0.7; “30% total” would be a different policy. Reverse each
  multiplier in reverse order if you need to recover an original after several stages. For a final rate, also
  distinguish a percentage-point change from a percent change in the rate itself, especially when the old rate
  is small.

  '
examples:
- prompt: Find 20% of 80.
  solution: '16'
  explanation: 0.20×80=16.
- prompt: What percent of 60 is 18?
  solution: 30%
  explanation: 18÷60×100%=30%.
- prompt: A value rises from 40 to 50. Percent increase?
  solution: 25%
  explanation: (50−40)/40×100%=25%.
- prompt: A survey share rises from 40% to 55. What is the change in percentage points?
  solution: 15 percentage points
  explanation: 'Subtract the rates: 55−40=15 points.'
- prompt: What is the relative percent increase from 40% to 55%?
  solution: 37.5%
  explanation: 15/40×100%=37.5%.
- prompt: Increase 120 by 10%.
  solution: '132'
  explanation: 120×1.10=132.
- prompt: Decrease 120 by 10%.
  solution: '108'
  explanation: 120×0.90=108.
- prompt: A 20% reduction leaves $80. Original price?
  solution: $100
  explanation: 80÷0.80=100; reducing 100 by 20% gives 80.
- prompt: Apply +20% then −20% to 100.
  solution: '96'
  explanation: 100×1.20×0.80=96, a net 4% decrease.
- prompt: A rate moves from 5% to 6%. Relative increase?
  solution: 20%
  explanation: The one-point increase is 1/5 of the original 5% rate.
applications:
- title: Sales and tax
  description: Discounts and tax rates use multipliers, while reverse percentages recover an original listed
    price.
- title: Survey reporting
  description: Percentage points describe changes in shares, and relative percent change compares that difference
    to the starting share.
- title: Growth and depreciation
  description: Repeated percentage changes multiply successive bases, so a later change cannot be treated as
    if the base stayed fixed.
- title: Health and risk communication
  description: Risk percentages are meaningful only with a stated reference population or baseline rate.
