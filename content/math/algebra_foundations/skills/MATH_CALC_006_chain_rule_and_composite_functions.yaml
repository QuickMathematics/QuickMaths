id: MATH_CALC_006
schema_version: '0.2'
name: The chain rule and composite functions
domain: Math
subdomain: Calculus
topic: Differentiation
description: Differentiate nested power, reciprocal, and square-root functions; combine rules, match outer derivative
  inputs, and preserve function and derivative domains.
prerequisites:
- MATH_CALC_004
- MATH_CALC_005
- MATH_FUNC_004
- MATH_RAD_001
unlocks: []
tags:
- calculus
- derivatives
- reasoning
- graph_interpretation
- domain_restrictions
mastery:
  passing_score: 0.8
  minimum_confidence: 3
  max_guessing_allowed: maybe
  review_after_days_if_mastered: 7
  review_after_days_if_learning: 2
theory: 'A composite function applies one operation to the result of another. Its derivative is therefore a rate
  through two linked stages. This lesson connects the function-composition work you already know to differentiation.
  We start with powers of affine and polynomial expressions, then include reciprocals and explicitly explained
  square roots. Exponential, logarithmic, and trigonometric derivative rules are not assumed here.


  Inner and outer functions:

  For y=(3x+2)^4, choose u=g(x)=3x+2 and f(u)=u^4. The outer derivative is f''(u)=4u^3 and the inner derivative
  is g''(x)=3. The chain rule gives (f composed with g)''(x)=f''(g(x))*g''(x)=12(3x+2)^3. Evaluate the outer derivative
  at the inner output, not at x by default. Forgetting the factor 3 changes the rate.


  Hypotheses:

  At an input a, g must be differentiable at a and f must be differentiable at g(a). The composition must also
  be meaningful on the relevant nearby inputs. The formula is a sufficient-condition rule; failure of one hypothesis
  means this route does not apply automatically, not that no specially simplified composite can ever be differentiable.
  Check the point at which each component is evaluated.


  Why rates multiply:

  A small input change delta x produces approximately g''(a)*delta x change in the inner output. Near g(a), the
  outer function converts a small inner-output change into approximately f''(g(a)) times that change. Combining
  the local linear approximations gives f''(g(a))*g''(a)*delta x. This is the intuitive reason for multiplication.
  It is not an instruction to cancel derivative symbols without hypotheses, and a full proof must handle zero
  inner changes as well.


  Power composites:

  For [g(x)]^n with positive integer n, the derivative is n*[g(x)]^(n-1)*g''(x). For (x^2+4)^3 it is 3(x^2+4)^2*(2x)=6x(x^2+4)^2.
  Do not replace the exponent by n-1 and forget either multiplier. Factored answers are often clearer than a long
  expansion. A small polynomial example can be checked by expansion as an independent calculation, but expansion
  becomes inefficient for a high outer power.


  More than two layers:

  For [(2x+1)^2+3]^2, work from outside inward. The derivative is 2[(2x+1)^2+3] times 2(2x+1) times 2. Each stage
  has its own input. Keep the original inner expressions in place while differentiating one layer at a time. A
  dependency sketch with named intermediate quantities can prevent evaluating a derivative at the wrong point.


  The square-root outer rule:

  For positive u, the derivative of sqrt(u) is 1/[2sqrt(u)], as the conjugate difference-quotient calculation
  shows. Thus sqrt(g(x)) has derivative g''(x)/[2sqrt(g(x))] wherever g is differentiable and g(x)>0. For sqrt(3x+1),
  the function is defined for x>=-1/3, but this rule gives a finite ordinary derivative only for x>-1/3. At x=1
  the derivative is 3/4. A function domain and a derivative domain need not be identical.


  Special boundary behavior:

  The requirement g(x)>0 belongs to this sufficient formula. At a zero of g, analyze the particular function rather
  than declare every possibility identical. For example, sqrt(x^2)=abs(x), which has a corner at zero. In contrast,
  sqrt(x^4)=x^2 is differentiable there. Do not divide by sqrt(0) in either case. This distinction prevents a
  formal-looking formula from being used outside its hypotheses.


  Reciprocal composites:

  The derivative of 1/g(x) is -g''(x)/[g(x)]^2 where g(x)!=0 and g is differentiable. It follows either from the
  quotient rule with numerator 1 or from the chain rule using the reciprocal outer function. For 1/(2x+5), the
  derivative is -2/(2x+5)^2 for x!=-5/2. The original pole remains excluded even when later algebra cancels a
  factor in a larger expression.


  Combining rules:

  For x*(x^2+1)^3, the top-level operation is multiplication, so start with the product rule. The derivative is
  (x^2+1)^3+x*3(x^2+1)^2*(2x). Chain-rule work occurs inside the second product term. For a quotient whose denominator
  is a composite power, use the quotient rule at the top level and the chain rule to differentiate that denominator.
  Naming the top-level operation is often the most useful first step.


  Tables and contexts:

  Suppose g(2)=5, g''(2)=3, f''(5)=7, and f''(2)=11. The derivative of f(g(x)) at 2 is 7*3=21, not 11*3. The value
  5 tells us where to look up the outer derivative. If depth changes in metres per second and temperature changes
  in degrees per metre at that depth, multiplying the rates gives degrees per second. Units make the input-output
  link visible, but the rates must refer to the same location and instant.


  Graphs, interpretation, and self-check:

  A graph of the composite can help check the sign and approximate scale of a derivative. It cannot justify an
  unstated domain extension. Keep the derivative function distinct from its value at a point, and the function''s
  value distinct from both. Explain the inner and outer functions, check where the rule applies, form the derivative,
  then substitute. The formal reference uses a nested square-root composite with an exact positive radicand. Its
  certificate verifies the mathematical conclusion, while the separate reviewed task assesses your explicit chain-rule
  explanation and domain reasoning. There is no claim that a generic certificate enforces an unrestricted teaching-method
  rubric.'
math_blocks:
- type: notation
  text: (f composed with g)'(x) = f'(g(x))*g'(x)
  alt: Chain rule with the outer derivative evaluated at the inner output
  linear_text: (f composed with g)'(x) = f'(g(x))*g'(x)
- type: fraction
  numerator: g'(x)
  denominator: 2*sqrt(g(x))
  alt: Square-root composite derivative where g(x) is positive
  linear_text: (g'(x))/(2*sqrt(g(x)))
examples:
- prompt: Differentiate (3x+2)^4.
  solution: 12(3x+2)^3
  explanation: 'Outer derivative: 4u^3. Inner derivative: 3. Substitute u=3x+2 and multiply.'
- prompt: Differentiate (x^2+4)^3.
  solution: 6x(x^2+4)^2
  explanation: Differentiate the outer cube, retain its inner expression, then multiply by 2x.
- prompt: Differentiate [(2x+1)^2+3]^2.
  solution: 8(2x+1)*[(2x+1)^2+3]
  explanation: The three factors are 2[(2x+1)^2+3], 2(2x+1), and 2. All stages contribute.
- prompt: Differentiate 1/(2x+5).
  solution: -2/(2x+5)^2, x!=-5/2
  explanation: The reciprocal outer derivative supplies the minus sign and squared denominator; the inner derivative
    supplies 2.
- prompt: Differentiate sqrt(3x+1) and evaluate at 1.
  solution: 3/[2sqrt(3x+1)] for x>-1/3; value 3/4
  explanation: The inner derivative is 3. The positive radicand condition gives the derivative domain; the function
    itself also includes the endpoint -1/3.
- prompt: Differentiate sqrt(x^2+5).
  solution: x/sqrt(x^2+5)
  explanation: The inner derivative is 2x. Divide by 2sqrt(x^2+5). The radicand is positive for every real x,
    so this derivative has no real-domain gap.
- prompt: Given g(2)=5, g'(2)=3, f'(5)=7, f'(2)=11, find (f composed with g)'(2).
  solution: '21'
  explanation: 'Use the outer derivative at g(2)=5: 7*3. The listed f''(2) is a distractor.'
- prompt: Differentiate x*(x^2+1)^3.
  solution: (x^2+1)^3+6x^2(x^2+1)^2
  explanation: The outermost operation is a product. Differentiate its second factor by the chain rule inside
    the second product term.
- prompt: Differentiate (x^2+1)/(x^2+4)^2.
  solution: '[2x(x^2+4)^2-4x(x^2+1)(x^2+4)]/(x^2+4)^4'
  explanation: The denominator derivative is 4x(x^2+4). The original denominator is positive on all reals. Simplification
    is optional, but parentheses are essential.
- prompt: Depth increases at 2 m/s, and temperature changes at -0.5 degrees per metre at that depth. Find the
    temperature rate.
  solution: -1 degree per second
  explanation: Compose temperature with depth and multiply the two matching local rates. A negative result means
    temperature decreases as time increases.
applications:
- title: Linked measurements
  description: Compose a physical quantity with a changing position or time-dependent input. Multiply matching
    local rates and check units.
- title: Calibration chains
  description: An input conversion followed by a nonlinear calibration has two derivative factors, evaluated at
    the correct stages.
- title: Nested geometric models
  description: A dimension depending on an input can sit inside an area or other power model. Identify the nested
    structure before differentiating.
- title: Domain-aware prediction
  description: A square-root composite may include an endpoint in its function domain but exclude it from its
    finite derivative domain. Local models must respect this distinction.
