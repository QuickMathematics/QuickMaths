  review_after_days_if_learning: 2
theory: 'The derivative definition explains what a derivative means. Differentiation rules let us calculate efficiently
  once that meaning is established. This lesson develops constant, constant-multiple, sum, difference, and nonnegative
  integer-power rules. Its functions are polynomials, so their domains and derivative domains are all real numbers.
  Products of nonconstant functions, quotients with variable denominators, and unexpanded nested functions belong
  to later lessons.



  Constants and identity:

  A constant function f(x)=c has derivative zero because f(a+h)-f(a)=c-c=0 for every permitted increment. The
  identity function f(x)=x has derivative one because its output change equals its input change. Consequently
  an affine function mx+b has derivative m. Here m and b are constant with respect to x. Saying that a letter
  is constant must be part of the problem, not a guess based on its appearance.



  The power rule:

  For a positive integer n, the derivative of x^n is n*x^(n-1). The exponent becomes a coefficient and then decreases
  by one. For x^5 this produces 5x^4, not x^4, 5x^5, or x^6. For n=1 the result is one. Handle an explicitly constant
  function separately rather than mechanically writing 0*x^(-1) and creating an artificial exception at zero.
  The constant-one function has derivative zero at every real input.



  Why the rule is reasonable:

  The definition for x^n starts with [(a+h)^n-a^n]/h. In the binomial expansion, the a^n terms cancel. The next
  term is n*a^(n-1)*h; every remaining term contains at least h^2. Dividing for h!=0 leaves n*a^(n-1) plus terms
  containing h, which approach zero. This explains both the coefficient n and the reduced exponent. The rules
  are connected to limits, not a new meaning of equality.



  Constant multiples and addition:

  The derivative of c*f(x) is c*f''(x) when c is constant. The derivative of f(x)+g(x) is f''(x)+g''(x), and subtraction
  works similarly, provided the component derivatives exist at the point. These statements follow by distributing
  the difference quotient and applying finite-limit laws. Preserve coefficients and signs before simplifying.
  For 4x^3-5x+8, the derivative is 12x^2-5. The constant 8 disappears, but the coefficient 4 does not.



  An organized calculation:

  Identify the variable first. Split a polynomial into terms with their signs. Differentiate each term using a
  stated rule. Combine the derivative terms, then evaluate at a point if requested. For p(t)=2t^4-3t^2+7, p''(t)=8t^3-6t.
  At t=-1, this is -8+6=-2. Substituting into p itself gives a position or output, not a rate. Substituting too
  early can erase the variable and lead to differentiating an already evaluated constant.



  Representation matters:

  Some expressions become polynomials after a justified expansion. To differentiate (x+3)^2 without a chain rule,
  first expand it to x^2+6x+9, then differentiate to 2x+6. Likewise x^2/4 is (1/4)*x^2, so its derivative is x/2.
  Division by a nonzero numerical constant is only constant multiplication. This does not license differentiating
  x^2/(x+4) by ignoring the variable denominator.



  Derivative values and tangent lines:

  Once a derivative function is known, evaluate it at the required input. For f(x)=x^3 at x=2, f(2)=8 and f''(2)=12,
  so the tangent is y=8+12(x-2). Its intercept is not obtained by confusing the input, output, and slope. A tangent
  formula should pass through the original point and use the derivative slope. Equivalent expanded and point-slope
  expressions describe the same line.



  Graphs and stationary points:

  Where a smooth graph slopes upward its derivative is positive, and where it slopes downward its derivative is
  negative. A stationary point has derivative zero. Solve f''(x)=0 to find candidates, not f(x)=0. For x^2-4x+1
  the stationary input is 2, while the function''s roots are different. A zero derivative at one point does not
  prove that the function is constant or that a maximum or minimum occurs there. The function x^3 has derivative
  zero at zero but keeps increasing through it. Classifying extrema rigorously is a later lesson.



  Parameter and data problems:

  Differentiation can determine an unknown constant. If f(x)=k*x^3 and f''(2)=36, then 12k=36 and k=3. When only
  derivative data are given, use the linearity rules directly: if f''(a)=u and g''(a)=v, then the derivative of
  2f-3g at a is 2u-3v. No formula for f or g is needed. However, function values cannot substitute for derivative
  values.



  Units and communication:

  If a model gives distance in metres at time t seconds, its derivative is in metres per second. A constant offset
  changes the position graph but not the velocity. Multiplying every output by a constant multiplies its derivative
  by that same constant. Explain the operation being used rather than writing f=f'', which is generally false.
  Algebraic equalities connect equivalent derivative expressions only after the differentiation step has been
  justified.



  Scope and self-check:

  Ask whether every exponent is an allowed integer, whether coefficients are constant, whether signs survived,
  and whether the question wants a function, a value, or a tangent. General rational powers and transcendental
  functions require additional hypotheses or rules. The formal polynomial exercise checks the stated derivative
  mathematically; the separately reviewed capstone checks your explanation and interpretation. Neither an answer-key
  phrase nor unexplained working establishes those objectives.'
math_blocks:
- type: notation
  text: d(x^n)/dx = n*x^(n-1) for integers n >= 1; d(c)/dx = 0
  alt: Integer power and constant differentiation rules
  linear_text: d(x^n)/dx = n*x^(n-1) for integers n >= 1; d(c)/dx = 0
- type: notation
  text: (a*f+b*g)' = a*f' + b*g' for constants a,b
  alt: Constant-multiple and sum rules
  linear_text: (a*f+b*g)' = a*f' + b*g' for constants a,b
examples:
- prompt: Differentiate f(x)=9.
  solution: '0'
  explanation: The output change is zero for every input change. The derivative of a constant is not the constant
    itself.
- prompt: Differentiate f(x)=x^5.
  solution: 5x^4
  explanation: 'Use the positive-integer power rule: multiply by 5 and reduce the exponent to 4.'
- prompt: Differentiate f(x)=-3x^4+2x-8.
  solution: -12x^3+2
  explanation: Keep each term's sign. Differentiate -3x^4, 2x, and -8 separately; the last term contributes zero.
- prompt: Differentiate p(t)=t^3/4-2t^2.
  solution: p'(t)=3t^2/4-4t
  explanation: The denominator 4 is a fixed coefficient. The variable is t, and both terms retain their numerical
    multipliers.
- prompt: For f(x)=2x^3-x^2+7, find f'(-2).
  solution: '28'
  explanation: 'First obtain f''(x)=6x^2-2x. Substitute -2 afterward: 6*4+4=28. Evaluating f(-2) answers a different
    question.'
- prompt: Differentiate (x+3)^2 without using the chain rule.
  solution: 2x+6
  explanation: Expand to x^2+6x+9, then apply the power, sum, and constant rules. This works because expansion
    preserves the polynomial on all real inputs.
- prompt: At a point a, f'(a)=4 and g'(a)=-2. Find the derivative of 3f-5g at a.
  solution: '22'
  explanation: Linearity gives 3*4-5*(-2)=22. The values f(a) and g(a) are not needed for this sum.
- prompt: For f(x)=kx^3 with constant k, f'(2)=36. Find k.
  solution: '3'
  explanation: f'(x)=3kx^2, so f'(2)=12k. Solve 12k=36.
- prompt: Find the stationary input of x^2-4x+1.
  solution: x=2
  explanation: Its derivative is 2x-4. Set that derivative equal to zero. The equation f(x)=0 would instead find
    intercepts.
- prompt: Find the tangent to y=x^3 at x=2.
  solution: y=8+12(x-2)
  explanation: Use the point value f(2)=8 and slope f'(2)=12. A zero derivative elsewhere would not make the entire
    curve constant.
applications:
- title: Polynomial motion
  description: Differentiate a polynomial position model without confusing an output offset with a velocity contribution.
- title: Superposed effects
  description: For a sum of differentiable components, their local rates add. Constant multipliers retain their
    units and signs.
- title: Sensitivity to input
  description: Evaluate a derivative at the actual operating input before interpreting how rapidly the output
    changes.
- title: Stationary candidates
  description: Solve a derivative equation to locate horizontal-tangent candidates. Reserve classification and
    global comparisons for the later optimization lesson.
