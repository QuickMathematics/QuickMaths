id: MATH_CALC_004
schema_version: '0.2'
name: Power, constant, and sum rules
domain: Math
subdomain: Calculus
topic: Differentiation
description: Differentiate real polynomials using justified elementary rules, evaluate rates and tangents, and
  distinguish stationary inputs from roots and extrema.
prerequisites:
- MATH_CALC_003
- MATH_POLY_001
- MATH_POLY_002
unlocks:
- MATH_CALC_005
- MATH_CALC_006
tags:
- calculus
- derivatives
- reasoning
- graph_interpretation
- domain_restrictions
