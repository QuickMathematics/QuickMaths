theory: |
  Fractions, decimals, and percents are three ways to describe parts of a whole.

  A decimal uses place value.
  A percent means "out of 100."
  A fraction compares a numerator to a denominator.

  Why it matters:
  These forms show up in money, discounts, grades, data, probability, slope, and measurement. Converting between them helps you choose the form that is easiest to use.

  Key facts:
  - 0.25 = 25/100 = 25%
  - 0.5 = 1/2 = 50%
  - 0.75 = 3/4 = 75%
  - 1.0 = 1 = 100%
  - 1.25 = 125/100 = 125%

  Method:
  1. Decimal to percent: multiply by 100.
  2. Percent to decimal: divide by 100.
  3. Percent to fraction: write it over 100, then simplify if needed.
  4. Fraction to decimal: divide the numerator by the denominator.
  5. Fraction to percent: convert to a decimal and multiply by 100, or make an equivalent fraction with denominator 100.
  6. To find a percent of a number, write the percent as a decimal or fraction and multiply.
  7. To find what percent one number is of another, divide part by whole, then multiply by 100.

  Percent calculation methods:
  There are often several valid ways to show percent work.

  Decimal method:
  25% of 80 = 0.25 * 80 = 20.

  Fraction method:
  25% of 80 = 25/100 * 80 = 1/4 * 80 = 20.

  Proportion method:
  x/80 = 25/100, so x = 20.

  Common mistake:
  Do not forget that percent means out of 100. For example, 8% is 0.08, not 0.8.

  Another common mistake:
  Moving the decimal the wrong direction changes the value by a factor of 100. For example, 0.6 = 60%, but 0.06 = 6%.
examples:
  - prompt: "Convert 0.37 to a percent."
    solution: "37%"
    explanation: "Multiply by 100: 0.37 becomes 37%."
  - prompt: "Convert 0.08 to a percent."
    solution: "8%"
    explanation: "0.08 means 8 hundredths, so it is 8%."
  - prompt: "Convert 1.25 to a percent."
    solution: "125%"
    explanation: "Multiply by 100: 1.25 becomes 125%."
  - prompt: "Convert 42% to a decimal."
    solution: "0.42"
    explanation: "Divide by 100: 42% = 42/100 = 0.42."
  - prompt: "Convert 8% to a decimal."
    solution: "0.08"
    explanation: "8% means 8 out of 100, so 8% = 0.08."
  - prompt: "Convert 3/4 to a decimal."
    solution: "0.75"
    explanation: "3 divided by 4 is 0.75."
  - prompt: "Convert 0.6 to a fraction."
    solution: "3/5"
    explanation: "0.6 = 6/10, and 6/10 simplifies to 3/5."
  - prompt: "Find 25% of 80."
    solution: "20"
    explanation: "25% = 1/4, and 1/4 of 80 is 20."
  - prompt: "What percent of 80 is 20?"
    solution: "25%"
    explanation: "20/80 = 0.25 = 25%."
applications:
  - title: "Money and discounts"
    description: "Percents are used for sales tax, tips, interest, and discounts."
  - title: "Grades and data"
    description: "Scores and statistics are often reported as percents or decimals."
  - title: "Probability"
    description: "Probabilities can be written as fractions, decimals, or percents depending on the context."
  - title: "Scaling and rates"
    description: "Percent calculations help compare parts, wholes, increases, decreases, and rates."
