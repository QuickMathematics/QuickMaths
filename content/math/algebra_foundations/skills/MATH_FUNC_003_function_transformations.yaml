  - id: FUNC_TRANS_MAPPING_PROOF_001
    type: fixed
    prompt_template: Let f(u) = v, a != 0, b != 0, and g(x) = a f(b(x - h)) + k. Which point corresponds
      to (u, v)? Justify the mapping.
    difficulty: hard
    answer_mode: final_plus_required_work
    variables: {}
    derived: {}
    constraints: []
    answer:
      type: choice
      value: B
    grading:
      method: multiple_choice
    work:
      mode: proof_obligations
      prompt: Give a complete argument. Your short answer alone is not a proof.
      proof_policy:
        obligations:
        - Sets the inside expression b(x - h) equal to the old input u.
        - Uses b != 0 to solve for the new input h + u/b.
        - Substitutes that new input into g and uses f(u) = v.
        - Obtains the new output a*v + k and explains why a negative b reverses horizontal orientation.
        accepted_strategies:
        - direct algebraic argument
        - point mapping with explicit domain checks
    review_policy:
      work_review: tutor_required
      mastery_requires_review_pass: true
      allow_self_review: false
    explanation_template: To use the old function value v, require b(x - h) = u. Solving gives x = h +
      u/b. Substituting into g gives a*f(u) + k = a*v + k.
    mistake_tags:
    - point_mapping
    - transformation_proof
    options:
    - id: A
      label: (u/b - h, a*(v + k))
    - id: B
      label: (h + u/b, a*v + k)
    - id: C
      label: (b*(u - h), a*v + k)
    - id: D
      label: (h + b*u, v/a + k)
