      xbar:
        type: int
        min: 20
        max: 100
      tstar:
        type: choice
        values:
        - 1.8
        - 2
        - 2.2
        - 2.4
      root:
        type: choice
        values:
        - 2
        - 3
        - 4
        - 5
        - 6
      se:
        type: int
        min: 1
        max: 5
    derived:
      n: root**2
      s: se*root
      margin: tstar*se
      upper: round((xbar+margin)*1000)/1000
    answer:
      type: numeric
      value: '{upper}'
    grading:
      method: numeric_with_tolerance
      tolerance: 0.0011
    work:
      mode: none
