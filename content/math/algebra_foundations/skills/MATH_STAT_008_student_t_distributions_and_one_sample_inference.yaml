        min: 1
        max: 5
    derived:
      n: root**2
      s: se*root
      margin: tstar*se
      lower: round((xbar-margin)*1000)/1000
    answer:
      type: numeric
      value: '{lower}'
    grading:
      method: numeric_with_tolerance
      tolerance: 0.0011
    work:
      mode: none
    review_policy:
      work_review: none
      mastery_requires_review_pass: false
      allow_self_review: true
    explanation_template: Subtract margin.
    mistake_tags:
    - calculation_error
    difficulty: medium
  - id: T_INTERVAL_UPPER
    type: generated
    prompt_template: xbar={xbar}, t*={tstar}, s={s}, n={n}. Find upper endpoint.
    answer_mode: final_only
    max_attempts: 300
