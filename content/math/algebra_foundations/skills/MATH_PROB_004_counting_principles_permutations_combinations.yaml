id: MATH_PROB_004
schema_version: 0.2
name: Counting principles, permutations, and combinations
domain: Math
subdomain: Probability
topic: Counting and Combinatorics
description: Count multistage outcomes and distinguish ordered arrangements from unordered selections.
prerequisites:
- MATH_PROB_002
- MATH_ARITH_004
tags:
- probability
- combinatorics
unlocks:
- MATH_PROB_005
mastery:
  passing_score: 0.8
  minimum_confidence: 3
  max_guessing_allowed: maybe
  review_after_days_if_mastered: 7
  review_after_days_if_learning: 2
theory: Counting begins by defining what one outcome records. The fundamental counting principle multiplies choices
  across successive stages. If repetition is allowed in k positions with n symbols, there are n^k strings. Factorials
  count arrangements. Permutations count ordered selections nPr=n!/(n-r)!, while combinations count unordered selections
  nCr=n!/[r!(n-r)!]. Repeated identical objects require division by repeated factorials. “At least one” events are
  often easiest by complement counting.
examples:
  - prompt: 'How many ordered 3-letter arrangements can be made from 5 distinct letters when letters cannot repeat?'
    solution: 'The ordered 3-letter arrangements from 5 distinct letters number 5P3=5*4*3=60.'
    explanation: 'Use permutations when order changes the outcome.'
  - prompt: 'How many unordered committees of 2 can be chosen from 6 people?'
    solution: 'Choosing 2 committee members from 6 gives 6C2=6*5/(2*1)=15.'
    explanation: 'Use combinations when the selected group has no order.'
applications:
  - title: 'Schedules and committees'
    description: 'Counting principles estimate password spaces, schedules, routes, and committee selections.'
  - title: 'Search-space counting'
    description: 'Distinguishing order and repetition prevents systematic overcounting.'
