  minimum_confidence: 3
  review_after_days_if_mastered: 7
  review_after_days_if_learning: 2
theory: |
  A one-step equation can usually be solved with one inverse operation.

  The goal is to isolate the variable. Whatever operation is being applied to x, undo it by applying the inverse operation to both sides of the equation.

  Why it matters:
  One-step equations are the foundation for solving more complicated equations. Every longer equation is solved by using these same balance moves repeatedly.

  Common inverse operations:
  - Addition is undone by subtraction.
  - Subtraction is undone by addition.
  - Multiplication is undone by division.
  - Division is undone by multiplication.

  Method:
  1. Identify the operation being done to the variable.
  2. Use the inverse operation on both sides.
  3. Keep the equation balanced.
  4. Write the variable alone.
  5. Check by substituting your answer into the original equation.

  Example:
  Solve x + 9 = 14.

  x + 9 = 14
  x = 5

  Subtract 9 from both sides.

  Example:
  Solve -4x = 20.

  -4x = 20
  x = -5

  Divide both sides by -4.

  Example:
  Solve x/3 = -4.

  x/3 = -4
  x = -12

  Multiply both sides by 3.

  Common mistake:
  Keep the equation balanced. Whatever you do to one side, you must do to the other side.

  Another common mistake:
  Do not ignore negative signs. Dividing by a negative changes the sign of the result.

  Another common mistake:
  If the variable is on the right side, the solution method is the same. You can still isolate x, then write the answer as x = value.
examples:
  - prompt: "Solve: x + 5 = 12"
    solution: "x = 7"
    explanation: "Subtract 5 from both sides."
  - prompt: "Solve: x + (-8) = 3"
    solution: "x = 11"
    explanation: "Adding -8 means subtracting 8, so add 8 to both sides."
  - prompt: "Solve: x - 6 = -2"
    solution: "x = 4"
    explanation: "Add 6 to both sides."
  - prompt: "Solve: x - (-7) = 10"
    solution: "x = 3"
    explanation: "Subtracting -7 means adding 7, so subtract 7 from both sides."
  - prompt: "Solve: 4x = 20"
    solution: "x = 5"
    explanation: "Divide both sides by 4."
  - prompt: "Solve: -4x = 20"
    solution: "x = -5"
    explanation: "Divide both sides by -4."
  - prompt: "Solve: -x = 9"
    solution: "x = -9"
    explanation: "Multiply or divide both sides by -1."
  - prompt: "Solve: x / 3 = -4"
    solution: "x = -12"
    explanation: "Multiply both sides by 3."
applications:
  - title: "Checking answers"
    description: "One-step equations teach how to isolate a variable and then check by substitution."
  - title: "Two-step equations"
    description: "Two-step equations are solved by chaining together one-step inverse operations."
  - title: "Real-world unknowns"
    description: "Simple unknown quantities such as missing costs, distances, or scores can often be modeled by one-step equations."
  - title: "Formula rearranging"
    description: "Solving for one variable starts with the same inverse-operation logic used here."
