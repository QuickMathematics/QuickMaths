        mastery_requires_review_pass: false
      explanation_template: |
        Start with {a}x = {c}.
        Divide both sides by {a}.
        x = {x}.
      mistake_tags:
        - inverse_operations
        - division_error
        - arithmetic_error
      difficulty: easy

    - id: ONE_STEP_DIV_001
      type: generated
      prompt_template: "Solve for x: x/{a} = {c}"
      answer_mode: final_plus_required_work
      variables:
        x:
          type: int
          min: -60
          max: 60
          exclude: [0]
        a:
          type: int
          min: 2
          max: 12
      constraints:
        - "x % a == 0"
      derived:
        c: "x // a"
      answer:
        type: equation_solution
        variable: x
        value: "{x}"
      grading:
        method: equation_solution
      work:
        mode: procedural_steps
        prompt: "Show each equation step, ending with x = your final answer."
        line_type: equation
        target_variable: x
        minimum_steps: 2
        require_final_answer_match: true
      review_policy:
        work_review: auto
        mastery_requires_review_pass: false
      explanation_template: |
