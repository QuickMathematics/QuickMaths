theory: 'The Pythagorean theorem belongs to right triangles. If the legs meet at the marked 90-degree
  angle and c is the side opposite that angle, the hypotenuse, then a^2 + b^2 = c^2. The hypotenuse is
  always the longest side and is never one of the two legs. A label saying “triangle” is not enough; a
  right-angle mark or an explicitly stated right angle is required before applying the theorem.


  To find a hypotenuse, add the squares of the legs and take the positive square root: c = sqrt(a^2 +
  b^2). To find a missing leg, subtract the known leg square from the hypotenuse square: a = sqrt(c^2
  - b^2). The positive root is used for a length. Keep exact radicals when a square root is not an integer.
  For legs 5 and 12, c = sqrt(25+144) = 13. For legs 3 and 4, c = 5. For legs 6 and 8, c = 10. For legs
  1 and 1, c = sqrt(2), which should not be changed to a rounded decimal unless requested.


  The converse tests whether a triangle is right when all three side lengths are known. Put the longest
  side c first. If a^2 + b^2 = c^2, the triangle is right. If a^2 + b^2 > c^2, the largest angle is acute;
  if a^2 + b^2 < c^2, the largest angle is obtuse. The converse is a statement about side lengths and
  the angle opposite the longest side. Do not compare an arbitrary pair of sides or forget to identify
  the largest length.


  A coordinate distance problem becomes a right triangle by drawing horizontal and vertical helper segments
  between two points. For A(x1,y1) and B(x2,y2), the horizontal leg has length |x2-x1| and the vertical
  leg has length |y2-y1|. The distance is d = sqrt((x2-x1)^2 + (y2-y1)^2). Absolute values give nonnegative
  leg lengths, but squaring makes the sign irrelevant in the final formula. A negative run or rise simply
  records direction; distance itself is positive.


  Coordinate grids are visual aids, not permission to count inaccurately. Read the ordered pairs, subtract
  corresponding coordinates, and square both differences. The formula is symmetric: reversing A and B
  changes the signs but not the distance. Horizontal points with equal y have distance |delta x|, and
  vertical points with equal x have distance |delta y|. A point and the origin use d = sqrt(x^2 + y^2),
  which is the same right-triangle idea.


  Exact form communicates structure. sqrt(50) simplifies to 5sqrt(2) because 50 = 25*2. sqrt(72) = 6sqrt(2).
  Do not write sqrt(50) as 25sqrt(2), and do not replace an exact radical with 7.07 when the prompt asks
  for exact form. A calculator approximation is useful for checking magnitude, but it is not the exact
  answer.


  In a word problem, first decide whether the requested segment is a right-triangle hypotenuse, a leg,
  or a coordinate distance. A ladder against a vertical wall forms a right triangle only if the wall and
  ground are perpendicular. A diagonal of a rectangle is a hypotenuse because adjacent sides meet at right
  angles. A diagonal of a general parallelogram is not automatically covered by Pythagoras; extra right-angle
  information is needed. Similarly, an arbitrary triangle with three side lengths needs the converse or
  another theorem, not an invented right angle.


  Visual justification is part of the method. Mark the right angle, draw the two helper legs, and name
  the hypotenuse opposite the right angle. Then write the equation before substituting numbers. Check
  that a computed hypotenuse is longer than either leg and that a computed leg is shorter than the hypotenuse.
  For coordinates, check whether the result is at least as large as each absolute coordinate change.


  A visual proof can use a square dissection. Make a large square of side a+b and place four congruent
  right triangles with legs a and b around a central square of side c. The four triangles have total area
  4(ab/2), so comparing the large square with its pieces gives (a+b)^2 = 4(ab/2) + c^2 and therefore a^2
  + b^2 = c^2. For coordinate distance, the horizontal and vertical helper segments are the same perpendicular
  legs in this dissection idea.


  Self-check: Is there an actual right angle? Did I put the longest side on the c^2 side? Did I use positive
  lengths and simplify radicals exactly? For a converse, did I compare the two shorter squares with the
  longest square? For coordinates, did I subtract x-values from x-values and y-values from y-values?

  '
