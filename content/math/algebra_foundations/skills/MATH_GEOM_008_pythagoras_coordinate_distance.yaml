examples:
- prompt: Find the hypotenuse of a right triangle with legs 6 and 8.
  solution: 10.0
  explanation: sqrt(6^2+8^2) = sqrt(100) = 10.
- prompt: Find the missing leg when the hypotenuse is 13 and one leg is 5.
  solution: 12.0
  explanation: sqrt(13^2-5^2) = sqrt(144) = 12.
- prompt: Find the exact hypotenuse for legs 1 and 1.
  solution: sqrt(2).
  explanation: sqrt(1+1) = sqrt(2), which is already exact.
- prompt: Simplify sqrt(72).
  solution: 6sqrt(2).
  explanation: 72 = 36*2, so sqrt(72) = 6sqrt(2).
- prompt: Do sides 7, 24, and 25 form a right triangle?
  solution: Yes.
  explanation: 7^2 + 24^2 = 49 + 576 = 625 = 25^2.
- prompt: Find the distance from (2, -1) to (8, 7).
  solution: 10.0
  explanation: Changes are 6 and 8, so d = sqrt(36+64) = 10.
- prompt: Find the distance from (-3, 4) to (5, 4).
  solution: 8.0
  explanation: The points share y, so the horizontal distance is |5 - (-3)| = 8.
- prompt: A rectangle is 9 m by 12 m. Find its diagonal.
  solution: 15 m.
  explanation: The diagonal is sqrt(9^2+12^2) = 15.
- prompt: Can Pythagoras find an arbitrary triangle's side from two sides 5 and 7?
  solution: No.
  explanation: Without a right angle or included-angle information, the right-triangle equation is not
    justified.
- prompt: Compare the largest angle in side lengths 5, 6, and 8.
  solution: Obtuse.
  explanation: 5^2+6^2=61 < 64=8^2, so the converse says the largest angle is obtuse.
applications:
- title: Accessibility ramps
  description: A horizontal run and vertical rise form legs of a right triangle, giving the exact ramp
    length.
- title: Surveying and mapping
  description: Coordinate distance estimates a straight separation from east-west and north-south changes.
- title: Construction diagonals
  description: A rectangle diagonal checks squareness when its side lengths are known.
- title: Navigation and robotics
  description: Grid movement can be converted into a direct distance while preserving direction signs
    separately.
