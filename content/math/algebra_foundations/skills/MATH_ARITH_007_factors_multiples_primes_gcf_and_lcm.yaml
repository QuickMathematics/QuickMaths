          weight: 2
        - id: criterion_2
          description: Shows that 24 is a common multiple of 8 and 12.
          weight: 2
        - id: criterion_3
          description: Explains why 8, 12, or any smaller positive time is not a common multiple, so 24 is
            least, with seconds stated.
          weight: 2
    review_policy:
      work_review: tutor_required
      mastery_requires_review_pass: true
      allow_self_review: false
    explanation_template: Multiples of 8 are 8, 16, 24; multiples of 12 are 12, 24. Therefore the first positive
      shared time is LCM(8,12)=24 seconds.
    mistake_tags:
    - capstone_reasoning
    - model_selection
