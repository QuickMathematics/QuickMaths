theory: 'Factors and multiples describe how whole numbers are built and repeated. A factor of n is a whole
  number that divides n with no remainder. If 4 times 9 = 36, then 4 and 9 are factors of 36, while 36 is a
  multiple of both 4 and 9. The word factor names the parts of a product; multiple names a result in a skip-counting
  sequence. Zero is a multiple of every whole number because 0 times k = 0, but zero is not a factor of any
  number because division by zero is undefined.


  To list factors, test whole numbers in pairs. For 36, start at 1: 1 times 36, 2 times 18, 3 times 12, and
  4 times 9. Once the smaller factor passes the square root, the pairs repeat in reverse, so the complete positive
  list is 1, 2, 3, 4, 6, 9, 12, 18, 36. A factor-pair check is safer than guessing divisors: every claimed
  factor must multiply by its partner to make the target, and no pair should be counted twice. A square number
  such as 49 has a middle pair 7 times 7, so that factor appears once in the list even though it supplies both
  positions in the pair.


  Prime numbers have exactly two positive factors, 1 and themselves. The number 2 is the only even prime. One
  is neither prime nor composite because it has only one positive factor. A composite number has at least one
  additional factor; 15 has 1, 3, 5, and 15. To test whether a number n is prime, try divisors up to the square
  root of n. If none divides evenly, no larger factor can appear without a smaller partner already found. This
  makes a short, reasoned test instead of a long list of guesses. Divisibility shortcuts help: a number divisible
  by 2 is even; one ending in 0 or 5 is divisible by 5; a number whose digit sum is divisible by 3 is divisible
  by 3.


  Prime factorization writes a composite number as a product of primes. Factor 84 by splitting 84 = 2 times
  42, then 42 = 2 times 21, and 21 = 3 times 7. Thus 84 = 2 times 2 times 3 times 7, or 2 squared times 3 times
  7. The order of factors does not matter, but every factor must be prime at the end. A factor tree is a record
  of choices, not a different answer: splitting 84 as 6 times 14 eventually gives the same multiset of prime
  factors. Multiplying the primes back together checks the factorization.


  The greatest common factor (GCF) of two or more numbers is the largest positive factor they share. For 24
  and 36, the common factors include 1, 2, 3, 4, 6, and 12, so the GCF is 12. A factor-list method is transparent
  for small numbers. A prime-factor method is efficient for larger numbers: write each number in primes, keep
  only primes that appear in every number, and use the smallest exponent. The GCF is useful for making equal
  groups as large as possible or simplifying a fraction without changing its value.


  The least common multiple (LCM) is the smallest positive number that belongs to both multiple lists. Multiples
  of 6 are 6, 12, 18, 24, 30; multiples of 8 are 8, 16, 24, so the LCM is 24. With prime factors, keep every
  prime using the largest exponent appearing in any number. For 12 = 2 squared times 3 and 18 = 2 times 3 squared,
  the LCM is 2 squared times 3 squared = 36. The LCM answers repeat-together questions; the GCF answers shared-building
  questions. They can be linked by GCF(a,b) times LCM(a,b) = a times b for positive a and b, which is a useful
  check rather than a replacement for understanding.


  Read the context before choosing GCF or LCM. If 48 red beads and 60 blue beads must be split into identical
  bags with no leftovers, the greatest possible number of bags is GCF(48,60) = 12. If a red light flashes every
  8 seconds and a blue light every 12 seconds and both flash now, the next simultaneous flash is after LCM(8,12)
  = 24 seconds. For a factor question, ask “what equal groups fit exactly?” For a multiple question, ask “when
  does this repeated step land?” A number can be a factor of one target and a multiple of another; the roles
  depend on the sentence.


  Explain your method with a product, list, or prime record. Do not call 1 prime, stop a factor tree with a
  composite leaf, or choose a large common factor that is not actually common. The capstone asks you to model
  a repeated schedule and justify why the first shared time is the least common multiple.'
examples:
- prompt: List the positive factor pairs of 36.
  solution: 1×36, 2×18, 3×12, 4×9, 6×6
  explanation: Each pair multiplies to 36; after 6×6, the pairs reverse.
- prompt: Is 29 prime or composite?
  solution: Prime
  explanation: Only 1 and 29 divide it; testing primes through √29 is enough.
- prompt: Write 84 as a product of prime factors.
  solution: 2×2×3×7
  explanation: Split 84 into 2×42 and 42 into 2×3×7; every final factor is prime.
- prompt: Find the GCF of 24 and 36.
  solution: '12'
  explanation: The shared factors end at 12, or keep 2²×3 from both prime factorizations.
- prompt: Find the LCM of 6 and 8.
  solution: '24'
  explanation: 24 is the first number in both multiple lists.
- prompt: Why is 1 neither prime nor composite?
  solution: It has exactly one positive factor.
  explanation: Prime requires exactly two positive factors; composite requires more than two.
- prompt: What is the first positive multiple of every whole number?
  solution: The number itself
  explanation: For positive k, 1×k=k, and no positive multiple is smaller.
- prompt: Use divisibility to decide whether 735 is divisible by 3.
  solution: 'Yes'
  explanation: 7+3+5=15, and 15 is divisible by 3.
- prompt: What is the GCF useful for when making equal groups?
  solution: The largest possible group count or shared size, depending on what is being grouped.
  explanation: 'Translate the nouns: GCF captures the greatest exact sharing structure.'
- prompt: Two bells ring every 9 and 15 minutes. When do they ring together again?
  solution: 45 minutes
  explanation: The first shared positive multiple is LCM(9,15)=45.
applications:
- title: Packing equal kits
  description: A coordinator uses a GCF to make the largest number of identical kits from several inventories
    without leftovers.
- title: Repeating signals
  description: Traffic lights, alarms, and machine cycles use LCM reasoning to predict the next simultaneous
    event.
- title: Tiling and arrays
  description: Factor pairs describe the possible rectangular rows and columns of a fixed collection of tiles.
- title: Fraction simplification
  description: The GCF removes a common factor from numerator and denominator while preserving the represented
    quantity.
