        min: 4
        max: 8
    derived:
      total: p*q
    constraints: []
    answer:
      type: numeric
      value: '{total}'
    grading:
      method: exact_numeric
    work:
      mode: none
    review_policy:
      work_review: none
      mastery_requires_review_pass: false
      allow_self_review: true
    explanation_template: Multiply rows by markers per row; the result is the requested total count.
    mistake_tags:
    - factors
    - multiplication
