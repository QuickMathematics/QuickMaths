[project]
name = "quick-maths"
version = "0.3.0"
description = "Browser-first mastery learning with WebMCP tutoring and a local Git bridge."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "networkx>=3.2",
    "pyyaml>=6.0",
    "sympy>=1.12",
]

[project.scripts]
quickmaths = "quickmaths.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.poetry]
package-mode = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
