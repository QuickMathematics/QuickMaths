[project]
name = "quick-maths"
version = "0.2.0"
description = "Local-first mastery testing and prerequisite mapping for AI-assisted STEM learning."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "networkx>=3.2",
    "pyyaml>=6.0",
    "authlib>=1.3.2",
    "google-api-python-client>=2.130",
    "google-auth>=2.29",
    "google-auth-oauthlib>=1.2",
    "streamlit>=1.59",
    "streamlit-agraph>=0.0.45",
    "sympy>=1.12",
]

[project.scripts]
quickmaths = "quickmaths.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.poetry]
package-mode = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
