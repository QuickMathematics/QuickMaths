id: MATH_FORMAL_002
name: Kernel-backed algebra and calculus proofs
domain: Math
subdomain: Proof Foundations
description: Experimental QuickMaths formal-proof examples using declarative lesson metadata and the isolated Lean verifier.
prerequisites: []
tags:
  - proof
  - algebra
  - calculus
  - formal verification
mastery:
  passing_score: 0.8
  minimum_confidence: 3
  review_after_days_if_mastered: 14
  review_after_days_if_learning: 2
theory: |
  A formal QuickMaths question keeps three things separate: the displayed mathematical statement,
  the learner's submitted steps, and the kernel certificate. A candidate proof is not called verified
  unless the exact bound statement and submission are accepted by the pinned Lean environment.
examples:
  - prompt: "Why must x != 3 be retained when cancelling x - 3?"
    solution: "Because cancellation is only valid where the cancelled factor is nonzero."
    explanation: "The simplified formula and the original rational expression do not have the same domain."
test:
  question_count: 46
  randomize_order: false
  questions:
    - id: FORMAL_GUARDED_CANCEL_001
      type: fixed
      prompt: "For real x with x ≠ 3, simplify (x² - 9)/(x - 3)."
      answer_mode: final_only
      answer:
        type: expression
        value: "x + 3"
      grading:
        method: symbolic_expression
      work:
        mode: none
      review_policy:
        work_review: optional
        mastery_requires_review_pass: false
      proof_spec:
        version: "0.1"
        statement:
          declarations:
            - "x:real"
          assumptions:
            - "x != 3"
          goal: "(x^2 - 9)/(x - 3) = x + 3"
        parameter_contract:
          required_public: []
        allowed_rules:
          - sub_ne_zero_from_ne
          - field_identity
        assessment_policy:
          formal_mode: experimental_companion
          required_method: guarded_cancellation
        reference_proof:
          mode: steps
          steps:
            - claim: "x - 3 != 0"
              rule: sub_ne_zero_from_ne
              premises: [h1]
            - claim: "(x^2 - 9)/(x - 3) = x + 3"
              rule: field_identity
              premises: [reference_step_1]
        environment:
          backend: "lean4"
          toolchain: "leanprover/lean4:v4.34.0-rc2"
          library: mathlib
          library_revision: "42a3845c6d7ec6866eefa4cc327a306a0c4a7d3c"
      explanation_template: |
        Factor the numerator, retain x ≠ 3, then cancel the nonzero factor.
      mistake_tags:
        - lost_domain_restriction

