name: Full test suite

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-test-suite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run Python suite
        run: python -m pytest -q
      - name: Run browser and WebMCP suite
        run: node --test docs/*.test.js
      - name: Run community callback suite
        run: node --test community-worker/src/*.test.js
