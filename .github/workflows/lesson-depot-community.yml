name: Refresh Lesson Depot community totals

on:
  push:
    branches: [main]
    paths:
      - "docs/lesson-depot/catalog.json"
      - "scripts/sync_depot_community.mjs"
      - ".github/workflows/lesson-depot-community.yml"
  discussion:
    types: [created, edited, deleted]
  discussion_comment:
    types: [created, edited, deleted]
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  discussions: write

concurrency:
  group: lesson-depot-index-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Read GitHub Discussions totals
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sync_depot_community.mjs docs/lesson-depot
      - name: Rebuild the public catalog
        run: python -m scripts.lesson_depot docs/lesson-depot --output docs/lesson-depot
      - name: Commit refreshed counts
        run: |
          if git diff --quiet -- docs/lesson-depot/community.json docs/lesson-depot/catalog.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/lesson-depot/community.json docs/lesson-depot/catalog.json
          git commit -m "Refresh Lesson Depot community totals"
          git push
