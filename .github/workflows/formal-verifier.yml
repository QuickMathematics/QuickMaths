name: Formal verifier kernel gate

on:
  pull_request:
    paths:
      - "formal-verifier/**"
      - "quickmaths/formal_*.py"
      - "docs/formal-*.js"
      - "docs/lesson-creator.js"
      - "docs/challenge-core.js"
      - "scripts/export_web_curriculum.py"
      - "schemas/**"
      - ".github/workflows/formal-verifier.yml"
  push:
    branches:
      - main
      - "codex/**"
    paths:
      - "formal-verifier/**"
      - ".github/workflows/formal-verifier.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: formal-verifier-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kernel:
    name: Pinned Lean kernel acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install formal verifier tests
        run: python -m pip install -e ".[dev]" -e "./formal-verifier[dev]"

      - name: Set up Node for real app integration
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run trust-boundary unit suite
        run: python -m pytest -q formal-verifier/tests

      # Keep this action pinned.  It installs the toolchain named by
      # formal-verifier/lean-toolchain and restores mathlib's binary cache.
      - name: Install pinned Lean and mathlib cache
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          auto-config: false
          lake-package-directory: formal-verifier
          use-github-cache: false
          use-mathlib-cache: true

      - name: Build checked Lean corpus
        working-directory: formal-verifier
        run: ~/.elan/bin/lake build QuickMathsFormal

      - name: Kernel-check generated acceptance artifacts
        run: python formal-verifier/scripts/kernel_batch_check.py

      - name: Verify per-request certificate and rejection path
        run: >-
          python formal-verifier/scripts/kernel_acceptance.py
          --fixture guarded_cancellation.json
          --fixture polynomial_derivative.json
          --fixture conjugate_limit.json
          --fixture series_geometric_half_sum.json

      - name: Exercise actual companion and app assessment
        run: python scripts/test_formal_learning_http.py

      - name: Verify shipped references and actual replay
        run: python scripts/check_formal_references.py
